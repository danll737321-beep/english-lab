title:"The Joy Luck Club",author:"Amy Tan · 1989",blurb:"Mothers and daughters, culture, identity",cite:"author and page, e.g., (Tan 67)",
bg:["Amy Tan’s first novel, published in 1989. Tan was born in Oakland, California, to Chinese immigrant parents, and drew on her relationship with her mother, who had left children behind in China, for many of the novel’s stories. A film version appeared in 1993.",
"The novel is made of sixteen connected stories in four sections. Four Chinese immigrant mothers who meet to play mahjong in San Francisco — the Joy Luck Club — and their four American-born daughters each tell stories from their own lives.",
"The mothers lived through war, arranged marriages and the loss of family in China in the 1930s and 1940s. Their daughters grew up in America in the 1950s–1980s. Content note: the novel includes suicide, the death of children, domestic abuse and depression."],
sum:[["Feathers from a Thousand Li Away (mothers’ childhoods)","June Woo takes her late mother Suyuan’s place at the mahjong table. She learns that Suyuan started the first Joy Luck Club in wartime Kweilin to keep hope alive. The other mothers reveal that Suyuan’s twin daughters from her first marriage, left behind as babies during the war, have been found alive in China, and they want June to go meet them. The other mothers then tell stories of their own childhoods in China: An-mei remembers her disgraced mother returning home, Lindo describes how she cleverly escaped an arranged marriage, and Ying-ying recalls getting lost during the Moon Festival."],
["The Twenty-Six Malignant Gates (daughters’ childhoods)","The daughters remember growing up. Waverly Jong becomes a chess champion but clashes with her mother’s pride. Rose Hsu Jordan blames herself when her little brother drowns at the beach. Lena St. Clair senses her mother Ying-ying’s depression. June recalls her mother pushing her to become a child prodigy, which ends in a disastrous piano recital and a painful argument."],
["American Translation (daughters as adults)","As adults, the daughters face problems in marriage and careers. Rose’s marriage is ending because she cannot make decisions. Lena and her husband split every cost equally, hiding a deep unfairness. Waverly fears her mother will criticize her fiancé. June feels she is always a disappointment. Each daughter misunderstands her mother, and each mother struggles to share her strength."],
["Queen Mother of the Western Skies (mothers today)","The mothers tell how they survived. An-mei explains that her mother’s suicide gave her the strength to speak up. Lindo reflects on having two faces, one Chinese and one American, while Waverly worries about their trip to China. Ying-ying admits she lost her spirit after a painful first marriage and decides to help Lena find hers. Finally, June travels to China with her father, learns her mother’s full story and meets her half-sisters, recognizing the part of herself that is Chinese."]],
chars:[["Suyuan Woo","Founder of the Joy Luck Club; determined, hopeful, died before the novel begins."],["Jing-mei ‘June’ Woo","Suyuan’s daughter; feels she never met her mother’s expectations."],["An-mei Hsu","Learned from her mother’s tragedy how to find her voice."],["Rose Hsu Jordan","An-mei’s daughter; struggles to stand up for herself."],["Lindo Jong","Clever and strong-willed; escaped an arranged marriage."],["Waverly Jong","Lindo’s daughter; a former chess prodigy, competitive and successful."],["Ying-ying St. Clair","Lost her sense of self after trauma; believes she can see what is coming."],["Lena St. Clair","Ying-ying’s daughter; caught in an unequal marriage."]],
themes:[["Mothers and daughters","Love and misunderstanding exist side by side. Each mother wants her daughter to have a better life, and each daughter struggles to understand what her mother sacrificed."],
["Cultural identity","The daughters feel caught between Chinese tradition and American life, and the mothers fear their daughters will lose their heritage."],
["Language and translation","Misunderstandings come from words that do not translate, and from feelings that are never said aloud."],
["Storytelling and memory","Telling stories becomes a way to pass down strength, history and identity."],
["Finding your voice","Many characters learn to speak up for themselves after years of silence."]],
syms:[["The swan feather","The hope Suyuan carries from China: a daughter who will speak perfect English and be valued."],
["Mahjong","A game of luck and strategy that brings the mothers together and keeps their hope alive."],
["Chess","Waverly’s ‘invisible strength,’ and the battle of wills between her and her mother."],
["The jade pendant","Suyuan’s gift to June, representing her mother’s belief in her value."]],
devs:[["Multiple narrators","Seven different voices tell sixteen stories, showing many sides of the same relationships."],
["Frame structure","Each section begins with a short parable that introduces its theme."],
["Vignettes","Short, separate stories combine to form a larger picture, like tiles in a mahjong game."],
["Symbolism","Objects such as the feather, the pendant and the chess pieces carry emotional meaning across generations."],
["Flashback","The mothers’ stories return to China to explain who they became."]],
ct:[{q:"Why do the mothers and daughters misunderstand each other?",claim:"Identify the main cause of conflict.",ev:"June’s piano recital; Waverly’s chess; Rose and An-mei’s talk about her marriage.",rs:"Consider language, culture and generational differences.",cc:"Is misunderstanding mostly the mothers’ fault or the daughters’?",m:"Model claim: The conflicts come less from lack of love than from different languages, cultures and expectations that neither side fully explains."},
{q:"How do the mothers’ pasts shape their parenting?",claim:"Connect a mother’s story to her daughter’s.",ev:"Choose one pair (e.g., An-mei and Rose, or Lindo and Waverly).",rs:"Show how past trauma or strength leads to specific hopes and fears for the daughter.",cc:"Are the mothers too controlling?",m:"Model claim: The mothers raise their daughters to have the strength they had to fight for, but their methods often hide the love behind them."},
{q:"Why does Tan tell this story through sixteen stories instead of one?",claim:"Analyze the novel’s structure.",ev:"The four sections and their parables; the movement from mothers to daughters and back.",rs:"Explain how multiple voices create a complete picture.",cc:"Does the structure make the novel harder to follow?",m:"Model claim: The structure mirrors a mahjong game, with each story a piece that only shows its meaning when combined with the others."},
{q:"Does June finally understand her mother?",claim:"Interpret the ending.",ev:"The opening Joy Luck Club meeting; the jade pendant; the trip to China.",rs:"Trace June’s understanding from guilt to connection.",cc:"Is it too late if her mother has already died?",m:"Model claim: June comes to understand her mother by finishing her mother’s story, showing that connection between generations can continue after death."},
{q:"What does the novel say about being Chinese American?",claim:"Argue the novel’s view of identity.",ev:"The daughters’ embarrassment about their mothers; Waverly’s trip plans; June’s arrival in China.",rs:"Explain how identity combines heritage and personal experience.",cc:"Some critics argue the novel presents China in an exotic way for Western readers. Is that fair?",m:"Model claim: Tan suggests that being Chinese American means carrying both cultures, and that understanding your parents’ past helps complete your own identity."},
{q:"Cross-text: Compare the novel with an interview of a first- or second-generation immigrant family today.",claim:"Argue what has changed and what has stayed the same.",ev:"The novel, plus a reliable interview or oral history about immigrant families.",rs:"Compare expectations, language and identity across generations.",cc:"Is the novel’s view of immigrant families still accurate today?",m:"Model claim: Many of the novel’s tensions, such as sacrifice, expectations and language, still appear in immigrant families today, even as the details have changed."}],
kz:{"Mothers and daughters":"母親與女兒","Cultural identity":"文化認同","Language and translation":"語言與翻譯","Storytelling and memory":"說故事與記憶","Finding your voice":"找到自己的聲音","The swan feather":"天鵝羽毛","Mahjong":"麻將","Chess":"西洋棋","The jade pendant":"玉墜","Multiple narrators":"多重敘事者","Frame structure":"框架結構","Vignettes":"小品故事","Symbolism":"象徵手法","Flashback":"倒敘"},
zh:{bg:["譚恩美的第一部小說，1989 年出版。譚恩美在加州奧克蘭出生，父母是中國移民；她的母親曾把孩子留在中國，小說的許多故事都取材自她與母親的關係。1993 年拍成電影。",
"小說由四個部分、十六個相互連結的故事組成。四位在舊金山聚會打麻將（「喜福會」）的中國移民母親，和她們四位在美國出生的女兒，各自講述自己生命中的故事。",
"母親們在 1930、40 年代的中國經歷過戰爭、包辦婚姻和失去家人；女兒們則在 1950 到 80 年代的美國長大。內容提醒：小說涉及自殺、孩子死亡、家庭暴力與憂鬱。"],
sum:["June Woo 接替已故母親 Suyuan 在麻將桌上的位置。她得知 Suyuan 在抗戰時期的桂林創立了第一個喜福會，為了讓希望延續。其他母親透露，Suyuan 在第一段婚姻中生下、在戰亂中被留下的雙胞胎女兒，已經在中國找到了，她們希望 June 去見她們。接著其他母親講述她們在中國的童年：An-mei 回憶蒙羞的母親回到家中，Lindo 描述她如何聰明地逃離包辦婚姻，Ying-ying 則想起自己在中秋節走失的經歷。",
"女兒們回憶成長經歷。Waverly Jong 成為西洋棋冠軍，卻與母親的驕傲發生衝突。Rose Hsu Jordan 的弟弟在海邊溺水，她一直自責。Lena St. Clair 察覺母親 Ying-ying 的憂鬱。June 回想母親逼她當神童，最後以一場災難般的鋼琴演奏和痛苦的爭吵收場。",
"長大後，女兒們在婚姻和事業上遇到困難。Rose 因為無法做決定，婚姻即將結束。Lena 和丈夫所有花費都平分，掩蓋了深層的不公平。Waverly 害怕母親會批評她的未婚夫。June 覺得自己永遠讓人失望。每個女兒都誤解了母親，每個母親也都努力想把自己的力量傳給女兒。",
"母親們講述自己如何活下來。An-mei 說明母親的自殺讓她得到發聲的力量。Lindo 思考自己的兩張臉，一張中國的、一張美國的，而 Waverly 正為她們的中國之行煩惱。Ying-ying 坦承在痛苦的第一段婚姻後失去了靈魂，決定幫 Lena 找回她的。最後，June 和父親前往中國，了解母親完整的故事，見到同母異父的姊姊們，認出了自己身上屬於中國的那一部分。"],
chars:["喜福會創辦人；堅毅、充滿希望，在小說開始前已過世。","Suyuan 的女兒；覺得自己從未達到母親的期望。","從母親的悲劇中學會找到自己的聲音。","An-mei 的女兒；很難為自己挺身而出。","聰明又意志堅強；逃離了包辦婚姻。","Lindo 的女兒；曾是西洋棋神童，好勝又成功。","在創傷後失去了自我；相信自己能預見未來。","Ying-ying 的女兒；困在不平等的婚姻中。"],
themes:["愛與誤解並存。每個母親都希望女兒過得更好，每個女兒都努力理解母親的犧牲。","女兒們夾在中國傳統與美國生活之間，母親們則擔心女兒會失去自己的文化傳承。","誤解來自無法翻譯的字詞，以及從未說出口的感受。","說故事成為傳承力量、歷史和身分的方式。","許多角色在多年沉默後，學會為自己發聲。"],
syms:["Suyuan 從中國帶來的希望：一個能說完美英語、被人重視的女兒。","一個講求運氣與策略的遊戲，讓母親們聚在一起，延續希望。","Waverly 的「無形力量」，也是她和母親之間意志的較量。","Suyuan 送給 June 的禮物，代表母親相信她的價值。"],
devs:["七個不同的聲音講述十六個故事，呈現同一段關係的不同面向。","每個部分以一則短寓言開頭，引出該部分的主題。","簡短、各自獨立的故事組合成更大的圖像，就像麻將牌一樣。","羽毛、玉墜和棋子等物件，跨越世代承載情感意義。","母親們的故事回到中國，解釋她們如何成為今天的自己。"],
ct:[{q:"母親和女兒為什麼會互相誤解？",claim:"找出衝突的主要原因。",ev:"June 的鋼琴演奏；Waverly 的西洋棋；Rose 與 An-mei 談她的婚姻。",rs:"考慮語言、文化與世代差異。",cc:"誤解主要是母親的錯，還是女兒的錯？",m:"參考論點：衝突並非來自缺乏愛，而是來自雙方都沒有充分解釋的不同語言、文化與期望。"},
{q:"母親們的過去如何影響她們教養孩子的方式？",claim:"把一位母親的故事和她女兒的故事連結起來。",ev:"選一對母女（例如 An-mei 和 Rose，或 Lindo 和 Waverly）。",rs:"說明過去的創傷或力量，如何形成對女兒具體的希望與恐懼。",cc:"母親們是否控制欲太強？",m:"參考論點：母親們希望女兒擁有她們當年必須奮力爭取的力量，但她們的方法常常掩蓋了背後的愛。"},
{q:"譚恩美為什麼用十六個故事，而不是一個故事來寫？",claim:"分析小說的結構。",ev:"四個部分和它們的寓言；從母親到女兒、再回到母親的移動。",rs:"說明多重聲音如何拼出完整的圖像。",cc:"這種結構會讓小說更難讀懂嗎？",m:"參考論點：這個結構就像一局麻將，每個故事都是一張牌，只有和其他牌組合起來才顯出意義。"},
{q:"June 最後理解她的母親了嗎？",claim:"詮釋結局。",ev:"開頭的喜福會聚會；玉墜；中國之行。",rs:"追蹤 June 的理解如何從罪惡感走向連結。",cc:"母親已經過世，會不會太遲了？",m:"參考論點：June 透過完成母親的故事來理解母親，顯示世代之間的連結在死後仍能延續。"},
{q:"這部小說對身為華裔美國人說了什麼？",claim:"論證小說對身分的看法。",ev:"女兒們對母親感到難為情；Waverly 的旅行計畫；June 抵達中國。",rs:"說明身分如何結合文化傳承與個人經驗。",cc:"有些評論者認為小說以異國情調的方式向西方讀者呈現中國。這樣說公平嗎？",m:"參考論點：譚恩美暗示，身為華裔美國人就是同時承載兩種文化，而理解父母的過去有助於完整自己的身分。"},
{q:"跨文本：把這部小說和一篇當代第一代或第二代移民家庭的訪談做比較。",claim:"論證什麼改變了、什麼沒有改變。",ev:"小說本身，加上一篇關於移民家庭的可靠訪談或口述歷史。",rs:"比較不同世代之間的期望、語言與身分。",cc:"小說對移民家庭的描寫在今天仍然準確嗎？",m:"參考論點：小說中的許多張力，例如犧牲、期望與語言，今天仍出現在移民家庭中，只是細節已經改變。"}]}};

title:"Persepolis: The Story of a Childhood",author:"Marjane Satrapi · 2000 / 2003",blurb:"Graphic memoir, revolution, growing up",cite:"author and page, e.g., (Satrapi 52)",
bg:["Persepolis is a graphic memoir — a true story told in comics. Marjane Satrapi was born in Iran in 1969. The book was first published in French in 2000 and in English in 2003; an animated film followed in 2007. The title refers to the ancient Persian capital, connecting Satrapi’s story to Iran’s long history.",
"The memoir covers about 1979 to 1984, from age ten to fourteen. In 1979, the Iranian Revolution overthrew the Shah, and an Islamic Republic took power. In 1980, Iraq invaded Iran, starting an eight-year war.",
"Marji’s parents are educated and politically progressive, and her family includes political prisoners and relatives who were executed. Content note: the book depicts torture, executions and bombings in simple black-and-white drawings."],
sum:[["The Veil · The Bicycle","In 1980, ten-year-old Marji must wear a veil at school, where boys and girls are now separated. She dreams of becoming a prophet and talks with God. Her parents protest against the Shah, and Marji begins learning about revolution, social class and her family’s royal ancestry."],
["The Water Cell · Persepolis · The Letter","Marji learns about the Shah’s cruelty and her grandfather’s imprisonment. Political prisoners are released after the revolution and describe torture. She sees how social class shapes lives when her family’s maid is not allowed to love a neighbor’s son because of her class."],
["The Heroes · Moscow · The Sheep","Marji’s Uncle Anoosh, a communist revolutionary, tells her about his years in exile. Under the new regime, he is arrested again. Marji is the only visitor he chooses to see before he is executed, and she loses faith in God for a time."],
["The Trip · The F-14s · The Jewels","The Islamic Republic tightens control: universities close, rules on dress become stricter and the Iran–Iraq War begins. Bombings hit Tehran, and Marji’s family shelters in the basement. Some neighbors flee abroad while others are killed."],
["The Key · The Wine · The Cigarette · Kim Wilde","Poor teenage boys are sent to the front with plastic ‘keys to paradise.’ Marji’s family hosts secret parties with homemade wine. She rebels in small ways — smoking, buying Western music tapes on the black market and wearing sneakers and a denim jacket — and is nearly arrested by the Guardians of the Revolution."],
["The Shabbat · The Dowry","A missile destroys a neighbor’s house, killing the Baba-Levy family; Marji sees a bracelet in the rubble. After Marji is expelled from one school and openly challenges a teacher at the next, her parents realize she is not safe in Iran and send her to Vienna, Austria, at fourteen. The book ends at the airport as her mother faints."]],
chars:[["Marji (Marjane Satrapi)","The narrator; curious, outspoken and rebellious."],["Marji’s mother (Taji)","Strong and protective; fears for Marji’s safety."],["Marji’s father (Ebi)","Educated and political; teaches Marji about history."],["Marji’s grandmother","Wise, funny and honest; teaches Marji integrity."],["Uncle Anoosh","Revolutionary uncle; executed by the regime."],["Mehri","The family’s maid; separated from her love by class."],["God","Marji’s childhood companion, with whom she talks."]],
themes:[["Coming of age under oppression","Marji grows up while her country changes violently, so her personal growth is tied to politics and history."],
["Freedom and resistance","Small acts such as music, clothing and words become forms of resistance against strict control."],
["Faith and doubt","Marji’s close relationship with God breaks when she faces injustice and loss."],
["Social class","Class divides people even in a revolution that promised equality."],
["Identity and belonging","Marji is both Iranian and influenced by the West, which makes her an outsider at school and later abroad."]],
syms:[["The veil","Government control over women and the loss of personal freedom."],
["The plastic key","False promises of paradise given to boys sent to die."],
["The bread swan","Anoosh’s gift, representing love and memory in the face of death."],
["Western music","Rebellion, youth and connection to the outside world."]],
devs:[["Graphic memoir","Words and images work together; simple drawings make violent events easier to look at while still powerful."],
["Black-and-white art","High contrast emphasizes good and evil, light and darkness, and the stark choices Marji faces."],
["Child narrator","Marji’s innocent perspective makes the adults’ violence and contradictions clear."],
["Symbolic imagery","Drawings of crowds, veils and blood show ideas beyond words."],
["Humor","Funny moments balance tragedy and show how people kept living normal lives."]],
ct:[{q:"How does the graphic novel form change how we understand the events?",claim:"Analyze the effect of images.",ev:"Choose three panels (e.g., the veil, the bread swan, the bombing).",rs:"Explain what the images do that words alone cannot.",cc:"Do simple drawings make serious events seem less serious?",m:"Model claim: Satrapi’s simple style makes terrible events visible without being unbearable, letting young readers face history."},
{q:"How does Marji’s faith change?",claim:"Trace Marji’s relationship with God.",ev:"The opening; Anoosh’s execution; her final conversations with God.",rs:"Explain how personal loss and political violence affect belief.",cc:"Is losing faith a sign of growth or of damage?",m:"Model claim: Marji’s faith breaks when she sees injustice, showing how political violence shapes even private beliefs."},
{q:"How do small acts of rebellion matter?",claim:"Argue the importance of everyday resistance.",ev:"Western music tapes; the secret parties; Marji’s clothing; her arguments at school.",rs:"Show how these acts express freedom under control.",cc:"Are these acts too small to matter?",m:"Model claim: Small acts of rebellion keep identity alive under oppression, even when they cannot change the government."},
{q:"Were Marji’s parents right to send her to Austria?",claim:"Take a position.",ev:"Marji’s expulsion; the Guardians of the Revolution; the bombing; the airport scene.",rs:"Weigh safety against family and home.",cc:"What does Marji lose by leaving?",m:"Model claim: Her parents made a painful but right choice, sacrificing their closeness to protect her freedom and safety."},
{q:"How does social class affect characters in a revolution?",claim:"Analyze class in the memoir.",ev:"Mehri’s story; the keys to paradise; Marji’s family’s privileges.",rs:"Consider who benefits and who suffers in political change.",cc:"Does Marji’s family recognize its own privilege?",m:"Model claim: The revolution promised equality, but poor families often paid the highest price, a contradiction Marji slowly learns to see."},

kz:{"Coming of age under oppression":"在壓迫中成長","Freedom and resistance":"自由與反抗","Faith and doubt":"信仰與懷疑","Social class":"社會階級","Identity and belonging":"身分認同與歸屬","The veil":"面紗","The plastic key":"塑膠鑰匙","The bread swan":"麵包天鵝","Western music":"西方音樂","Graphic memoir":"圖像回憶錄","Black-and-white art":"黑白畫風","Child narrator":"兒童敘事者","Symbolic imagery":"象徵意象","Humor":"幽默"},
zh:{bg:["《Persepolis》是一部圖像回憶錄：用漫畫講述的真實故事。Marjane Satrapi 1969 年生於伊朗。本書 2000 年以法文首次出版，2003 年出英文版，2007 年改編成動畫電影。書名指的是古波斯首都，把 Satrapi 的故事連結到伊朗悠久的歷史。",
"回憶錄涵蓋約 1979 到 1984 年，作者十到十四歲的時期。1979 年伊朗革命推翻國王，伊斯蘭共和國掌權。1980 年伊拉克入侵伊朗，展開長達八年的戰爭。",
"Marji 的父母受過良好教育、思想進步，家族中有政治犯，也有被處決的親人。內容提醒：書中以簡單的黑白畫面描繪酷刑、處決與轟炸。"],
sum:["1980 年，十歲的 Marji 在學校必須戴面紗，男生女生也被分開。她夢想成為先知，還會和上帝說話。她的父母參加反國王的抗議，Marji 開始學習革命、社會階級，以及家族的皇室血統。",
"Marji 得知國王的殘暴，以及祖父曾被關押。革命後政治犯獲釋，說出遭受的酷刑。家中女傭因為階級不同，不被允許愛上鄰居的兒子，讓她看到階級如何影響人生。",
"Marji 的叔叔 Anoosh 是共產主義革命者，向她講述流亡的歲月。新政權上台後他再次被捕。他在被處決前只選擇見 Marji 一人，Marji 因此一度失去對上帝的信仰。",
"伊斯蘭共和國加強控制：大學關閉、服裝規定更嚴，兩伊戰爭爆發。德黑蘭遭到轟炸，Marji 一家躲在地下室。有些鄰居逃到國外，有些則喪生。",
"貧窮的少年被送上前線，手上拿著塑膠做的「天堂鑰匙」。Marji 家偷偷舉辦有自釀葡萄酒的派對。她用小小的方式反抗：抽菸、在黑市買西方音樂錄音帶、穿球鞋和牛仔外套，還差點被革命衛隊逮捕。",
"一枚飛彈摧毀鄰居的房子，Baba-Levy 一家喪生；Marji 在瓦礫中看見一只手鐲。Marji 被一所學校退學、又在新學校公開挑戰老師後，父母明白她在伊朗並不安全，在她十四歲時把她送到奧地利維也納。書在機場結束，母親當場昏倒。"],
chars:["敘事者；好奇、敢言、叛逆。","堅強又保護女兒；擔心 Marji 的安全。","受過教育、關心政治；教 Marji 認識歷史。","睿智、風趣、誠實；教導 Marji 做人要正直。","革命者叔叔；遭政權處決。","家中的女傭；因階級而與所愛的人分開。","Marji 童年時的同伴，她常和祂說話。"],
themes:["Marji 成長時，她的國家正經歷暴烈的改變，因此她的個人成長與政治和歷史緊緊相連。","音樂、服裝和言語等小小的行為，成為對嚴格控制的反抗。","當 Marji 面對不公與失去時，她與上帝親密的關係破裂了。","即使在承諾平等的革命中，階級仍然把人分開。","Marji 既是伊朗人，又受到西方影響，使她在學校、後來在國外都是局外人。"],
syms:["政府對女性的控制，以及個人自由的喪失。","給被送去送死的男孩們的虛假天堂承諾。","Anoosh 的禮物，代表面對死亡時的愛與記憶。","叛逆、青春，以及與外面世界的連結。"],
devs:["文字與圖像相互配合；簡單的畫風讓暴力事件比較容易觀看，卻依然有力量。","強烈的黑白對比凸顯善與惡、光明與黑暗，以及 Marji 面對的嚴峻抉擇。","Marji 天真的視角，讓大人的暴力與矛盾一覽無遺。","人群、面紗和血的畫面，表達出文字以外的概念。","有趣的時刻平衡了悲劇，也顯示人們如何繼續過正常的生活。"],
ct:[{q:"圖像小說的形式如何改變我們理解這些事件的方式？",claim:"分析圖像的效果。",ev:"選三格畫面（例如面紗、麵包天鵝、轟炸）。",rs:"說明圖像做到了哪些單靠文字做不到的事。",cc:"簡單的畫風會讓嚴肅的事件顯得不那麼嚴肅嗎？",m:"參考論點：Satrapi 簡潔的畫風讓可怕的事件能被看見又不至於無法承受，使年輕讀者得以面對歷史。"},
{q:"Marji 的信仰如何改變？",claim:"追蹤 Marji 與上帝的關係。",ev:"開頭；Anoosh 被處決；她最後與上帝的對話。",rs:"說明個人的失去與政治暴力如何影響信仰。",cc:"失去信仰是成長的象徵，還是受傷的象徵？",m:"參考論點：Marji 看見不公後信仰破碎，顯示政治暴力甚至會影響最私密的信念。"},
{q:"小小的反抗行為有什麼意義？",claim:"論證日常反抗的重要性。",ev:"西方音樂錄音帶；秘密派對；Marji 的穿著；她在學校的爭論。",rs:"說明這些行為如何在控制下表達自由。",cc:"這些行為是否太小而沒有意義？",m:"參考論點：即使無法改變政府，小小的反抗仍能在壓迫中讓自我認同延續下去。"},
{q:"Marji 的父母把她送到奧地利是對的嗎？",claim:"表明立場。",ev:"Marji 被退學；革命衛隊；轟炸；機場一幕。",rs:"權衡安全與家人、家園。",cc:"Marji 離開失去了什麼？",m:"參考論點：父母做了痛苦但正確的選擇，犧牲彼此的親近，來保護她的自由與安全。"},
{q:"社會階級在革命中如何影響人物？",claim:"分析回憶錄中的階級問題。",ev:"Mehri 的故事；天堂鑰匙；Marji 家的特權。",rs:"想一想政治變革中誰受益、誰受苦。",cc:"Marji 的家人是否意識到自己的特權？",m:"參考論點：革命承諾平等，但窮人家庭往往付出最大代價，這個矛盾 Marji 慢慢才學會看見。"},
{q:"跨文本：把《Persepolis》和一篇關於當今伊朗女性權利的新聞報導做比較。",claim:"論證什麼改變了、什麼沒有改變。",ev:"回憶錄本身，加上一篇關於伊朗女性與抗議的可靠近期新聞。",rs:"比較規定、反抗與風險。",cc:"一部以 1980 年代為背景的回憶錄，能解釋當前事件嗎？",m:"參考論點：《Persepolis》呈現了爭取自由的鬥爭有多漫長、多切身，有助於理解今天的抗議。"}]}};

const MAUS={
title:"Maus I: A Survivor’s Tale",author:"Art Spiegelman · 1986",blurb:"Holocaust, memory, fathers and sons",cite:"author and page, e.g., (Spiegelman 84)",
bg:["Maus is a graphic memoir by the cartoonist Art Spiegelman, based on interviews with his father, Vladek, a Polish Jewish survivor of the Holocaust. It first appeared in parts in the magazine RAW starting in 1980; Maus I: My Father Bleeds History was published as a book in 1986, and Maus II in 1991. In 1992 Maus received a special Pulitzer Prize.",
"Spiegelman draws Jews as mice, Germans as cats and non-Jewish Poles as pigs. This animal metaphor echoes Nazi propaganda that portrayed Jews as vermin, and turns it against itself.",
"The book has two timelines: Vladek’s story in Poland from the mid-1930s to 1944, and Art’s visits to his aging father in New York in the late 1970s. Content note: Holocaust violence, the deaths of children and the suicide of Art’s mother. In 2022 a Tennessee school board removed Maus from its curriculum, sparking national debate."],
sum:[["The Sheik","In the present, Art visits his father Vladek in Rego Park, New York, and asks to hear his story. Vladek, a difficult and stingy old man, remarries after Art’s mother’s death and lives with Mala. In the past, young Vladek is a handsome textile salesman in Poland who marries Anja Zylberberg, the daughter of a wealthy family."],
["The Honeymoon · Prisoner of War","Vladek and Anja’s son Richieu is born, and Anja suffers severe depression and recovers in a sanatorium. As they travel, they see Nazi flags in Germany and hear of attacks on Jews. When war begins in 1939, Vladek is drafted into the Polish army, captured by the Germans and held as a prisoner of war before he returns home."],
["The Noose Tightens","Back in Sosnowiec, the Nazis take Jewish businesses, ration food and force Jews into a ghetto. Vladek survives by trading on the black market. Relatives are deported. In the present, Art finds a comic he once drew, Prisoner on the Hell Planet, about his mother Anja’s suicide in 1968 and his guilt."],
["Mouse Holes","To escape round-ups, the family hides in bunkers in attics and basements. Richieu is sent to stay with an aunt for safety; when the Nazis come, she poisons herself and the children rather than let them be sent to the gas chambers. Vladek and Anja go into hiding, paying Polish families and depending on luck."],
["Mouse Trap","Vladek and Anja try to escape to Hungary with the help of smugglers, but they are betrayed and arrested. They are sent to Auschwitz in 1944. In the present, Vladek admits he burned Anja’s diaries after her death. Art, furious that her voice is lost forever, calls his father a ‘murderer.’ Book I ends here; the story continues in Maus II."]],
chars:[["Vladek Spiegelman","Art’s father; resourceful survivor, now a difficult old man."],["Art Spiegelman","The author; struggles to understand and relate to his father."],["Anja Spiegelman","Vladek’s wife and Art’s mother; survived but died by suicide in 1968."],["Richieu","Vladek and Anja’s first son, who died during the war."],["Mala","Vladek’s second wife, also a survivor; frustrated by his stinginess."],["Tosha","Anja’s sister, who cares for Richieu."]],
themes:[["Memory and testimony","The book is about remembering: how stories survive, what gets lost, and who has the right to tell them."],
["Survival and its cost","Vladek survives through skill and luck, but survival leaves lasting damage on him and his family."],
["Fathers and sons","Art’s difficult relationship with Vladek shows how trauma passes from one generation to the next."],
["Dehumanization","The Nazis treat Jews as less than human; the animal drawings make this idea visible."],
["Guilt","Art feels guilt about his mother, his father and having an easier life than his parents."]],
syms:[["Animal masks","The idea that people are sorted into ‘species’ by race, a Nazi idea Spiegelman makes readers question."],
["Anja’s burned diaries","Lost memory and voices that history cannot recover."],
["The swastika road","Nazi power closing in on the Jews of Poland."],
["Richieu’s photo","The child who did not survive, and the ‘ghost brother’ Art can never compete with."]],
devs:[["Frame narrative","The story moves between Vladek’s past and Art’s present interviews."],
["Animal metaphor","Mice, cats and pigs turn Nazi propaganda into a tool for questioning it."],
["Graphic memoir","Images, panels and layout show memory, fear and silence."],
["Metafiction","Art shows himself making the book, asking whether the story can be told honestly."],
["Juxtaposition","Scenes from the Holocaust appear next to everyday family arguments in New York."]],
ct:[{q:"Why does Spiegelman draw people as animals?",claim:"Analyze the animal metaphor.",ev:"The mice and cats; the Polish pigs; Vladek and Anja disguised as Poles.",rs:"Explain how the metaphor shows and challenges Nazi ideas about race.",cc:"Does using animals make the story less serious?",m:"Model claim: Spiegelman uses Nazi labels against themselves, forcing readers to see how absurd and deadly it is to sort people into species."},
{q:"How does the Holocaust affect Art, who was not there?",claim:"Analyze intergenerational trauma.",ev:"Prisoner on the Hell Planet; Art’s conversations with Vladek; Richieu’s photo.",rs:"Show how trauma passes through family relationships.",cc:"Is it fair for Art to compare his pain to his parents’?",m:"Model claim: Art’s guilt and conflict with his father show that the Holocaust shaped even the children born after it."},
{q:"Is Vladek a hero, a survivor or both?",claim:"Evaluate Vladek.",ev:"His survival strategies in the war; his behavior in the present; burning Anja’s diaries.",rs:"Consider how the same qualities help him survive and hurt his family later.",cc:"Can we judge a survivor’s flaws?",m:"Model claim: Vladek’s resourcefulness saved his life, but the same habits now isolate him, showing that survival leaves scars."},
{q:"Why does Art show himself making the book?",claim:"Analyze the frame story.",ev:"The opening interview; Prisoner on the Hell Planet; the final ‘murderer’ scene.",rs:"Explain how the frame affects our trust in the story.",cc:"Does the frame distract from the Holocaust story?",m:"Model claim: Showing his own struggle makes Art an honest narrator who admits the limits of memory and representation."},
{q:"Should Maus be taught in high schools?",claim:"Take a position.",ev:"The book’s content; its form; the 2022 Tennessee school board decision and responses to it.",rs:"Weigh concerns about violence and language against the value of Holocaust education.",cc:"Answer the strongest objection, then rebut it.",m:"Model claim: Maus should be taught because its honesty about suffering is exactly what makes it a powerful way to learn history."},
{q:"Cross-text: Compare Maus with Night by Elie Wiesel.",claim:"Argue what each form reveals.",ev:"Maus I, plus Night (Grade 10 guide).",rs:"Compare first-hand memoir with a son’s retelling of his father’s story.",cc:"Is one form more truthful than the other?",m:"Model claim: Night gives the inside view of a survivor, while Maus shows how that experience lives on in the next generation."}],

zh:{bg:["《Maus》是漫畫家 Art Spiegelman 的圖像回憶錄，根據他對父親 Vladek 的訪談寫成；Vladek 是波蘭猶太人，也是大屠殺倖存者。作品 1980 年起在《RAW》雜誌連載；第一部《Maus I：我父親的血淚史》1986 年出版成書，第二部 1991 年出版。1992 年《Maus》獲得普立茲特別獎。",
"Spiegelman 把猶太人畫成老鼠、德國人畫成貓、非猶太裔的波蘭人畫成豬。這個動物隱喻呼應了納粹把猶太人描繪成害蟲的宣傳，並反過來用它來批判納粹。",
"本書有兩條時間線：Vladek 從 1930 年代中期到 1944 年在波蘭的故事，以及 1970 年代末 Art 在紐約探望年邁父親。內容提醒：大屠殺暴力、孩童死亡，以及 Art 母親的自殺。2022 年田納西州一個學區董事會把《Maus》從課程中移除，引發全國辯論。"],
sum:["現在的時間線中，Art 到紐約 Rego Park 探望父親 Vladek，請他講自己的故事。Vladek 是個難相處又吝嗇的老人，在 Art 母親死後再婚，和 Mala 一起生活。過去的時間線中，年輕的 Vladek 是波蘭英俊的紡織品推銷員，娶了富裕人家的女兒 Anja Zylberberg。",
"Vladek 和 Anja 的兒子 Richieu 出生，Anja 罹患嚴重的憂鬱症，在療養院中康復。旅途中，他們在德國看到納粹旗幟，聽到猶太人遭到攻擊的消息。1939 年戰爭爆發，Vladek 被徵召進波蘭軍隊，遭德軍俘虜，成為戰俘後才回到家。",
"回到 Sosnowiec 後，納粹奪走猶太人的生意、配給食物，並強迫猶太人住進隔離區。Vladek 靠黑市交易活了下來。親戚們被遣送走。現在的時間線中，Art 找到自己以前畫的漫畫〈地獄星球上的囚犯〉，內容是母親 Anja 在 1968 年自殺，以及他的罪惡感。",
"為了躲避搜捕，一家人藏身在閣樓和地下室的掩體中。為了安全，Richieu 被送去和一位阿姨同住；納粹來時，阿姨寧可毒死自己和孩子，也不讓他們被送進毒氣室。Vladek 和 Anja 躲藏起來，付錢給波蘭家庭，也仰賴運氣。",
"Vladek 和 Anja 試圖在走私者幫助下逃往匈牙利，卻遭到出賣被捕，1944 年被送進奧斯威辛。現在的時間線中，Vladek 承認在 Anja 死後燒掉了她的日記。Art 憤怒於母親的聲音永遠消失，罵父親是「兇手」。第一部到此結束，故事在《Maus II》中延續。"],
chars:["Art 的父親；機智的倖存者，如今是個難相處的老人。","作者；努力理解父親、與父親相處。","Vladek 的妻子、Art 的母親；倖存下來，卻在 1968 年自殺。","Vladek 和 Anja 的長子，死於戰爭期間。","Vladek 的第二任妻子，也是倖存者；對他的吝嗇感到挫折。","Anja 的姊姊，負責照顧 Richieu。"],
themes:["這本書講的是記憶：故事如何留存、什麼會失去，以及誰有權利講述。","Vladek 靠本事和運氣活下來，但倖存在他和家人身上留下長久的傷害。","Art 與 Vladek 艱難的關係，顯示創傷如何從一代傳到下一代。","納粹把猶太人當作次等人類；動物畫法讓這個概念清楚可見。","Art 對母親、父親，以及自己比父母過得輕鬆，都感到罪惡。"],
syms:["依種族把人分成不同「物種」的概念，這是 Spiegelman 讓讀者質疑的納粹思想。","失去的記憶，以及歷史無法找回的聲音。","納粹勢力逐步逼近波蘭的猶太人。","沒能活下來的孩子，也是 Art 永遠比不上的「幽靈哥哥」。"],
devs:["故事在 Vladek 的過去和 Art 現在的訪談之間來回移動。","老鼠、貓和豬把納粹宣傳變成質疑它的工具。","圖像、分格與版面呈現記憶、恐懼與沉默。","Art 呈現自己創作這本書的過程，追問這個故事能否被誠實地講述。","大屠殺的場景與紐約日常的家庭爭吵並列出現。"],
ct:[{q:"Spiegelman 為什麼把人畫成動物？",claim:"分析動物隱喻。",ev:"老鼠和貓；波蘭人是豬；Vladek 和 Anja 偽裝成波蘭人。",rs:"說明這個隱喻如何呈現、又如何挑戰納粹的種族觀念。",cc:"用動物來畫會讓故事不那麼嚴肅嗎？",m:"參考論點：Spiegelman 用納粹的標籤反過來批判納粹，迫使讀者看見把人分成不同物種有多荒謬、多致命。"},
{q:"沒有親身經歷的 Art，如何受到大屠殺的影響？",claim:"分析世代間的創傷。",ev:"〈地獄星球上的囚犯〉；Art 和 Vladek 的對話；Richieu 的照片。",rs:"說明創傷如何透過家庭關係傳遞。",cc:"Art 把自己的痛苦和父母的痛苦相比，公平嗎？",m:"參考論點：Art 的罪惡感和與父親的衝突顯示，大屠殺甚至影響了戰後才出生的孩子。"},
{q:"Vladek 是英雄、倖存者，還是兩者皆是？",claim:"評價 Vladek。",ev:"他在戰爭中的生存策略；他現在的行為；燒掉 Anja 的日記。",rs:"想一想同樣的特質如何幫他活下來，後來又傷害了家人。",cc:"我們能評判一位倖存者的缺點嗎？",m:"參考論點：Vladek 的機智救了他的命，但同樣的習慣如今讓他孤立，顯示倖存會留下傷痕。"},
{q:"Art 為什麼呈現自己創作這本書的過程？",claim:"分析框架故事。",ev:"開頭的訪談；〈地獄星球上的囚犯〉；最後罵「兇手」的一幕。",rs:"說明框架如何影響我們對故事的信任。",cc:"框架會分散對大屠殺故事的注意力嗎？",m:"參考論點：呈現自己的掙扎，讓 Art 成為誠實的敘事者，承認記憶與再現的限制。"},
{q:"高中應該教《Maus》嗎？",claim:"表明立場。",ev:"書的內容；它的形式；2022 年田納西州學區董事會的決定及各方回應。",rs:"權衡對暴力與用語的擔憂，以及大屠殺教育的價值。",cc:"回應最有力的反對意見，再加以反駁。",m:"參考論點：應該教《Maus》，因為它誠實呈現苦難，正是它成為學習歷史有力方式的原因。"},
{q:"跨文本：把《Maus》和 Elie Wiesel 的《Night》做比較。",claim:"論證兩種形式各自揭示了什麼。",ev:"《Maus I》，加上《Night》（十年級指南）。",rs:"比較第一手的回憶錄，與兒子重述父親的故事。",cc:"其中一種形式比另一種更真實嗎？",m:"參考論點：《Night》呈現倖存者的內在視角，而《Maus》呈現這段經歷如何在下一代身上延續。"}]}};
