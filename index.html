title:"Lord of the Flies",author:"William Golding · 1954",blurb:"Human nature, civilization vs. savagery",cite:"author and page, e.g., (Golding 64)",
bg:["William Golding’s first novel, published in 1954. Golding served in the Royal Navy during World War II, and the book reflects his belief, shaped by the war, that cruelty is part of human nature and not only a product of bad societies.",
"During an unnamed future war, a plane evacuating British schoolboys crashes on a deserted tropical island during an attack. No adults survive, so the boys, aged about six to twelve, must govern themselves.",
"The novel is often read as an allegory, in which each boy and object stands for a larger idea about society. Golding received the Nobel Prize in Literature in 1983. Content note: the novel includes the violent deaths of children."],
sum:[["Ch. 1–2 · The shell and the fire","Ralph finds a conch shell in a lagoon, and Piggy, an overweight, asthmatic boy with glasses, shows him how to blow it to call the others. The boys elect Ralph chief; Jack Merridew, leader of a choir, takes charge of the hunters. Ralph, Jack and Simon explore and confirm they are on an island, and Jack fails to kill a piglet. At an assembly they agree that whoever holds the conch may speak. A small boy with a birthmark claims to have seen a ‘beastie.’ The boys light a signal fire with Piggy’s glasses, but it spreads out of control, and the boy with the birthmark is never seen again."],
["Ch. 3–4 · Huts and painted faces","Ralph and Simon struggle to build shelters while Jack becomes obsessed with hunting. Simon goes off alone to a peaceful clearing in the jungle. Roger throws stones near a littlun but deliberately misses, still held back by the memory of rules. Jack paints his face with clay and feels free of shame. A ship passes, but the signal fire has gone out because the hunters left it to hunt. The hunters return chanting with a dead pig; Ralph is furious, and Jack hits Piggy, breaking one lens of his glasses."],
["Ch. 5–7 · The beast","At a tense assembly, the littluns’ fear of a beast spreads. Simon suggests the beast might be ‘only us,’ but the others laugh. Rules begin to break down. That night the body of a dead parachutist from an air battle drifts down onto the mountain; the twins Sam and Eric see it in the dark and believe it is the beast. On an expedition, Ralph wounds a boar and feels the thrill of the hunt, and a mock hunt turns rough. Ralph, Jack and Roger climb the mountain, see the shape of the dead parachutist and flee."],
["Ch. 8–9 · The gift and the death","Jack fails to get the boys to vote Ralph out, so he leaves to form his own tribe, and most of the older boys gradually follow him. His hunters kill a sow and leave its head on a stick as a gift for the beast. Alone, Simon has a vision in which the fly-covered pig’s head — the Lord of the Flies — tells him the beast is part of the boys themselves. Simon climbs the mountain, discovers the truth about the parachutist and runs down to tell the others. During a storm and a wild ritual dance at Jack’s feast, the boys, including Ralph and Piggy, mistake Simon for the beast and kill him."],
["Ch. 10–11 · The glasses and Castle Rock","Ralph and Piggy struggle with guilt. Jack’s tribe raids their camp at night and steals Piggy’s glasses, their only way to make fire. Ralph, Piggy and the twins go to Jack’s fortress at Castle Rock to demand them back. Piggy holds up the conch and pleads for reason. Roger levers a huge boulder down the cliff; it kills Piggy and shatters the conch. The twins are captured and forced to join the tribe."],
["Ch. 12 · Cry of the hunters","Alone, Ralph learns from the twins that the tribe will hunt him the next day and that Roger has sharpened a stick at both ends. The tribe sets the island on fire to smoke him out. Ralph runs to the beach and falls at the feet of a British naval officer whose ship has seen the smoke. The officer is disappointed that British boys did not behave better. Ralph weeps for the end of innocence, the darkness in human hearts and the death of Piggy."]],
chars:[["Ralph","Elected chief; stands for order and democracy."],["Piggy","Intelligent and rational but physically weak; mocked by the others."],["Jack Merridew","Choir leader turned hunter; craves power."],["Simon","Quiet, kind and thoughtful; understands what the beast really is."],["Roger","Cruel boy who becomes Jack’s enforcer."],["Sam and Eric","Twins; loyal to Ralph until they are captured."],["The littluns","The youngest boys; the most fearful."],["The naval officer","The adult who arrives at the very end."]],
themes:[["Civilization vs. savagery","The boys begin with rules, assemblies and a signal fire. As these break down, painted faces, chanting and killing take their place, suggesting that civilization is a thin layer over savage instincts."],
["Loss of innocence","The boys arrive as ordinary schoolchildren and end as killers. Ralph’s tears at the end mourn the innocence they have lost."],
["The beast within","The boys look for a monster outside themselves, but Simon learns that the ‘beast’ is the capacity for evil inside every person."],
["Power and leadership","Ralph leads through election and reason; Jack leads through fear, food and ritual. Jack’s method wins over most of the boys, raising questions about why people follow strong leaders."],
["Fear","Fear of the beast grows far faster than any real danger, and Jack uses that fear to gain power."]],
syms:[["The conch","Order, democracy and the right to speak. It shatters when Piggy dies."],
["Piggy’s glasses","Intelligence, science and the power to make fire. They are broken, then stolen."],
["The signal fire","Hope of rescue and connection to civilization. Ironically, the destructive fire set to hunt Ralph is what brings rescue."],
["The beast","The evil the boys fear outside themselves, which is really within them."],
["The Lord of the Flies","The pig’s head on a stick. The phrase translates the Hebrew name Beelzebub, a name for the devil, and stands for the evil the boys come to worship."]],
devs:[["Allegory","Characters and objects stand for larger ideas: Ralph for democracy, Jack for dictatorship, Piggy for reason, Simon for spiritual insight."],
["Foreshadowing","The missing boy with the birthmark and Roger’s thrown stones hint at the killings to come."],
["Irony","The boys are rescued by a naval officer from a world fighting a larger war, and by a fire meant to kill Ralph."],
["Foil characters","Ralph and Jack, and Piggy and Jack, highlight each other’s values through contrast."],
["Setting and imagery","The island changes from a bright paradise to a burning hell, mirroring the boys’ decline."]],
ct:[{q:"Does the novel prove that human nature is evil?",claim:"Take a position on Golding’s view of human nature.",ev:"Ch. 4 (Roger’s stones and Jack’s mask), Ch. 8 (the Lord of the Flies speaks to Simon), Ch. 9 (Simon’s death), Ch. 12 (Ralph’s tears).",rs:"Explain what causes the boys’ violence: something inside them, or the situation they are in?",cc:"Ralph, Piggy, Simon and the twins resist for a long time. Does that weaken Golding’s argument?",m:"Model claim: Golding argues that the capacity for evil exists in everyone, but the characters who resist suggest that choice, not just nature, decides who we become."},
{q:"Why does Jack win the boys’ loyalty while Ralph loses it?",claim:"Compare the two leaders’ methods.",ev:"Ch. 1 (the election), Ch. 4 (the fire goes out), Ch. 8 (Jack leaves), Ch. 9 (the feast).",rs:"Look at what each leader offers: safety and rescue, or meat, excitement and protection from the beast.",cc:"Is Ralph partly responsible for losing control?",m:"Model claim: Jack wins because he offers immediate pleasure and protection from fear, while Ralph asks the boys to work for a distant goal they stop believing in."},
{q:"Why does Simon have to die?",claim:"Explain the meaning of Simon’s death.",ev:"Ch. 3 (Simon’s clearing), Ch. 5 (his suggestion that the beast is ‘only us’), Ch. 8 (the vision), Ch. 9 (his death).",rs:"Consider what Simon knows and why the group cannot accept it.",cc:"Is Simon too good to be believable?",m:"Model claim: Simon is killed at the very moment he brings the truth, showing that a crowd ruled by fear destroys the people who could save it."},
{q:"Is the ending hopeful?",claim:"Decide what the arrival of the naval officer means.",ev:"Ch. 12 (the officer and his warship), Ch. 6 (the dead parachutist), Ch. 1 (Piggy mentions the atom bomb).",rs:"Think about who rescues the boys and what that adult world is doing.",cc:"Ralph is saved and the killing stops. Is that enough to call the ending hopeful?",m:"Model claim: The ending is deeply ironic: the boys are rescued by a warship from a world fighting the same kind of war on a larger scale."},
{q:"How is Piggy treated, and what does it say about groups?",claim:"Argue what Piggy’s treatment reveals.",ev:"Ch. 1 (his nickname spreads), Ch. 4 (Jack breaks his glasses), Ch. 11 (his death).",rs:"Explain why the group mocks the boy with the best ideas.",cc:"Does Piggy’s own behavior make it harder for others to listen to him?",m:"Model claim: The boys mock Piggy because he looks and sounds different, showing that groups often reject reason when it comes from an outsider."},
{q:"Cross-text: Compare the novel with the true story of six Tongan boys stranded on the island of ‘Ata in the 1960s.",claim:"Argue what the comparison reveals about Golding’s claims.",ev:"The novel, plus a reliable account of the ‘Ata castaways (for example, the reporting in Rutger Bregman’s book Humankind, 2020).",rs:"Compare how each group organized itself and why the outcomes differed.",cc:"One group is real and one is fiction. Can a real event disprove a novel’s argument?",m:"Model claim: The Tongan boys’ cooperation suggests that Golding’s view is one possibility, not a law of nature, and that culture and choices shape how people behave under pressure."}],
kz:{"Civilization vs. savagery":"文明與野蠻","Loss of innocence":"失去純真","The beast within":"內在的野獸","Power and leadership":"權力與領導","Fear":"恐懼","The conch":"海螺","Piggy’s glasses":"Piggy 的眼鏡","The signal fire":"求救的烽火","The beast":"野獸","The Lord of the Flies":"蒼蠅王","Allegory":"寓言","Foil characters":"對照角色","Setting and imagery":"場景與意象"},
zh:{bg:["William Golding 的第一部小說，1954 年出版。Golding 二戰期間曾在英國皇家海軍服役，這本書反映了他受戰爭影響的信念：殘酷是人性的一部分，而不只是壞社會的產物。",
"在一場沒有說明的未來戰爭中，一架撤離英國學童的飛機在遭受攻擊時墜落在一座無人的熱帶島嶼上。沒有大人倖存，這群大約六到十二歲的男孩必須自己管理自己。",
"這部小說常被當作寓言來讀，每個男孩和物件都代表一個關於社會的更大概念。Golding 於 1983 年獲得諾貝爾文學獎。內容提醒：小說中有兒童遭暴力致死的情節。"],
sum:["Ralph 在潟湖裡找到一個海螺，戴眼鏡、體型肥胖又有氣喘的 Piggy 教他吹響海螺召集其他人。男孩們選 Ralph 當首領；唱詩班領隊 Jack Merridew 負責帶領獵人。Ralph、Jack 和 Simon 探勘後確認他們在一座島上，Jack 沒能殺死一隻小豬。在集會上，他們約定拿著海螺的人才能發言。一個臉上有胎記的小男孩說他看見了「野獸」。男孩們用 Piggy 的眼鏡點燃求救烽火，但火勢失控，那個有胎記的男孩從此不見蹤影。",
"Ralph 和 Simon 辛苦地搭建棚屋，Jack 卻沉迷於打獵。Simon 獨自走到叢林裡一片寧靜的空地。Roger 朝一個小男孩丟石頭，卻故意丟偏，因為他仍受到規矩記憶的約束。Jack 用黏土塗臉，覺得自己擺脫了羞恥感。一艘船經過，但烽火已經熄滅，因為獵人們丟下它去打獵。獵人們唱著歌帶著死豬回來；Ralph 大怒，Jack 則打了 Piggy，打破他眼鏡的一片鏡片。",
"在一場緊張的集會中，小男孩們對野獸的恐懼不斷擴散。Simon 提出野獸也許「只是我們自己」，其他人卻哄堂大笑。規矩開始瓦解。當晚，一名在空戰中死去的跳傘員屍體飄落到山上；雙胞胎 Sam 和 Eric 在黑暗中看見，以為那就是野獸。一次探勘中，Ralph 刺傷一頭野豬，感受到狩獵的快感，一場模擬狩獵也變得粗暴。Ralph、Jack 和 Roger 爬上山，看見跳傘員屍體的輪廓後逃走。",
"Jack 沒能讓男孩們投票罷免 Ralph，於是離開去組成自己的部落，大部分年紀較大的男孩陸續跟隨他。他的獵人殺了一頭母豬，把豬頭插在木棍上當作獻給野獸的禮物。Simon 獨自一人時產生幻覺，爬滿蒼蠅的豬頭（蒼蠅王）告訴他，野獸就是男孩們自己的一部分。Simon 爬上山，發現跳傘員的真相，跑下山要告訴大家。在 Jack 的宴會上，一場暴風雨中的狂野儀式舞蹈裡，包括 Ralph 和 Piggy 在內的男孩們把 Simon 誤認為野獸，將他殺死。",
"Ralph 和 Piggy 飽受罪惡感折磨。Jack 的部落趁夜襲擊他們的營地，偷走 Piggy 的眼鏡，那是他們唯一的生火工具。Ralph、Piggy 和雙胞胎前往 Jack 在 Castle Rock 的堡壘要求歸還眼鏡。Piggy 舉起海螺，懇求大家講道理。Roger 撬動一塊巨石滾下懸崖，砸死了 Piggy，海螺也碎了。雙胞胎被抓，被迫加入部落。",
"孤身一人的 Ralph 從雙胞胎口中得知，部落第二天要獵殺他，而 Roger 已經把一根木棍的兩端都削尖了。部落放火燒島要把他逼出來。Ralph 跑到海灘，跌倒在一名英國海軍軍官腳邊，軍官的船是看到濃煙才過來的。軍官對英國男孩們沒有表現得更好感到失望。Ralph 為純真的終結、人心的黑暗和 Piggy 的死而痛哭。"],
chars:["被選為首領；代表秩序與民主。","聰明理性但體弱；常被其他人嘲笑。","從唱詩班領隊變成獵人；渴望權力。","安靜、善良、善於思考；明白野獸的真面目。","殘酷的男孩，成為 Jack 的打手。","雙胞胎；在被抓之前一直忠於 Ralph。","年紀最小的男孩們；最容易害怕。","在最後才出現的大人。"],
themes:["男孩們一開始有規矩、集會和求救烽火。當這些瓦解時，塗臉、吟唱和殺戮取而代之，暗示文明只是覆蓋在野蠻本能上的一層薄膜。","男孩們來到島上時是普通的學生，最後卻成了殺人者。Ralph 在結局的眼淚，是在哀悼他們失去的純真。","男孩們在自己以外尋找怪物，但 Simon 明白了：「野獸」是每個人內心作惡的能力。","Ralph 透過選舉與理性領導；Jack 則透過恐懼、食物與儀式領導。Jack 的方法贏得了大部分男孩，引發人們為何追隨強勢領袖的問題。","對野獸的恐懼增長得遠比任何真實危險快，而 Jack 利用這份恐懼取得權力。"],
syms:["秩序、民主與發言的權利。Piggy 死時它也碎了。","智慧、科學與生火的能力。先被打破，後被偷走。","獲救的希望，以及與文明的連結。諷刺的是，為獵殺 Ralph 而放的那把破壞之火，才是讓他們獲救的原因。","男孩們害怕存在於自身以外的邪惡，其實它就在他們心中。","插在木棍上的豬頭。這個詞是希伯來名字 Beelzebub（魔鬼的名字之一）的翻譯，代表男孩們開始崇拜的邪惡。"],
devs:["人物和物件代表更大的概念：Ralph 代表民主，Jack 代表獨裁，Piggy 代表理性，Simon 代表心靈的洞察。","失蹤的胎記男孩和 Roger 丟的石頭，都暗示了後來的殺戮。","男孩們被一名來自正在打更大戰爭的世界的海軍軍官救起，而且救他們的是一把原本要燒死 Ralph 的火。","Ralph 與 Jack、Piggy 與 Jack，透過對比凸顯彼此的價值觀。","島嶼從明亮的樂園變成燃燒的地獄，映照出男孩們的墮落。"],
ct:[{q:"這部小說證明了人性本惡嗎？",claim:"對 Golding 的人性觀表明立場。",ev:"第 4 章（Roger 的石頭與 Jack 的面具）、第 8 章（蒼蠅王對 Simon 說話）、第 9 章（Simon 之死）、第 12 章（Ralph 的眼淚）。",rs:"說明男孩們暴力的原因：是他們內在的某種東西，還是他們所處的情境？",cc:"Ralph、Piggy、Simon 和雙胞胎抵抗了很久。這會削弱 Golding 的論點嗎？",m:"參考論點：Golding 主張每個人都有作惡的能力，但那些抵抗的角色顯示，決定我們成為什麼人的，不只是本性，還有選擇。"},
{q:"為什麼 Jack 贏得男孩們的忠誠，而 Ralph 卻失去它？",claim:"比較兩位領袖的方法。",ev:"第 1 章（選舉）、第 4 章（烽火熄滅）、第 8 章（Jack 離開）、第 9 章（宴會）。",rs:"看看每位領袖提供了什麼：安全與獲救，還是肉、刺激和免於野獸的保護。",cc:"Ralph 失去控制，自己是否也有部分責任？",m:"參考論點：Jack 之所以獲勝，是因為他提供立即的快樂和對恐懼的保護，而 Ralph 要男孩們為一個他們不再相信的遙遠目標努力。"},
{q:"為什麼 Simon 必須死？",claim:"說明 Simon 之死的意義。",ev:"第 3 章（Simon 的空地）、第 5 章（他提出野獸「只是我們自己」）、第 8 章（幻覺）、第 9 章（他的死）。",rs:"想一想 Simon 知道什麼，以及為什麼群體無法接受。",cc:"Simon 是否好得令人難以置信？",m:"參考論點：Simon 正好在帶來真相的那一刻被殺，顯示被恐懼支配的群眾，會毀掉原本能拯救他們的人。"},
{q:"結局是充滿希望的嗎？",claim:"判斷海軍軍官的到來代表什麼。",ev:"第 12 章（軍官和他的軍艦）、第 6 章（死去的跳傘員）、第 1 章（Piggy 提到原子彈）。",rs:"想一想是誰救了男孩們，以及那個大人的世界正在做什麼。",cc:"Ralph 獲救了，殺戮也停止了。這樣就能說結局充滿希望嗎？",m:"參考論點：結局充滿反諷：救起男孩們的，是一艘來自正在以更大規模打同樣戰爭的世界的軍艦。"},
{q:"Piggy 受到什麼樣的對待？這揭示了群體的什麼？",claim:"論證 Piggy 的遭遇揭示了什麼。",ev:"第 1 章（他的綽號傳開）、第 4 章（Jack 打破他的眼鏡）、第 11 章（他的死）。",rs:"說明為什麼群體會嘲笑點子最好的那個男孩。",cc:"Piggy 自己的行為，是否也讓別人更難聽他說話？",m:"參考論點：男孩們嘲笑 Piggy，是因為他的外表和說話方式與眾不同，顯示當理性來自局外人時，群體往往會拒絕它。"},
{q:"跨文本：把這部小說和 1960 年代六名東加男孩受困於 ‘Ata 島的真實故事做比較。",claim:"論證這個比較對 Golding 的觀點揭示了什麼。",ev:"小說本身，加上一份關於 ‘Ata 島受困者的可靠報導（例如 Rutger Bregman 2020 年的著作《Humankind》中的記述）。",rs:"比較兩群人如何組織自己，以及結果為何不同。",cc:"一群是真實的，一群是虛構的。真實事件能推翻小說的論點嗎？",m:"參考論點：東加男孩們的合作顯示，Golding 的觀點只是一種可能，而不是自然定律；文化與選擇會影響人在壓力下的行為。"}]}};

const NIGHT={
title:"Night",author:"Elie Wiesel · 1956 / 1960",blurb:"Holocaust memoir, faith, survival",cite:"author and page, e.g., (Wiesel 34)",
bg:["Night is a memoir, not a novel: Elie Wiesel’s account of his own experience in the Nazi concentration camps of Auschwitz and Buchenwald in 1944–1945, when he was fifteen and sixteen. A longer version was first published in Yiddish in 1956; a shorter French version appeared in 1958 and the English translation in 1960. A new translation by his wife, Marion Wiesel, was published in 2006.",
"Wiesel grew up in Sighet, a town in Transylvania that was then part of Hungary. Most of Hungary’s Jews were deported to Auschwitz in the spring and summer of 1944. Wiesel’s mother and younger sister were killed there, and his father died in Buchenwald.",
"Wiesel became a writer, teacher and human rights activist and received the Nobel Peace Prize in 1986. Content note: this book describes real genocide, death and cruelty. Read it with care, and talk with a trusted adult if it is distressing."],
sum:[["Section 1 · Sighet","In 1941, twelve-year-old Eliezer studies Jewish law and mysticism with Moishe the Beadle, a poor, gentle man. When foreign Jews are expelled from Sighet, Moishe is deported, but he escapes and returns to warn the town that the deportees were murdered. No one believes him. In the spring of 1944, German troops arrive in Hungary. The Jews of Sighet are forced to wear the yellow star, moved into ghettos and finally packed into cattle cars."],
["Sections 2–3 · Arrival","During the journey, Madame Schächter screams that she sees fire; the others silence her, until they arrive at Birkenau and see the flames and smell burning flesh. In the selection, Eliezer is separated forever from his mother and his younger sister, Tzipora. Following another prisoner’s advice, he and his father lie about their ages. Eliezer sees children being burned, and his faith begins to break. The prisoners are stripped, shaved and tattooed with numbers."],
["Section 4 · Buna","Eliezer and his father are moved to the labor camp Buna. Eliezer is beaten by the Kapo Idek and forced to give up the gold crown on his tooth. Prisoners are made to watch hangings. When a young boy is hanged and takes a long time to die, a man behind Eliezer asks where God is, and Eliezer hears a voice inside him answer that God is hanging there on the gallows."],
["Section 5 · Selection and evacuation","On Rosh Hashanah, Eliezer cannot join the prayers and feels that he is accusing God; on Yom Kippur he decides not to fast. He and his father survive another selection. In January 1945, Eliezer has surgery on his foot. As the Soviet army approaches, the Nazis evacuate the camp, and he and his father choose to leave with the others."],
["Sections 6–7 · The march and the train","Prisoners are forced to run through the snow for miles; those who fall are shot. Rabbi Eliahu searches for his son, and Eliezer realizes the son abandoned his father; he prays never to do the same. At Gleiwitz, his friend Juliek plays his violin one last time and dies. The prisoners are packed into open cattle cars for days without food. When workers throw bread into a car, men fight over it, and a son kills his own father for a piece. Of about a hundred men in Eliezer’s car, only a dozen reach Buchenwald alive."],
["Sections 8–9 · Buchenwald and liberation","At Buchenwald, Eliezer’s father falls sick with dysentery. Eliezer cares for him but struggles with the weight of keeping him alive, while others beat and rob the dying man. One night in January 1945 his father is taken away, and Eliezer feels both grief and a guilty sense of relief. On April 11, 1945, the American army liberates Buchenwald. When Eliezer looks in a mirror for the first time since the ghetto, he sees a corpse looking back at him."]],
chars:[["Eliezer","The narrator, based on Wiesel himself; a devout boy whose faith is shaken."],["Shlomo","Eliezer’s father; respected in the Sighet community."],["Moishe the Beadle","Eliezer’s teacher; the witness no one believes."],["Madame Schächter","A woman on the train who screams that she sees fire."],["Tzipora","Eliezer’s youngest sister; killed at Birkenau with their mother."],["Idek","A Kapo who beats prisoners."],["Juliek","A young violinist Eliezer befriends."],["Rabbi Eliahu","A holy man whose son abandons him."]],
themes:[["Faith and doubt","Eliezer argues with God. His faith is deeply wounded, but he keeps addressing God even in anger."],
["Silence","The town ignores Moishe, the world says nothing, and God seems silent. Wiesel writes to break that silence."],
["Fathers and sons","Eliezer and his father keep each other alive, yet the camps push sons to abandon fathers."],
["Dehumanization","Numbers replace names, hunger replaces thought, and prisoners are forced to turn on one another."],
["Memory and witness","Wiesel treats remembering and telling as a duty to the dead and a warning to the living."]],
syms:[["Night","Darkness, death, the absence of God and the end of childhood."],
["Fire","The destruction of the camps; it turns a symbol of light into a symbol of murder."],
["The yellow star","The first step in marking and separating Jews from their neighbors."],
["The mirror","At the end, the corpse he sees shows how much of himself the camps destroyed."]],
devs:[["First-person memoir","A true account told by the person who lived it, which gives it the authority of a witness."],
["Imagery","Night, fire and smoke appear again and again to make the horror visible."],
["Repetition","The passage beginning ‘Never shall I forget’ repeats the phrase to show that these memories will never leave him."],
["Irony","The people of Sighet ignore the one person who tries to warn them."],
["Retrospective narration","An adult writer looks back on a boy’s experience, adding reflection and judgment."]],
ct:[{q:"Why didn’t the Jews of Sighet believe Moishe the Beadle?",claim:"Explain the reasons for the town’s disbelief.",ev:"Section 1 (Moishe’s warning, the town’s reaction, the arrival of the Germans and the ghetto).",rs:"Consider fear, hope and how people react to news that seems impossible.",cc:"Could the townspeople have saved themselves if they had believed him?",m:"Model claim: The town’s disbelief shows how people reject unbearable truths in order to protect their hope, which makes warnings easy to ignore."},
{q:"Has Eliezer lost his faith, or is he arguing with God?",claim:"Take a position on Eliezer’s relationship with God by the end.",ev:"Section 1 (his early devotion), Section 3 (the first night), Section 4 (the hanging), Section 5 (Rosh Hashanah and Yom Kippur).",rs:"Notice that he still speaks to God even when he is angry.",cc:"Some readers see a total loss of faith. What evidence supports that view?",m:"Model claim: Eliezer does not stop believing in God so much as he puts God on trial, which is itself a form of faith."},
{q:"Is Eliezer’s father a burden or the reason he survives?",claim:"Argue how the father–son relationship affects Eliezer’s survival.",ev:"Section 3 (lying about their ages), Section 6 (the march and Rabbi Eliahu), Section 7 (the train), Section 8 (Buchenwald).",rs:"Show moments when each keeps the other alive, and moments of resentment.",cc:"How should we judge Eliezer’s feeling of relief?",m:"Model claim: Eliezer’s father is both his greatest burden and his reason to live; the camps’ cruelty shows most clearly in how they force a loving son to feel relief."},
{q:"Why is the book called Night?",claim:"Explain what ‘night’ means in the memoir.",ev:"Section 1 (night prayers), Section 3 (the first night in camp), Section 9 (the mirror).",rs:"Track how night changes from a time of prayer to a symbol of death and despair.",cc:"Is there any light or hope in the book?",m:"Model claim: ‘Night’ stands for a darkness that is physical, moral and spiritual — a night that, for Eliezer, never fully ends."},
{q:"What is the responsibility of bystanders?",claim:"Argue what Night says about those who stay silent.",ev:"Section 1 (the town and the world), Section 3 (the world’s silence), and Wiesel’s 1986 Nobel Peace Prize acceptance speech, available on the Nobel Prize website.",rs:"Connect the book’s silence to Wiesel’s later call to take sides against injustice.",cc:"Can ordinary people be blamed for not acting when they feel powerless?",m:"Model claim: Wiesel argues that silence helps the oppressor, so remembering and speaking out are moral duties, not choices."},
{q:"Cross-text: Compare the bystanders in Night with the townspeople of Maycomb in To Kill a Mockingbird.",claim:"Argue what both texts show about communities that accept injustice.",ev:"Night Section 1; To Kill a Mockingbird Ch. 15 (the mob) and Ch. 21 (the verdict).",rs:"Compare how ordinary people allow or resist injustice.",cc:"The Holocaust and Jim Crow differ greatly in scale. Is the comparison fair?",m:"Model claim: Both texts show that injustice depends on ordinary people who look away, though the Holocaust shows where that silence can lead at its most extreme."}],
kz:{"Faith and doubt":"信仰與懷疑","Silence":"沉默","Fathers and sons":"父與子","Dehumanization":"非人化","Memory and witness":"記憶與見證","Night":"黑夜","Fire":"火","The yellow star":"黃色星章","The mirror":"鏡子","First-person memoir":"第一人稱回憶錄","Imagery":"意象","Repetition":"重複","Retrospective narration":"回顧式敘事"},
zh:{bg:["《Night》是回憶錄，不是小說：這是 Elie Wiesel 親身經歷 1944–1945 年納粹 Auschwitz 和 Buchenwald 集中營的記述，當時他十五、十六歲。較長的版本於 1956 年首先以意第緒語出版；較短的法文版於 1958 年問世，英譯本於 1960 年出版。他的妻子 Marion Wiesel 的新譯本於 2006 年出版。",
"Wiesel 在 Sighet 長大，這是 Transylvania 的一個小鎮，當時屬於匈牙利。1944 年春夏，匈牙利大部分猶太人被驅逐到 Auschwitz。Wiesel 的母親和妹妹在那裡遇害，父親則死於 Buchenwald。",
"Wiesel 後來成為作家、教師和人權運動者，並於 1986 年獲得諾貝爾和平獎。內容提醒：這本書描述真實的種族滅絕、死亡與殘酷。請謹慎閱讀；如果讀了感到難受，請和信任的大人談談。"],
sum:["1941 年，十二歲的 Eliezer 跟著貧窮而溫和的 Moishe 學習猶太律法與神秘主義。外國籍猶太人被驅逐出 Sighet 時，Moishe 也被遣送，但他逃了回來，警告鎮上的人：被遣送的人都被殺害了。沒有人相信他。1944 年春天，德軍進入匈牙利。Sighet 的猶太人被迫佩戴黃色星章，被趕進猶太隔離區，最後被塞進運牲畜的車廂。",
"途中，Schächter 太太尖叫說她看見了火；其他人讓她閉嘴，直到他們抵達 Birkenau，看見火焰、聞到焚燒屍體的氣味。在篩選中，Eliezer 與母親和妹妹 Tzipora 永遠分開了。他和父親聽從另一名囚犯的建議，謊報了年齡。Eliezer 看見孩子被焚燒，他的信仰開始崩裂。囚犯們被剝光衣服、剃光頭髮，並刺上編號。",
"Eliezer 和父親被轉到勞動營 Buna。Eliezer 被囚犯頭目 Idek 毆打，還被迫交出牙齒上的金牙冠。囚犯們被迫觀看絞刑。一個小男孩被吊死、久久沒有斷氣時，Eliezer 身後有人問上帝在哪裡，Eliezer 聽見內心有個聲音回答：上帝就吊在那座絞刑架上。",
"猶太新年時，Eliezer 無法加入禱告，覺得自己在控訴上帝；贖罪日時，他決定不禁食。他和父親又熬過了一次篩選。1945 年 1 月，Eliezer 的腳動了手術。隨著蘇聯軍隊逼近，納粹撤離集中營，他和父親選擇跟著其他人一起離開。",
"囚犯們被迫在雪中跑了好幾英里；倒下的人就被槍殺。Eliahu 拉比尋找他的兒子，Eliezer 明白那個兒子拋棄了父親；他祈禱自己永遠不要這樣做。在 Gleiwitz，他的朋友 Juliek 最後一次拉起小提琴，然後死去。囚犯們被塞進敞篷的運牲畜車廂，好幾天沒有食物。當工人往車廂裡丟麵包時，人們為此爭搶，一個兒子為了一塊麵包殺死了自己的父親。Eliezer 所在的車廂約有一百人，活著抵達 Buchenwald 的只有十幾人。",
"在 Buchenwald，Eliezer 的父親染上痢疾。Eliezer 照顧他，卻在讓父親活下去的重擔中掙扎，而其他人毆打並搶奪這個垂死的人。1945 年 1 月的某個夜裡，父親被帶走了，Eliezer 同時感到悲痛與一種帶著罪惡感的解脫。1945 年 4 月 11 日，美軍解放了 Buchenwald。Eliezer 自離開隔離區後第一次照鏡子，看見一具屍體正望著他。"],
chars:["敘事者，以 Wiesel 本人為原型；一個信仰虔誠、信仰卻被動搖的男孩。","Eliezer 的父親；在 Sighet 社群中受人尊敬。","Eliezer 的老師；沒有人相信的見證者。","火車上尖叫說看見火的女人。","Eliezer 的妹妹；和母親一起在 Birkenau 遇害。","毆打囚犯的囚犯頭目（Kapo）。","Eliezer 結識的年輕小提琴手。","一位被兒子拋棄的虔誠拉比。"],
themes:["Eliezer 與上帝爭辯。他的信仰受了重創，但即使在憤怒中，他仍然對上帝說話。","小鎮忽視 Moishe，世界一言不發，上帝似乎也沉默不語。Wiesel 寫作，就是為了打破這份沉默。","Eliezer 和父親讓彼此活下去，但集中營卻逼著兒子拋棄父親。","編號取代名字，飢餓取代思考，囚犯們被迫互相傷害。","Wiesel 把記憶與述說視為對死者的責任，也是對生者的警告。"],
syms:["黑暗、死亡、上帝的缺席，以及童年的終結。","集中營的毀滅；它把光明的象徵變成了屠殺的象徵。","把猶太人標記出來、與鄰居隔離的第一步。","結局時他看見的那具屍體，顯示集中營毀掉了他多少的自我。"],
devs:["由親身經歷者講述的真實記錄，具有見證者的權威。","黑夜、火焰和濃煙一再出現，讓恐怖變得具體可見。","以「Never shall I forget」開頭的段落反覆使用這句話，顯示這些記憶永遠不會離開他。","Sighet 的人們忽視了唯一試圖警告他們的人。","成年的作者回顧一個男孩的經歷，加入了反思與評斷。"],
ct:[{q:"為什麼 Sighet 的猶太人不相信 Moishe？",claim:"說明小鎮不相信他的原因。",ev:"第 1 節（Moishe 的警告、小鎮的反應、德軍抵達與隔離區）。",rs:"想一想恐懼、希望，以及人們面對看似不可能的消息時的反應。",cc:"如果鎮民相信了他，他們能救自己嗎？",m:"參考論點：小鎮的不信顯示，人們會為了保護自己的希望而拒絕難以承受的真相，這讓警告很容易被忽視。"},
{q:"Eliezer 失去了信仰，還是在與上帝爭辯？",claim:"對 Eliezer 在結局時與上帝的關係表明立場。",ev:"第 1 節（他早年的虔誠）、第 3 節（第一夜）、第 4 節（絞刑）、第 5 節（猶太新年與贖罪日）。",rs:"注意他即使在憤怒時，仍然在對上帝說話。",cc:"有些讀者認為他完全失去了信仰。有哪些證據支持這個看法？",m:"參考論點：與其說 Eliezer 不再相信上帝，不如說他把上帝送上了審判台，而這本身就是一種信仰。"},
{q:"Eliezer 的父親是負擔，還是他活下來的理由？",claim:"論證父子關係如何影響 Eliezer 的生存。",ev:"第 3 節（謊報年齡）、第 6 節（行軍與 Eliahu 拉比）、第 7 節（火車）、第 8 節（Buchenwald）。",rs:"舉出兩人讓彼此活下去的時刻，以及心生怨懟的時刻。",cc:"我們該如何看待 Eliezer 感到解脫這件事？",m:"參考論點：Eliezer 的父親既是他最大的負擔，也是他活下去的理由；集中營的殘酷，最清楚地表現在它逼一個深愛父親的兒子感到解脫。"},
{q:"這本書為什麼叫《Night》？",claim:"說明「黑夜」在這本回憶錄中的意義。",ev:"第 1 節（夜間禱告）、第 3 節（集中營的第一夜）、第 9 節（鏡子）。",rs:"追蹤黑夜如何從禱告的時刻，轉變為死亡與絕望的象徵。",cc:"這本書裡有任何光明或希望嗎？",m:"參考論點：「黑夜」代表身體、道德與心靈上的黑暗；對 Eliezer 來說，這個黑夜從未真正結束。"},
{q:"旁觀者負有什麼責任？",claim:"論證《Night》對保持沉默的人有什麼看法。",ev:"第 1 節（小鎮與世界）、第 3 節（世界的沉默），以及 Wiesel 1986 年諾貝爾和平獎的得獎演說（可在諾貝爾獎官方網站找到）。",rs:"把書中的沉默，與 Wiesel 後來呼籲人們在不公義面前選邊站連結起來。",cc:"當普通人感到無力時，能因為他們沒有行動而責怪他們嗎？",m:"參考論點：Wiesel 主張沉默會幫助壓迫者，因此記憶與發聲是道德責任，而不是可有可無的選擇。"},
{q:"跨文本：比較《Night》中的旁觀者與《To Kill a Mockingbird》中 Maycomb 的鎮民。",claim:"論證兩個文本對接受不公義的社群揭示了什麼。",ev:"《Night》第 1 節；《To Kill a Mockingbird》第 15 章（暴民）與第 21 章（判決）。",rs:"比較普通人如何容許或抵抗不公義。",cc:"大屠殺與 Jim Crow 在規模上差異極大。這樣比較公平嗎？",m:"參考論點：兩個文本都顯示，不公義仰賴那些轉過頭去的普通人，而大屠殺則呈現了這種沉默在最極端時會導致什麼。"}]}};

const F451={
title:"Fahrenheit 451",author:"Ray Bradbury · 1953",blurb:"Censorship, technology, thinking for yourself",cite:"author and page, e.g., (Bradbury 58)",
bg:["A dystopian novel by Ray Bradbury, published in 1953 and expanded from his 1951 novella ‘The Fireman.’ The title refers to the temperature Bradbury gave as the point at which book paper catches fire.",
"In a future America, houses are fireproof, and ‘firemen’ start fires instead of putting them out: they burn books, which are illegal. People fill their time with wall-sized televisions, tiny earbud radios called Seashells, fast cars and sleeping pills.",
"Bradbury wrote the novel early in the Cold War, two decades after the Nazi book burnings and during the McCarthy era’s fear of dangerous ideas. He also worried that television and mass media would make people stop reading and thinking for themselves."],
sum:[["Part 1 · The Hearth and the Salamander (opening)","Guy Montag, a fireman, enjoys burning books. Walking home, he meets his new neighbor Clarisse McClellan, a curious seventeen-year-old who asks whether he is happy. At home he finds his wife, Mildred, unconscious from an overdose of sleeping pills; technicians pump her stomach, and the next morning she remembers nothing. Clarisse keeps talking with Montag about nature and ideas, and he begins to question his life."],
["Part 1 · (continued)","On a call, an old woman refuses to leave her books and burns with them. Montag secretly takes a book. Clarisse disappears, and Mildred mentions that she was hit by a car. When Montag stays home sick, Captain Beatty visits and explains how their society came to be: as media sped up and people wanted to avoid offending anyone, books were shortened, simplified and finally banned, and firemen became keepers of everyone’s peace of mind. After Beatty leaves, Montag shows Mildred the books he has hidden."],
["Part 2 · The Sieve and the Sand","Montag and Mildred try to read, but she is frightened and uninterested. Montag visits Faber, a retired English professor he once met in a park. Faber explains that books matter because they offer detailed truth about life, time to think about it and the freedom to act on what we learn. He gives Montag a tiny two-way radio earpiece so he can guide him. Montag reads the poem ‘Dover Beach’ to Mildred’s friends; one of them cries, and the others are angry. At the firehouse, Beatty taunts Montag with quotations from the very books he burns."],
["Part 3 · Burning Bright (the escape)","The alarm sounds, and the firemen drive to Montag’s own house: Mildred has turned him in. Beatty orders Montag to burn his home. When Beatty discovers the earpiece and threatens to track down Faber, Montag turns the flamethrower on Beatty and kills him. The Mechanical Hound injures Montag’s leg before he destroys it. Montag flees across the city while the chase is broadcast on television, reaches the river and floats away. To end the show, the broadcast pretends to catch him by killing an innocent man."],
["Part 3 · (ending)","Downstream, Montag meets Granger and a group of exiled thinkers who have each memorized a book so it can be rebuilt someday; Montag has memorized parts of the Book of Ecclesiastes. From a distance, they watch the city destroyed by bombs in a sudden war. Granger tells the legend of the phoenix rising from its own ashes, and the group walks back toward the city to help rebuild."]],
chars:[["Guy Montag","A fireman who awakens to the value of books."],["Mildred Montag","His wife; absorbed by television and pills."],["Clarisse McClellan","A curious teenage neighbor who makes Montag think."],["Captain Beatty","The fire chief; widely read, yet a defender of censorship."],["Faber","A retired English professor; Montag’s mentor."],["Granger","Leader of the exiled book people."],["Mrs. Phelps and Mrs. Bowles","Mildred’s shallow friends."],["The Mechanical Hound","A robotic hunter used by the firemen."]],
themes:[["Censorship and knowledge","The society bans books to keep people comfortable and equal, but in doing so it destroys their ability to think, remember and question."],
["Conformity vs. individuality","Clarisse and Montag are seen as dangerous simply because they ask questions and notice the world around them."],
["Technology and isolation","Wall televisions and Seashell radios surround people with noise and a fake ‘family,’ yet Montag and Mildred cannot remember how they met."],
["Happiness vs. pleasure","Mildred is entertained all the time but deeply unhappy. Clarisse’s simple question shows that pleasure is not the same as happiness."],
["Destruction and rebirth","Fire destroys, but it also gives warmth and new beginnings; the phoenix suggests a society can rise again from its ashes."]],
syms:[["Fire","At first destruction and control; by the end, warmth, light and renewal."],
["The phoenix and the salamander","The firemen’s emblems. The salamander was believed to live in fire; the phoenix dies and is reborn from its ashes."],
["The Mechanical Hound","Technology turned into a weapon of government control."],
["The sieve and the sand","Montag’s childhood memory of trying to fill a sieve with sand stands for his struggle to hold on to knowledge."],
["The mirror","Granger says the book people must first look honestly at themselves, as if building a factory of mirrors."]],
devs:[["Dystopian setting","A future society that looks comfortable but is controlled and empty, used to criticize trends in the present."],
["Allusion","References to the Bible, ‘Dover Beach’ and the phoenix connect the novel to the books its society destroys."],
["Metaphor and imagery","Fire imagery, and Montag’s hands acting as if they have a will of their own, show his inner change."],
["Irony","Firemen start fires, and Beatty quotes books to defend burning them."],
["Foreshadowing","Jets crossing the sky and Mildred’s coldness hint at the war and her betrayal."]],
ct:[{q:"Is Captain Beatty right that people chose censorship themselves?",claim:"Evaluate Beatty’s explanation of how book burning began.",ev:"Part 1 (Beatty’s history lesson), Part 2 (Faber’s explanation), Part 3 (the burning of Montag’s house).",rs:"Separate the parts of Beatty’s argument that the novel supports from the parts it rejects.",cc:"If the government enforces the ban, can ordinary people really be blamed?",m:"Model claim: Bradbury suggests that censorship began with people’s own desire for easy comfort, and that the government only finished what the public started."},
{q:"How close is our world to the world of Fahrenheit 451?",claim:"Compare one technology in the novel with one in your own life.",ev:"Part 1 (the parlor walls and Seashells), Part 2 (Mildred’s friends), plus one real example from today.",rs:"Explain how the technology affects attention, relationships or thinking.",cc:"Modern technology also spreads information and connects people. Does that change your answer?",m:"Model claim: Like the parlor walls, endless entertainment today can crowd out deep thinking, but unlike Montag’s world, we still have the freedom to choose what we read."},
{q:"Who changes Montag the most: Clarisse, Faber or Beatty?",claim:"Choose one character and argue for that choice.",ev:"Part 1 (Clarisse’s questions), Part 2 (Faber’s lessons), Parts 1 and 2 (Beatty’s speeches).",rs:"Explain what each character teaches him and what he does differently afterward.",cc:"Does Montag change himself more than anyone else changes him?",m:"Model claim: Clarisse starts Montag’s change by making him ask whether he is happy; without that first question, Faber’s lessons would have meant nothing."},
{q:"Is Montag a hero?",claim:"Decide whether Montag’s actions are heroic.",ev:"Part 2 (reading to Mildred’s friends), Part 3 (killing Beatty), Part 3 (joining the book people).",rs:"Weigh his courage against his violence and his mistakes.",cc:"Montag later suspects Beatty wanted to die. Does that change how we judge him?",m:"Model claim: Montag becomes a hero not when he kills Beatty but when he chooses to remember and protect books for the future."},
{q:"Should books ever be removed from schools?",claim:"Take a position on book challenges today.",ev:"The novel (Beatty’s argument about avoiding offense, Faber’s view of books), plus one recent news article about book challenges.",rs:"Consider who decides, what reasons are given and what students gain or lose.",cc:"Some parents worry about age-appropriate content. How would you answer that concern?",m:"Model claim: The novel warns that removing books to avoid discomfort leads to a society that cannot think, so challenges should be rare, transparent and based on age, not on ideas."},
{q:"Cross-text: Compare the book burnings in Fahrenheit 451 with the Nazi book burnings of 1933.",claim:"Argue what destroying books has to do with controlling people.",ev:"Part 1 (the old woman); a reliable history source on the May 1933 book burnings, such as the U.S. Holocaust Memorial Museum website; Night Section 1 (the first steps of persecution in Sighet).",rs:"Explain how controlling ideas makes persecution easier.",cc:"Bradbury’s society is not genocidal. Is the comparison fair?",m:"Model claim: Both show that attacks on books are attacks on people’s ability to think and resist, which is why tyranny so often begins with ideas."}],
kz:{"Censorship and knowledge":"審查與知識","Conformity vs. individuality":"從眾與個體性","Technology and isolation":"科技與孤立","Happiness vs. pleasure":"幸福與享樂","Destruction and rebirth":"毀滅與重生","The phoenix and the salamander":"鳳凰與火蜥蜴","The Mechanical Hound":"機械獵犬","The sieve and the sand":"篩子與沙","Dystopian setting":"反烏托邦背景","Allusion":"典故","Metaphor and imagery":"隱喻與意象"},
zh:{bg:["Ray Bradbury 的反烏托邦小說，1953 年出版，由他 1951 年的中篇小說〈The Fireman〉擴寫而成。書名指的是 Bradbury 所說的書頁紙張起火燃燒的溫度。",
"在未來的美國，房屋都是防火的，「消防員」不是滅火，而是放火：他們燒掉違法的書。人們用整面牆大小的電視、叫做 Seashell 的小型耳塞式收音機、飛快的汽車和安眠藥來打發時間。",
"Bradbury 在冷戰初期寫下這部小說，那時距離納粹焚書已過了二十年，又正值麥卡錫時代對「危險思想」的恐懼。他也擔心電視與大眾媒體會讓人們不再自己閱讀和思考。"],
sum:["消防員 Guy Montag 很享受燒書。走路回家時，他遇到新鄰居 Clarisse McClellan，一個好奇的十七歲女孩，她問他快不快樂。回到家，他發現妻子 Mildred 因服用過量安眠藥而昏迷；技術人員幫她洗胃，第二天早上她什麼都不記得。Clarisse 持續和 Montag 聊大自然和各種想法，他開始質疑自己的人生。",
"在一次出勤中，一位老婦人不肯離開她的書，和書一起被燒死。Montag 偷偷拿走一本書。Clarisse 不見了，Mildred 提到她被車撞了。Montag 請病假在家時，Beatty 隊長來訪，解釋他們的社會是怎麼形成的：隨著媒體越來越快，人們又想避免冒犯任何人，書被刪短、簡化，最後被禁止，消防員則成了守護大家內心平靜的人。Beatty 離開後，Montag 把藏起來的書拿給 Mildred 看。",
"Montag 和 Mildred 試著閱讀，但她又害怕又沒興趣。Montag 去找 Faber，一位他曾在公園遇過的退休英文教授。Faber 解釋書之所以重要，是因為書提供了關於生活的細膩真相、思考它的時間，以及依據所學採取行動的自由。他給了 Montag 一個小小的雙向無線電耳機，以便引導他。Montag 對 Mildred 的朋友們朗讀詩作〈Dover Beach〉；其中一人哭了，其他人則很生氣。在消防站，Beatty 引用他所燒掉的那些書中的句子來嘲弄 Montag。",
"警鈴響起，消防員們開車前往的竟是 Montag 自己的家：Mildred 告發了他。Beatty 命令 Montag 燒掉自己的房子。當 Beatty 發現耳機並揚言要追查 Faber 時，Montag 把噴火器對準 Beatty，殺了他。機械獵犬在被 Montag 摧毀之前刺傷了他的腿。Montag 在電視直播追捕的同時逃過整座城市，抵達河邊並順流漂走。為了讓節目收尾，直播殺了一名無辜的人，假裝抓到了他。",
"在下游，Montag 遇到 Granger 和一群流亡的思想者，他們每人都背下一本書，好讓書有一天能重建；Montag 背下了《傳道書》的部分內容。他們從遠處看著城市在一場突如其來的戰爭中被炸毀。Granger 講述鳳凰從自己的灰燼中重生的傳說，這群人隨即朝城市走去，準備幫忙重建。"],
chars:["一名逐漸覺醒、明白書本價值的消防員。","他的妻子；沉迷於電視和藥物。","好奇的少女鄰居，讓 Montag 開始思考。","消防隊長；博覽群書，卻捍衛審查制度。","退休的英文教授；Montag 的導師。","流亡的「書人」的領袖。","Mildred 膚淺的朋友。","消防員使用的機器人獵犬。"],
themes:["這個社會禁書是為了讓人們舒適、平等，但這樣做卻摧毀了他們思考、記憶與質疑的能力。","Clarisse 和 Montag 被視為危險人物，只因為他們會提問，並留意周遭的世界。","整面牆的電視和 Seashell 收音機用噪音和虛假的「家人」包圍人們，然而 Montag 和 Mildred 卻記不起他們是怎麼認識的。","Mildred 隨時都在娛樂中，內心卻極度不快樂。Clarisse 一個簡單的問題就顯示出：享樂不等於幸福。","火會毀滅，也會帶來溫暖與新的開始；鳳凰暗示一個社會可以從灰燼中再次崛起。"],
syms:["起初代表毀滅與控制；到了結尾，則代表溫暖、光明與更新。","消防員的徽章。人們曾相信火蜥蜴能住在火裡；鳳凰則死後從灰燼中重生。","被當成政府控制武器的科技。","Montag 童年時試著用篩子裝沙的記憶，象徵他努力想留住知識的掙扎。","Granger 說，書人們首先必須誠實地看清自己，就像要建一座鏡子工廠一樣。"],
devs:["一個看似舒適、實則受控又空虛的未來社會，用來批評當下的趨勢。","引用《聖經》、〈Dover Beach〉和鳳凰的典故，把小說與這個社會所摧毀的書連結起來。","火的意象，以及 Montag 的手彷彿有自己意志的描寫，呈現出他內心的轉變。","消防員放火，而 Beatty 引用書中的話來為燒書辯護。","劃過天空的噴射機和 Mildred 的冷漠，暗示了戰爭與她的背叛。"],
ct:[{q:"Beatty 隊長說是人們自己選擇了審查制度，他說得對嗎？",claim:"評估 Beatty 對焚書起源的解釋。",ev:"第 1 部（Beatty 的歷史課）、第 2 部（Faber 的解釋）、第 3 部（燒毀 Montag 的房子）。",rs:"把 Beatty 論點中小說支持的部分，與小說否定的部分分開。",cc:"如果是政府在執行禁令，真的能責怪普通人嗎？",m:"參考論點：Bradbury 暗示，審查始於人們自己對輕鬆舒適的渴望，政府只是完成了大眾開始的事。"},
{q:"我們的世界和《Fahrenheit 451》的世界有多接近？",claim:"把小說中的一種科技和你生活中的一種科技做比較。",ev:"第 1 部（客廳電視牆與 Seashell）、第 2 部（Mildred 的朋友），再加上一個當今的真實例子。",rs:"說明這項科技如何影響專注力、人際關係或思考。",cc:"現代科技也傳播資訊、連結人們。這會改變你的答案嗎？",m:"參考論點：就像客廳電視牆一樣，今天無止盡的娛樂可能擠掉深度思考；但和 Montag 的世界不同，我們仍有選擇閱讀內容的自由。"},
{q:"誰對 Montag 的改變最大：Clarisse、Faber，還是 Beatty？",claim:"選一個角色並論證你的選擇。",ev:"第 1 部（Clarisse 的問題）、第 2 部（Faber 的教導）、第 1 和第 2 部（Beatty 的演說）。",rs:"說明每個角色教了他什麼，以及他之後的行為有什麼不同。",cc:"是不是 Montag 自己改變自己，比任何人改變他都多？",m:"參考論點：Clarisse 開啟了 Montag 的轉變，讓他問自己是否快樂；沒有那第一個問題，Faber 的教導就毫無意義。"},
{q:"Montag 是英雄嗎？",claim:"判斷 Montag 的行為是否英勇。",ev:"第 2 部（對 Mildred 的朋友朗讀）、第 3 部（殺死 Beatty）、第 3 部（加入書人）。",rs:"權衡他的勇氣與他的暴力和錯誤。",cc:"Montag 後來懷疑 Beatty 其實想死。這會改變我們對他的評價嗎？",m:"參考論點：Montag 成為英雄，不是在他殺死 Beatty 的時候，而是在他選擇為未來記住並保護書本的時候。"},
{q:"學校是否應該移除某些書？",claim:"對當今的禁書爭議表明立場。",ev:"小說本身（Beatty 關於避免冒犯的論點、Faber 對書的看法），再加上一篇近期關於禁書爭議的新聞報導。",rs:"想一想由誰決定、提出什麼理由，以及學生會得到或失去什麼。",cc:"有些家長擔心內容是否適合學生的年齡。你會如何回應這個顧慮？",m:"參考論點：小說警告，為了避免不舒服而移除書本，會導致一個無法思考的社會；因此對書的質疑應該很少見、公開透明，並以年齡而非思想為依據。"},
{q:"跨文本：比較《Fahrenheit 451》中的焚書與 1933 年的納粹焚書。",claim:"論證摧毀書本與控制人民之間的關係。",ev:"第 1 部（老婦人）；一份關於 1933 年 5 月焚書事件的可靠史料，例如美國大屠殺紀念館網站；《Night》第 1 節（Sighet 迫害的最初幾步）。",rs:"說明控制思想如何讓迫害變得更容易。",cc:"Bradbury 筆下的社會並沒有進行種族滅絕。這樣比較公平嗎？",m:"參考論點：兩者都顯示，攻擊書本就是攻擊人們思考與反抗的能力，這正是暴政往往從思想下手的原因。"}]}};

const MAC={
title:"Macbeth",author:"William Shakespeare · c. 1606",blurb:"Ambition, guilt, fate",cite:"act.scene.line, e.g., (2.2.62)",
bg:["A tragedy written around 1606 and Shakespeare’s shortest tragedy. It draws on Raphael Holinshed’s Chronicles, a history of Britain, but changes the facts freely. The real Macbeth ruled Scotland from 1040 to 1057.",
"The play was written soon after James VI of Scotland became King James I of England. James was fascinated by witchcraft and was believed to be descended from Banquo, so the play flatters him while warning against killing a lawful king.",
"The play is in the public domain, so you may quote it directly; cite act, scene and line numbers, which vary slightly between editions. Many actors avoid saying the title inside a theater and call it ‘the Scottish play’ out of superstition."],
sum:[["Act 1","Three witches meet on a heath. Returning from battle, the Scottish generals Macbeth and Banquo meet them: the witches hail Macbeth as Thane of Cawdor and future king, and tell Banquo his descendants will be kings. Moments later, King Duncan’s messengers announce that Macbeth has been named Thane of Cawdor. Macbeth writes to his wife, and Lady Macbeth, fearing he is too kind to seize the crown, calls on dark spirits to fill her with cruelty. When Duncan visits their castle, Macbeth hesitates, but she mocks his manhood until he agrees to murder the king."],
["Act 2","Before the murder, Macbeth sees a floating, bloody dagger. He kills Duncan in his sleep but is too shaken to finish the plan, so Lady Macbeth returns the daggers and smears the sleeping guards with blood. A drunken porter jokes that he is the gatekeeper of hell while someone knocks at the gate. Macduff discovers the body, and Macbeth kills the guards, claiming rage. Duncan’s sons, Malcolm and Donalbain, flee to England and Ireland, and Macbeth is crowned king."],
["Act 3","Remembering the prophecy about Banquo’s heirs, Macbeth hires murderers to kill Banquo and his son, Fleance. Banquo is killed, but Fleance escapes. At a royal banquet, Banquo’s ghost appears in Macbeth’s seat; only Macbeth can see it, and his terror alarms the guests. Lady Macbeth sends them away."],
["Act 4","Macbeth seeks out the witches, who show him apparitions: beware Macduff; no man born of a woman can harm him; he will not be defeated until Birnam Wood comes to Dunsinane Hill. They also show him a line of kings descended from Banquo. Learning that Macduff has fled to England, Macbeth has Macduff’s wife and children murdered. In England, Macduff hears the news and, with Malcolm, prepares to invade Scotland."],
["Act 5","Lady Macbeth sleepwalks, trying to wash imaginary blood from her hands. She dies offstage, probably by suicide, and Macbeth responds with his despairing ‘Tomorrow, and tomorrow, and tomorrow’ speech. Malcolm’s soldiers carry branches from Birnam Wood as camouflage, so the forest seems to move. In battle, Macduff reveals that he was cut from his mother’s womb rather than born naturally. Macduff kills Macbeth, and Malcolm becomes king."]],
chars:[["Macbeth","A brave general whose ambition turns him into a tyrant."],["Lady Macbeth","His wife; drives the murder, then is destroyed by guilt."],["The three witches","The ‘weird sisters,’ who speak in riddles about the future."],["Banquo","Macbeth’s fellow general; resists temptation; a foil to Macbeth."],["Fleance","Banquo’s son; escapes the murderers."],["King Duncan","The generous, trusting king of Scotland."],["Malcolm","Duncan’s elder son; becomes king at the end."],["Macduff","A Scottish nobleman; Macbeth’s nemesis."],["Lady Macduff","Macduff’s wife; murdered with her children."],["The Porter","A comic, drunken gatekeeper."]],
themes:[["Ambition","Ambition is Macbeth’s fatal flaw. Without moral limits, it drives him to murder again and again to protect what he has stolen."],
["Guilt","Guilt appears as blood, sleeplessness and visions. Macbeth’s guilt hardens into numbness, while Lady Macbeth’s breaks her mind."],
["Fate vs. free will","The witches predict the future but never tell Macbeth to kill. The play asks whether he was destined to be king or chose his path himself."],
["Appearance vs. reality","‘Fair is foul, and foul is fair’: in this world, loyal faces hide murderous plans, and prophecies hide traps."],
["Manhood and violence","Lady Macbeth links manhood to violence, but Macduff shows a different kind of man, one who can both fight and grieve."],
["Order and disorder","Killing a king upsets the natural order: storms rage, darkness covers the day and Duncan’s horses turn wild."]],
syms:[["Blood","Guilt that cannot be washed away."],
["Sleep","Innocence and peace; Macbeth says he has ‘murdered sleep.’"],
["The dagger","Temptation and the pull toward murder."],
["Darkness","Evil deeds hidden from the light; Macbeth and Lady Macbeth both call on night to hide them."],
["Borrowed clothes","Macbeth’s new titles are described as robes that do not fit him, showing he does not deserve them."]],
devs:[["Soliloquy","Macbeth’s speeches alone, such as the dagger speech, reveal his fear and ambition."],
["Dramatic irony","Duncan praises the pleasant air of the castle where the audience knows he will be murdered."],
["Paradox and equivocation","The witches speak in contradictions and double meanings that are true in ways Macbeth does not expect."],
["Imagery","Images of blood, darkness and disease run through the play."],
["Foil characters","Banquo hears a prophecy too but stays loyal, highlighting Macbeth’s choice."],
["Comic relief","The Porter’s drunken jokes right after the murder release tension and add dark irony."]],
ct:[{q:"Who is most responsible for Duncan’s murder: Macbeth, Lady Macbeth or the witches?",claim:"Choose one and defend your choice.",ev:"1.3 (the prophecy), 1.5 (Lady Macbeth’s soliloquy), 1.7 (Macbeth’s doubts and her persuasion), 2.1 (the dagger).",rs:"Separate who suggests the idea, who pushes it and who carries it out.",cc:"If Macbeth already wanted to be king, did the witches only reveal his desire?",m:"Model claim: Macbeth is most responsible: the witches only predict and Lady Macbeth only persuades, but he knows the murder is wrong and chooses it anyway."},
{q:"Would Macbeth have become king without the prophecy?",claim:"Argue whether the prophecy causes or reveals Macbeth’s ambition.",ev:"1.3 (Macbeth’s first reaction and Banquo’s warning about ‘instruments of darkness’), 1.4 (Malcolm is named heir).",rs:"Compare Macbeth’s response with Banquo’s, since both hear prophecies.",cc:"Banquo also hears good news but does nothing wicked. What does that prove?",m:"Model claim: The prophecy does not create Macbeth’s ambition but releases it; Banquo’s restraint shows that the same words need not lead to murder."},
{q:"Is Macbeth a tragic hero or simply a villain?",claim:"Take a position using the definition of a tragic hero.",ev:"1.2 (his bravery), 1.7 (his conscience), 3.1–3.2 (planning Banquo’s murder), 5.5 (the ‘Tomorrow’ speech).",rs:"Ask whether the audience still feels pity for him at the end.",cc:"After he murders Macduff’s family, can we still feel sympathy?",m:"Model claim: Macbeth begins as a tragic hero whose flaw destroys him, but by Act 4 he has become a villain, which makes his final despair both deserved and pitiable."},
{q:"Why does Lady Macbeth collapse while Macbeth grows harder?",claim:"Explain the reversal between husband and wife.",ev:"1.5 and 1.7 (her strength), 2.2 (she says a little water will clear them of the deed), 3.2 (Macbeth plans without her), 5.1 (sleepwalking).",rs:"Track who controls the action in each act.",cc:"Is her collapse a sign of weakness, or of a conscience she tried to deny?",m:"Model claim: Lady Macbeth suppresses her conscience for one terrible act, but it returns and destroys her, while Macbeth kills so often that guilt turns to numbness."},
{q:"How do the witches’ riddles mislead Macbeth?",claim:"Analyze how half-truths work in the play.",ev:"4.1 (the apparitions), 5.5 (Birnam Wood moves), 5.8 (Macduff’s birth; 5.7 in some editions).",rs:"Explain why Macbeth believes what he wants to hear.",cc:"Did the witches lie, or did Macbeth fail to question them?",m:"Model claim: The witches tell technically true riddles, and Macbeth’s overconfidence turns them into false promises; the play warns that we hear what our desires want us to hear."},
{q:"Cross-text: Compare Macbeth’s rise to power with Jack’s in Lord of the Flies.",claim:"Argue what both texts suggest about how people seize and keep power.",ev:"Macbeth 3.1 and 4.1; Lord of the Flies Ch. 8 and Ch. 11.",rs:"Look at fear, violence and the removal of rivals.",cc:"Macbeth is an adult king and Jack is a boy. Does that change the comparison?",m:"Model claim: Both leaders take power by exploiting fear and keep it through violence against anyone who threatens them, and both rules end in destruction."}],
kz:{"Ambition":"野心","Guilt":"罪惡感","Appearance vs. reality":"表象與真實","Manhood and violence":"男子氣概與暴力","Order and disorder":"秩序與混亂","Blood":"血","Sleep":"睡眠","The dagger":"匕首","Darkness":"黑暗","Borrowed clothes":"借來的衣服","Paradox and equivocation":"悖論與模稜兩可","Comic relief":"喜劇調劑"},
zh:{bg:["約寫於 1606 年的悲劇，也是莎士比亞最短的一部悲劇。它取材自 Raphael Holinshed 的不列顛史《Chronicles》，但對史實做了大幅改動。真實的 Macbeth 於 1040 至 1057 年統治蘇格蘭。",
"這部劇寫於蘇格蘭國王 James 六世成為英格蘭國王 James 一世後不久。James 對巫術非常著迷，而且被認為是 Banquo 的後裔，因此這部劇一方面奉承他，一方面警告人們不可殺害合法的國王。",
"本劇屬於公共領域，可以直接引用原文；請標示幕、場和行數，各版本的行數略有不同。出於迷信，許多演員避免在劇院裡說出劇名，而稱它為「那部蘇格蘭劇」。"],
sum:["三個女巫在荒野上相會。蘇格蘭將軍 Macbeth 和 Banquo 從戰場歸來時遇見她們：女巫稱 Macbeth 為 Cawdor 領主和未來的國王，並告訴 Banquo 他的子孫將成為國王。不久，Duncan 國王的使者宣布 Macbeth 被封為 Cawdor 領主。Macbeth 寫信給妻子，Macbeth 夫人擔心丈夫太善良、不敢奪取王位，便召喚黑暗的靈魂讓自己充滿殘忍。Duncan 到他們的城堡作客時，Macbeth 猶豫了，但她嘲笑他不像男人，直到他同意謀殺國王。",
"行兇前，Macbeth 看見一把飄浮、沾血的匕首。他趁 Duncan 熟睡時殺了他，卻因過度驚慌而無法完成計畫，於是 Macbeth 夫人把匕首放回去，並把血抹在熟睡的侍衛身上。一個喝醉的門房一邊開玩笑說自己是地獄的看門人，一邊聽著有人敲門。Macduff 發現了屍體，Macbeth 聲稱因為憤怒而殺了侍衛。Duncan 的兒子 Malcolm 和 Donalbain 分別逃往英格蘭和愛爾蘭，Macbeth 加冕為王。",
"想起關於 Banquo 子孫的預言，Macbeth 僱用刺客去殺 Banquo 和他的兒子 Fleance。Banquo 被殺，但 Fleance 逃走了。在王室宴會上，Banquo 的鬼魂出現在 Macbeth 的座位上；只有 Macbeth 看得見，他的驚恐讓賓客們十分不安。Macbeth 夫人把賓客們打發走了。",
"Macbeth 去找女巫，她們讓他看見幻影：要提防 Macduff；凡是女人生的都傷不了他；直到 Birnam 森林移到 Dunsinane 山之前，他都不會被打敗。她們還讓他看見一列 Banquo 後裔的國王。得知 Macduff 逃往英格蘭後，Macbeth 下令殺害 Macduff 的妻子和孩子。在英格蘭，Macduff 得知消息，與 Malcolm 一起準備進攻蘇格蘭。",
"Macbeth 夫人夢遊，試圖洗掉手上想像中的血跡。她在台下死去，很可能是自殺，Macbeth 則以充滿絕望的「Tomorrow, and tomorrow, and tomorrow」獨白回應。Malcolm 的士兵拿著 Birnam 森林的樹枝作為偽裝，讓森林看起來像在移動。戰鬥中，Macduff 揭露自己是剖開母親的子宮取出，而非自然出生。Macduff 殺死 Macbeth，Malcolm 成為國王。"],
chars:["勇敢的將軍，野心讓他變成暴君。","他的妻子；推動謀殺，後來被罪惡感摧毀。","「命運三姊妹」，用謎語談論未來。","Macbeth 的將軍同僚；抵擋住誘惑；Macbeth 的對照角色。","Banquo 的兒子；逃過刺客的追殺。","慷慨、輕信他人的蘇格蘭國王。","Duncan 的長子；最後成為國王。","蘇格蘭貴族；Macbeth 的剋星。","Macduff 的妻子；和孩子們一起遇害。","滑稽、喝醉的門房。"],
themes:["野心是 Macbeth 的致命缺陷。沒有道德的約束，野心驅使他一再殺人，以保住他偷來的一切。","罪惡感以鮮血、失眠和幻覺的形式出現。Macbeth 的罪惡感逐漸變成麻木，Macbeth 夫人的罪惡感則讓她精神崩潰。","女巫預言了未來，卻從未叫 Macbeth 去殺人。這部劇提出的問題是：他是命中注定要當國王，還是自己選擇了這條路？","「美即是醜，醜即是美」：在這個世界裡，忠誠的面孔下藏著謀殺的計畫，預言裡藏著陷阱。","Macbeth 夫人把男子氣概與暴力連在一起，但 Macduff 展現出另一種男人：既能戰鬥，也能悲傷。","殺害國王打亂了自然秩序：暴風雨肆虐，白晝被黑暗籠罩，Duncan 的馬也變得狂野。"],
syms:["洗不掉的罪惡。","純真與平靜；Macbeth 說他「謀殺了睡眠」。","誘惑，以及走向謀殺的拉力。","隱藏在光明之外的惡行；Macbeth 和夫人都呼喚黑夜來掩蓋他們。","Macbeth 的新頭銜被形容成不合身的長袍，顯示他配不上這些頭銜。"],
devs:["Macbeth 獨自一人時的獨白（例如匕首獨白），揭露了他的恐懼與野心。","Duncan 稱讚城堡空氣宜人，而觀眾知道他將在那裡被殺。","女巫用矛盾和雙關的話語說話，這些話以 Macbeth 意想不到的方式成真。","鮮血、黑暗和疾病的意象貫穿全劇。","Banquo 也聽到了預言，卻保持忠誠，凸顯出 Macbeth 的選擇。","謀殺發生後，門房醉醺醺的笑話緩和了緊張氣氛，也增添了黑色反諷。"],
ct:[{q:"誰應該為 Duncan 的死負最大責任：Macbeth、Macbeth 夫人，還是女巫？",claim:"選一個並為你的選擇辯護。",ev:"1.3（預言）、1.5（Macbeth 夫人的獨白）、1.7（Macbeth 的猶豫與她的說服）、2.1（匕首）。",rs:"區分誰提出想法、誰推動它、誰付諸行動。",cc:"如果 Macbeth 原本就想當國王，女巫是否只是揭露了他的慾望？",m:"參考論點：Macbeth 責任最大：女巫只是預言，Macbeth 夫人只是說服，但他明知謀殺是錯的，還是選擇了它。"},
{q:"如果沒有預言，Macbeth 還會成為國王嗎？",claim:"論證預言是造成還是揭露了 Macbeth 的野心。",ev:"1.3（Macbeth 的第一反應，以及 Banquo 對「黑暗的工具」的警告）、1.4（Malcolm 被立為繼承人）。",rs:"比較 Macbeth 和 Banquo 的反應，因為兩人都聽到了預言。",cc:"Banquo 也聽到了好消息，卻沒有做任何壞事。這證明了什麼？",m:"參考論點：預言並沒有創造 Macbeth 的野心，而是釋放了它；Banquo 的克制顯示，同樣的話不一定會導致謀殺。"},
{q:"Macbeth 是悲劇英雄，還是單純的惡人？",claim:"用悲劇英雄的定義表明立場。",ev:"1.2（他的勇敢）、1.7（他的良心）、3.1–3.2（策劃殺害 Banquo）、5.5（「Tomorrow」獨白）。",rs:"問問自己，觀眾在最後是否仍對他感到同情。",cc:"在他殺害 Macduff 全家之後，我們還能同情他嗎？",m:"參考論點：Macbeth 一開始是被自身缺陷摧毀的悲劇英雄，但到了第四幕，他已經變成惡人，這讓他最後的絕望既是罪有應得，又令人憐憫。"},
{q:"為什麼 Macbeth 夫人崩潰了，而 Macbeth 卻越來越冷酷？",claim:"說明這對夫妻之間的角色反轉。",ev:"1.5 和 1.7（她的強悍）、2.2（她說一點水就能洗清他們的罪行）、3.2（Macbeth 不再和她商量就自行策劃）、5.1（夢遊）。",rs:"追蹤每一幕中由誰主導劇情。",cc:"她的崩潰是軟弱的表現，還是她試圖否認的良心？",m:"參考論點：Macbeth 夫人為了一次可怕的行動壓抑良心，但良心回來摧毀了她；而 Macbeth 殺了太多次，罪惡感已化為麻木。"},
{q:"女巫的謎語如何誤導 Macbeth？",claim:"分析半真半假的話在劇中如何運作。",ev:"4.1（幻影）、5.5（Birnam 森林移動）、5.8（Macduff 的出生；部分版本為 5.7）。",rs:"說明 Macbeth 為什麼會相信他想聽的話。",cc:"是女巫說了謊，還是 Macbeth 沒有質疑她們？",m:"參考論點：女巫說的謎語在字面上是真的，是 Macbeth 的過度自信把它們變成了虛假的承諾；這部劇警告我們，人只聽得見自己的慾望想聽的話。"},
{q:"跨文本：比較 Macbeth 與《Lord of the Flies》中 Jack 的掌權過程。",claim:"論證兩個文本對人們如何奪取並保住權力有何揭示。",ev:"《Macbeth》3.1 和 4.1；《Lord of the Flies》第 8 章和第 11 章。",rs:"觀察恐懼、暴力和剷除對手。",cc:"Macbeth 是成年的國王，Jack 只是個男孩。這會改變比較的結果嗎？",m:"參考論點：兩位領袖都利用恐懼奪權，並以暴力對付任何威脅他們的人來保住權力，而兩人的統治都以毀滅告終。"}]}};

const HUNGER={
title:"The Hunger Games",author:"Suzanne Collins · 2008",blurb:"Survival, media, resisting power",cite:"author and page, e.g., (Collins 145)",
bg:["The first novel in Suzanne Collins’s trilogy, published in 2008, followed by Catching Fire (2009) and Mockingjay (2010) and a series of films. Collins has said the idea came from flipping between reality TV and news footage of the Iraq War, and from the Greek myth of Theseus, in which Athens had to send young people to be killed by the Minotaur.",
"The story takes place in Panem, a nation built on the ruins of North America. A wealthy Capitol rules twelve poor districts. As punishment for a past rebellion, each district must send one boy and one girl, aged twelve to eighteen, to fight to the death in a televised event called the Hunger Games.",
"The name Panem comes from the Latin phrase panem et circenses, ‘bread and circuses’: keeping people quiet with food and entertainment. Content note: the novel describes children killing and being killed."],
sum:[["Part 1 · The Tributes: the reaping","Sixteen-year-old Katniss Everdeen hunts illegally with her friend Gale to feed her mother and younger sister Prim in District 12, a poor coal-mining district. When Prim’s name is drawn at the reaping, Katniss volunteers to take her place. The boy chosen is Peeta Mellark, the baker’s son, who once gave Katniss bread when her family was starving."],
["Part 1 · The Capitol","Katniss and Peeta travel to the Capitol with their escort Effie Trinket and their mentor Haymitch Abernathy, a past winner who drinks heavily. Their stylist Cinna dresses them in costumes of fire, and Katniss becomes ‘the girl who was on fire.’ In training she earns the top score of eleven. During his televised interview, Peeta announces that he has loved Katniss for years, which angers her but wins sponsors."],
["Part 2 · The Games: survival","In the arena, Katniss runs from the bloodbath at the Cornucopia and struggles to find water. She learns that Peeta has joined the Careers, tributes from wealthy districts who train for the Games. Trapped in a tree, she drops a nest of genetically engineered tracker jackers on them and escapes with a bow."],
["Part 2 · Rue","Katniss allies with Rue, a twelve-year-old from District 11 who reminds her of Prim. Together they destroy the Careers’ food supplies, but Rue is killed. Katniss covers her body with flowers and salutes District 11, an act of defiance against the Capitol. District 11 sends her a gift of bread in return."],
["Part 3 · The Victor: star-crossed lovers","When the Gamemakers announce that two tributes from the same district can win together, Katniss finds the badly wounded Peeta hidden by the river. In a cave, she nurses him and plays up their romance for the cameras, earning gifts from sponsors. She risks her life at a feast to get medicine for him, and Thresh, the boy from District 11, spares her because of Rue."],
["Part 3 · The berries","After the last rival dies, the Gamemakers take back the rule change and expect Katniss and Peeta to kill each other. Katniss pulls out poisonous nightlock berries so they can die together, and the Gamemakers declare both of them winners. Haymitch warns Katniss that the Capitol sees her act as rebellion. On the train home, Peeta learns that much of her romance was an act for the cameras, and their relationship is left uncertain."]],
chars:[["Katniss Everdeen","The narrator; a tough, practical survivor who protects her family."],["Peeta Mellark","The male tribute from District 12; kind, persuasive and in love with Katniss."],["Primrose (Prim) Everdeen","Katniss’s gentle younger sister."],["Gale Hawthorne","Katniss’s hunting partner and close friend back home."],["Haymitch Abernathy","Their mentor; a former victor who hides his intelligence behind drinking."],["Effie Trinket","The Capitol escort; cheerful and blind to the Games’ cruelty."],["Cinna","Katniss’s stylist; quietly kind and subversive."],["Rue","A young tribute from District 11 who becomes Katniss’s ally."],["Cato","A powerful Career tribute from District 2."],["President Snow","The ruler of Panem."]],
themes:[["Power and control","The Capitol uses hunger, fear and spectacle to control the districts. The Games remind everyone of their powerlessness every year."],
["Media and spectacle","Everything Katniss does is shaped by the cameras. Survival depends on performing a story the audience will love."],
["Inequality","The Capitol lives in luxury while the districts starve, showing how extreme wealth gaps can be normalized."],
["Survival and morality","Katniss must survive without losing her humanity, a tension shown in her care for Rue and Peeta."],
["Rebellion","Small acts, such as the flowers for Rue and the berries, become powerful challenges to authority."]],
syms:[["The mockingjay","A bird the Capitol never meant to exist; it comes to represent survival and resistance."],
["Bread","Hope, kindness and connection — from Peeta’s gift to District 11’s thank-you."],
["Fire","Katniss’s public image as the girl on fire, and the spark of rebellion."],
["The nightlock berries","Katniss’s refusal to play by the Capitol’s rules."]],
devs:[["First-person present tense","Katniss narrates as events happen, creating suspense and immediacy."],
["Allusion","Panem and the tributes echo ancient Rome and the myth of Theseus and the Minotaur."],
["Irony","The Capitol calls the Games a celebration while they are a punishment."],
["Foreshadowing","The mockingjay pin and Katniss’s defiance hint at the larger rebellion to come."],
["Satire","The Capitol’s fashions and TV shows exaggerate real reality TV and celebrity culture."]],
ct:[{q:"Is Katniss a hero or a survivor?",claim:"Take a position.",ev:"Volunteering for Prim; her alliance with Rue; caring for Peeta; the berries.",rs:"Decide whether her choices are about survival, love or resistance.",cc:"Katniss says she acts mainly for her family. Does that make her less of a hero?",m:"Model claim: Katniss starts as a survivor, but her refusal to let the Capitol control her choices makes her a reluctant hero."},
{q:"How does the novel criticize reality TV and media?",claim:"Analyze the role of the cameras.",ev:"The interviews; Cinna’s costumes; the cave scenes with Peeta.",rs:"Show how performance shapes survival and how audiences enjoy others’ suffering.",cc:"Is the novel itself part of the entertainment it criticizes?",m:"Model claim: Collins shows that when suffering becomes entertainment, audiences stop seeing the victims as real people."},
{q:"Why is the moment with Rue’s body so important?",claim:"Interpret the flowers and salute.",ev:"Rue’s death; District 11’s bread; Thresh sparing Katniss.",rs:"Explain how a private act of grief becomes public resistance.",cc:"Did Katniss intend it as rebellion?",m:"Model claim: By honoring Rue, Katniss reminds viewers that tributes are children, turning grief into an act of defiance."},
{q:"How does the Capitol keep control?",claim:"Analyze the methods of power.",ev:"The reaping; the Games’ rules; the districts’ poverty; the tesserae.",rs:"Connect hunger, fear and entertainment to control.",cc:"Why don’t the districts rebel earlier?",m:"Model claim: The Capitol controls Panem by keeping people too hungry and divided to resist, and by turning punishment into a show."},
{q:"Was the romance with Peeta real?",claim:"Interpret Katniss’s feelings.",ev:"Peeta’s interview; the cave; the train ride home.",rs:"Consider how performance and real emotion blend.",cc:"Is it wrong for Katniss to act for the cameras?",m:"Model claim: The romance is both strategy and feeling, showing how the Games make even emotions into weapons."},
{q:"Cross-text: Compare the Hunger Games with the Roman gladiator games.",claim:"Argue what the comparison reveals.",ev:"The novel, plus a reliable history source on Roman gladiators and ‘bread and circuses.’",rs:"Compare purpose, audience and control.",cc:"Are there similar spectacles today?",m:"Model claim: Both the Roman games and the Hunger Games use spectacle to distract and control people, a warning that still applies to modern media."}],
kz:{"Power and control":"權力與控制","Media and spectacle":"媒體與奇觀","Inequality":"不平等","Survival and morality":"生存與道德","Rebellion":"反抗","The mockingjay":"嘲笑鳥","Bread":"麵包","Fire":"火","The nightlock berries":"夜鎖莓","First-person present tense":"第一人稱現在式","Allusion":"典故","Irony":"反諷","Foreshadowing":"伏筆","Satire":"諷刺"},
zh:{bg:["Suzanne Collins 三部曲的第一部，2008 年出版，續集為《Catching Fire》（2009）和《Mockingjay》（2010），並改編成系列電影。Collins 說靈感來自轉台時看到真人實境秀和伊拉克戰爭的新聞畫面交替出現，以及希臘神話中雅典必須送年輕人給牛頭人吃的忒修斯故事。",
"故事發生在 Panem，一個建立在北美廢墟上的國家。富裕的都城統治十二個貧窮的行政區。為了懲罰過去的叛亂，每個行政區必須送出一男一女、十二到十八歲的「貢品」，在電視直播的「飢餓遊戲」中廝殺到只剩一人。",
"Panem 這個名字來自拉丁文 panem et circenses，「麵包與馬戲」：用食物和娛樂讓人民安分。內容提醒：小說描寫兒童殺人與被殺。"],
sum:["十六歲的 Katniss Everdeen 和朋友 Gale 非法打獵，養活母親和妹妹 Prim；她們住在貧窮的產煤區第十二區。抽籤時 Prim 被抽中，Katniss 自願代替她。被抽中的男生是麵包師傅的兒子 Peeta Mellark，他曾在 Katniss 一家快餓死時給過她麵包。",
"Katniss 和 Peeta 隨陪同人 Effie Trinket 與導師 Haymitch Abernathy 前往都城；Haymitch 是前屆冠軍，酗酒嚴重。造型師 Cinna 讓他們穿上火焰服裝，Katniss 成為「燃燒的女孩」。訓練中她拿到最高分十一分。電視訪談時，Peeta 宣布自己多年來一直愛著 Katniss，讓她很生氣，卻替他們贏得了贊助人。",
"進入競技場後，Katniss 逃離豐饒角的血腥混戰，努力尋找水源。她得知 Peeta 加入了「職業貢品」，那些來自富裕行政區、專門為遊戲受訓的選手。被困在樹上時，她把一窩基因改造的追蹤殺人蜂丟到他們身上，拿到弓箭後逃走。",
"Katniss 與第十一區的十二歲女孩 Rue 結盟，Rue 讓她想起 Prim。兩人一起摧毀職業貢品的物資，但 Rue 被殺。Katniss 用鮮花覆蓋她的遺體，向第十一區致敬，這是對都城的反抗。第十一區送來麵包作為回禮。",
"遊戲設計師宣布同一區的兩名貢品可以一起獲勝後，Katniss 在河邊找到重傷、偽裝藏身的 Peeta。在山洞裡，她照顧他，並在鏡頭前刻意表現兩人的戀情，贏得贊助人的禮物。她冒險參加盛宴為他取藥，第十一區的男孩 Thresh 因為 Rue 而放她一條生路。",
"最後一名對手死後，遊戲設計師收回規則，要 Katniss 和 Peeta 互相殘殺。Katniss 拿出有毒的夜鎖莓，打算兩人一起死，遊戲設計師只好宣布兩人都是冠軍。Haymitch 警告 Katniss，都城把她的舉動視為反叛。回家的火車上，Peeta 得知她的戀情大多是演給鏡頭看的，兩人的關係懸而未決。"],
chars:["敘事者；堅強務實的生存者，保護自己的家人。","第十二區的男貢品；善良、善於說服，深愛 Katniss。","Katniss 溫柔的妹妹。","Katniss 的狩獵夥伴，也是家鄉的好友。","他們的導師；前屆冠軍，用酗酒掩飾自己的聰明。","都城的陪同人；開朗，卻看不見遊戲的殘酷。","Katniss 的造型師；默默善良，暗中顛覆。","第十一區的年幼貢品，成為 Katniss 的盟友。","來自第二區的強大職業貢品。","Panem 的統治者。"],
themes:["都城用飢餓、恐懼和奇觀控制各區。飢餓遊戲每年都提醒所有人他們有多無力。","Katniss 的一舉一動都受鏡頭影響。要活下來，就得演出觀眾喜愛的故事。","都城過著奢華生活，各區卻在挨餓，顯示極端的貧富差距如何被視為理所當然。","Katniss 必須活下來又不失去人性，這份張力表現在她對 Rue 和 Peeta 的照顧上。","為 Rue 獻花、拿出毒莓等小小的舉動，成為對權威的強大挑戰。"],
syms:["都城從未打算讓牠存在的鳥；後來代表生存與反抗。","希望、善意與連結：從 Peeta 的贈予到第十一區的答謝。","Katniss「燃燒的女孩」的公眾形象，以及反抗的火花。","Katniss 拒絕照都城的規則玩。"],
devs:["Katniss 以事件正在發生的方式敘述，營造懸疑感與臨場感。","Panem 和貢品制度呼應古羅馬，以及忒修斯與牛頭人的神話。","都城把遊戲稱為慶典，實際上卻是懲罰。","嘲笑鳥胸針和 Katniss 的反抗，預示了即將到來的更大叛亂。","都城的時尚和電視節目，誇大了現實中的真人實境秀與名人文化。"],
ct:[{q:"Katniss 是英雄還是生存者？",claim:"表明立場。",ev:"代替 Prim 自願參加；與 Rue 結盟；照顧 Peeta；毒莓。",rs:"判斷她的選擇是為了生存、為了愛，還是為了反抗。",cc:"Katniss 說她主要是為了家人而行動。這會讓她不那麼像英雄嗎？",m:"參考論點：Katniss 起初只是生存者，但她拒絕讓都城掌控自己的選擇，使她成為一位不情願的英雄。"},
{q:"小說如何批判真人實境秀與媒體？",claim:"分析鏡頭的作用。",ev:"訪談；Cinna 的服裝；與 Peeta 在山洞的場景。",rs:"說明表演如何影響生存，以及觀眾如何享受他人的痛苦。",cc:"小說本身是否也是它所批判的娛樂的一部分？",m:"參考論點：Collins 顯示，當苦難變成娛樂，觀眾就不再把受害者看成真實的人。"},
{q:"Rue 遺體旁的那一刻為什麼這麼重要？",claim:"詮釋獻花與致敬。",ev:"Rue 之死；第十一區的麵包；Thresh 放過 Katniss。",rs:"說明一個私人的哀悼行為如何變成公開的反抗。",cc:"Katniss 是有意反叛嗎？",m:"參考論點：Katniss 藉由悼念 Rue，提醒觀眾貢品是孩子，把悲傷化為反抗的行動。"},
{q:"都城如何維持控制？",claim:"分析權力的手段。",ev:"抽籤；遊戲規則；各區的貧窮；配給券（tesserae）。",rs:"把飢餓、恐懼和娛樂與控制連結起來。",cc:"各區為什麼沒有更早反抗？",m:"參考論點：都城讓人民餓到、分裂到無力反抗，並把懲罰變成表演，藉此控制 Panem。"},
{q:"和 Peeta 的戀情是真的嗎？",claim:"詮釋 Katniss 的感情。",ev:"Peeta 的訪談；山洞；回家的火車。",rs:"想一想表演與真實情感如何交融。",cc:"Katniss 為鏡頭演戲是錯的嗎？",m:"參考論點：這段戀情既是策略也是感情，顯示飢餓遊戲甚至把情感變成武器。"},
{q:"跨文本：把飢餓遊戲和古羅馬的角鬥士競技做比較。",claim:"論證這個比較揭示了什麼。",ev:"小說本身，加上一份關於羅馬角鬥士與「麵包與馬戲」的可靠歷史資料。",rs:"比較目的、觀眾與控制。",cc:"今天有類似的奇觀嗎？",m:"參考論點：羅馬競技和飢餓遊戲都用奇觀來轉移注意力、控制人民，這個警告對現代媒體仍然適用。"}]}};

const BNW={
title:"Brave New World",author:"Aldous Huxley · 1932",blurb:"Pleasure, control, the cost of stability",cite:"author and page, e.g., (Huxley 220)",
bg:["Published in 1932 by the English writer Aldous Huxley. It is set about six hundred years in the future, in the year 632 A.F. — ‘After Ford,’ dated from Henry Ford’s first Model T in 1908. Ford’s assembly line has become the model for an entire society.",
"Huxley wrote during a time of rapid scientific change, mass production, advertising and interest in eugenics. Instead of a society controlled by terror, he imagined one controlled by pleasure, comfort and conditioning. The title comes from a line in Shakespeare’s The Tempest.",
"Readers often compare it with Orwell’s 1984: Orwell feared that people would be controlled by pain, Huxley that they would be controlled by what they enjoy. Content note: the novel includes sexual content, drug use, self-harm and suicide."],
sum:[["Ch. 1–3 · The Hatchery","The Director of the Central London Hatchery and Conditioning Centre shows students how human beings are produced in bottles and sorted into five castes, from Alphas down to Epsilons. Children are conditioned with shocks and sleep-teaching (hypnopaedia) to love their place in society. The World Controller Mustapha Mond explains that family, love, history and art have been removed to keep everyone stable and happy."],
["Ch. 4–6 · Bernard and Lenina","Bernard Marx, an Alpha who is shorter than usual and feels like an outsider, dislikes the shallow pleasures of his society. His friend Helmholtz Watson, a talented writer, also feels empty. Lenina Crowne, a popular worker, agrees to go with Bernard on a trip to the Savage Reservation in New Mexico. Before they leave, the Director tells Bernard he once lost a woman on a visit there."],
["Ch. 7–9 · The Reservation","On the Reservation, Lenina is disgusted by aging, dirt, illness and religious ritual. They meet Linda, a former Beta who was left behind years ago, and her son John, who grew up as an outsider among the Native people and learned to read from an old copy of Shakespeare. Bernard realizes the Director is John’s father and brings John and Linda back to London."],
["Ch. 10–13 · John in London","Bernard humiliates the Director by presenting Linda and John, and the Director resigns. John, called ‘the Savage,’ becomes a celebrity, and Bernard enjoys his new popularity. Linda takes constant doses of soma, the society’s happiness drug. John falls in love with Lenina but is horrified when she offers herself to him without love."],
["Ch. 14–15 · Linda’s death","Linda dies in a hospital where death is treated as unimportant and children are conditioned not to fear it. In grief and rage, John throws away the soma being handed out to Delta workers and tells them to be free. A riot breaks out, and John, Bernard and Helmholtz are arrested."],
["Ch. 16–18 · Mustapha Mond and the lighthouse","Mustapha Mond explains that the society chose happiness and stability over truth, art and God. Bernard and Helmholtz are sent to live on distant islands with other independent thinkers. John claims the right to be unhappy and moves to an abandoned lighthouse, where he punishes himself. Reporters and crowds turn him into a spectacle. Ashamed after giving in to the crowd’s frenzy, John takes his own life."]],
chars:[["Bernard Marx","An Alpha who feels like an outsider but enjoys popularity when it comes."],["Lenina Crowne","A popular worker who fully believes in her society."],["Helmholtz Watson","A gifted writer who wants to create something meaningful."],["John (the Savage)","Raised on the Reservation; sees London through the values of Shakespeare."],["Linda","John’s mother; once part of the World State, left behind on the Reservation."],["The Director (Tomakin)","Head of the Hatchery and John’s father."],["Mustapha Mond","A World Controller who knows exactly what his society gave up."]],
themes:[["Happiness vs. truth","The World State gives people constant pleasure but takes away art, science, religion and real relationships."],
["Control through pleasure","Instead of terror, the state uses drugs, entertainment and sex to keep people satisfied and obedient."],
["Technology and science","Science is used not to discover truth but to engineer people and keep society the same."],
["Individuality","Anyone who thinks or feels differently is pushed out, showing the cost of total stability."],
["Consumerism","People are trained to buy, use and throw away, because consumption keeps the economy running."]],

zh:{bg:["英國作家 Aldous Huxley 1932 年出版的作品。故事設定在大約六百年後的福特紀元 632 年（A.F.，「福特之後」，從 1908 年亨利・福特的第一輛 T 型車起算）。福特的裝配線成了整個社會的模範。",
"Huxley 寫作時正值科學快速發展、大量生產、廣告興起，以及優生學受到關注的年代。他想像的不是用恐怖統治的社會，而是用享樂、舒適與制約來控制的社會。書名取自莎士比亞《暴風雨》中的一句台詞。",
"讀者常把它和歐威爾的《1984》相比：歐威爾擔心人們被痛苦控制，Huxley 則擔心人們被自己喜愛的事物控制。內容提醒：小說有性內容、藥物使用、自殘與自殺。"],
sum:["倫敦中央孵化與制約中心的主任向學生展示，人類如何在瓶子裡被製造出來，並被分成從 Alpha 到 Epsilon 的五個種姓。孩子們透過電擊和睡眠教學被制約，愛上自己在社會中的位置。世界控制官 Mustapha Mond 解釋，家庭、愛情、歷史和藝術都已被移除，為的是讓所有人穩定又快樂。",
"Bernard Marx 是個比一般 Alpha 矮、覺得自己格格不入的人，他不喜歡社會中膚淺的享樂。他的朋友 Helmholtz Watson 是個有才華的作家，也感到空虛。受歡迎的員工 Lenina Crowne 答應和 Bernard 一起去新墨西哥州的野蠻人保留區。出發前，主任告訴 Bernard 他曾在那裡弄丟過一個女人。",
"在保留區，Lenina 對衰老、髒亂、疾病和宗教儀式感到噁心。他們遇見多年前被留下的前 Beta 女子 Linda，以及她的兒子 John；John 在原住民之間以局外人的身分長大，靠一本舊的莎士比亞全集學會閱讀。Bernard 發現主任就是 John 的父親，於是把 John 和 Linda 帶回倫敦。",
"Bernard 當眾帶出 Linda 和 John，讓主任顏面盡失而辭職。被稱為「野蠻人」的 John 成了名人，Bernard 也享受起新得到的人氣。Linda 不斷服用社會的快樂藥物 soma。John 愛上 Lenina，但當她在沒有愛的情況下向他獻身時，他感到驚恐。",
"Linda 死在一間醫院裡；在那裡，死亡被當作無關緊要的事，孩子們被制約成不怕死亡。悲憤之下，John 把正在發給 Delta 工人的 soma 丟掉，叫他們要自由。現場爆發暴動，John、Bernard 和 Helmholtz 被捕。",
"Mustapha Mond 解釋，這個社會選擇了幸福與穩定，而放棄了真理、藝術和上帝。Bernard 和 Helmholtz 被送到遙遠的島嶼，和其他獨立思考者一起生活。John 主張自己有不快樂的權利，搬進一座廢棄的燈塔，在那裡懲罰自己。記者和群眾把他變成一場奇觀。在屈服於群眾的狂熱後，John 羞愧地結束了自己的生命。"],
chars:["覺得自己格格不入的 Alpha，但人氣來時也樂在其中。","受歡迎的員工，完全相信她的社會。","有天分的作家，想創作有意義的作品。","在保留區長大；用莎士比亞的價值觀看倫敦。","John 的母親；曾是世界國的一員，被留在保留區。","孵化中心的主任，也是 John 的父親。","一位世界控制官，清楚知道他的社會放棄了什麼。"],
themes:["世界國給人們源源不絕的享樂，卻奪走了藝術、科學、宗教和真正的人際關係。","國家不用恐怖，而是用藥物、娛樂和性，讓人民滿足而順從。","科學不是用來發現真理，而是用來改造人、讓社會維持不變。","任何想法或感受與眾不同的人都會被排除，顯示完全穩定的代價。","人們被訓練去購買、使用、丟棄，因為消費讓經濟運轉。"],
syms:["消除痛苦與思考的藥物：以舒適取代自由。","世界國禁止的深刻情感、藝術與意義。","大量生產成為新宗教；十字架變成了 T。","John 試圖逃離社會，社會卻依然找到並毀了他。"],
devs:["Huxley 誇大現實中的趨勢，例如廣告、大量生產、情緒藥物，加以批判。","一個為消除苦難而建立的社會，卻產生了深刻的空虛。","莎士比亞的引文讓 John 有語言去評判這個新世界。","第三章的場景在不同角色之間快速切換，模仿這個社會的速度。","John 與 Mustapha Mond、Bernard 與 Helmholtz，呈現對同一個世界的不同反應。"],
ct:[{q:"世界國是烏托邦還是反烏托邦？",claim:"表明立場。",ev:"孵化中心參觀；soma；Mustapha Mond 的論點；John 的結局。",rs:"權衡幸福與和平，以及自由與意義。",cc:"大多數公民都很快樂。我們憑什麼評判？",m:"參考論點：世界國是反烏托邦，因為它提供的幸福要求人們放棄選擇與深刻感受的能力。"},
{q:"Mustapha Mond 說穩定值得付出代價，他說得對嗎？",claim:"評價他的論點。",ev:"第 16–17 章。",rs:"說明他的理由，再用小說呈現的內容加以檢驗。",cc:"一個有苦難也有藝術的世界真的比較好嗎？",m:"參考論點：Mond 的論點合乎邏輯，但小說顯示，沒有掙扎、愛或真理的生活，並不是完整的人生。"},
{q:"John 為什麼在世界國失敗？",claim:"分析 John 的悲劇。",ev:"他對 Lenina 的愛；Linda 之死；暴動；燈塔。",rs:"說明他的價值觀與社會價值觀之間的衝突。",cc:"John 自己的極端是否也是問題的一部分？",m:"參考論點：John 失敗是因為他在兩個世界都沒有容身之處；他的價值觀是真實的，卻無法活出來。"},
{q:"世界國如何不用暴力就控制人民？",claim:"分析控制的手段。",ev:"睡眠教學；soma；種姓制度；消費主義。",rs:"把這些手段和《1984》或《飢餓遊戲》中的手段相比。",cc:"用享樂控制，仍然是控制嗎？",m:"參考論點：Huxley 顯示，當人們愛上限制他們的體制時，控制才最徹底。"},
{q:"《美麗新世界》中的哪些預言已經成真？",claim:"論證這部小說今天的相關性。",ev:"小說本身，加上現代科技、娛樂或醫學的例子。",rs:"仔細比較具體細節，而不是做籠統的論斷。",cc:"我們的世界和 Huxley 的世界之間有重要的差異嗎？",m:"參考論點：Huxley 對無盡娛樂與人造幸福的警告，現在比他寫作時更貼切。"},
{q:"跨文本：比較《美麗新世界》與《1984》。",claim:"論證哪一種控制的願景更有說服力。",ev:"兩部小說（《1984》指南在十二年級）。",rs:"比較用恐懼控制和用享樂控制。",cc:"兩種控制有可能同時存在嗎？",m:"參考論點：《1984》呈現用痛苦控制，《美麗新世界》呈現用享樂控制；現代社會可能同時面對兩者。"}]}};

title:"Animal Farm",author:"George Orwell · 1945",blurb:"Revolution, propaganda, corrupted power",cite:"author and page, e.g., (Orwell 88)",
bg:["A short novel, subtitled A Fairy Story, published in 1945 by the English writer George Orwell, who later wrote 1984. Orwell had fought against fascism in the Spanish Civil War and became a strong critic of Soviet communism under Joseph Stalin.",
"The novel is an allegory of the Russian Revolution of 1917 and the rise of Stalin. Farm animals overthrow their human owner, hoping to build a society where all animals are equal, but their leaders gradually become as cruel as the humans they replaced.",
"Several publishers rejected the book because Britain and the Soviet Union were allies in World War II. Content note: the novel includes the killing of animals, forced confessions and executions."],
sum:[["Ch. 1–2 · Old Major’s dream and the Rebellion","Old Major, a respected boar, describes a dream of a world without humans and teaches the animals the song Beasts of England. After he dies, the pigs Snowball and Napoleon organize the animals. When the farmer, Mr. Jones, forgets to feed them, they drive him away and rename Manor Farm ‘Animal Farm.’ The pigs write Seven Commandments, including ‘All animals are equal.’ The cows’ milk quietly disappears."],
["Ch. 3–4 · Early success","The harvest is the best ever. The hardworking horse Boxer adopts the motto ‘I will work harder.’ The pigs take the milk and apples for themselves, and Squealer, a persuasive pig, explains that they need it to lead. Jones tries to retake the farm, but the animals win the Battle of the Cowshed, led by Snowball."],
["Ch. 5–6 · Snowball and the windmill","Snowball and Napoleon disagree about everything, especially Snowball’s plan to build a windmill. Napoleon’s dogs, which he secretly raised, chase Snowball off the farm. Napoleon ends public debates, then announces the windmill as his own idea. The pigs move into the farmhouse and change the commandments to fit their behavior. When a storm destroys the windmill, Napoleon blames Snowball."],
["Ch. 7 · Fear and executions","Food runs short, and Napoleon forces animals to confess to working with Snowball, then has the dogs kill them. Beasts of England is banned. Clover, an old mare, realizes this is not the world Old Major described, but she cannot find the words to say so."],
["Ch. 8–9 · Boxer’s fate","Napoleon sells timber to the neighboring farmer Frederick, who pays with fake money and then attacks; the windmill is blown up. Boxer, badly injured and worn out, is sold to a horse slaughterer while Squealer tells the animals he died peacefully in a hospital. The pigs buy whisky with the money."],
["Ch. 10 · Some animals are more equal","Years pass. The pigs walk on two legs and carry whips. The commandments are replaced with one rule: ‘All animals are equal, but some animals are more equal than others.’ At a dinner with human farmers, Napoleon renames the farm ‘Manor Farm.’ Looking through the window, the other animals can no longer tell the pigs from the men."]],
chars:[["Napoleon","A pig who takes power through force and fear; represents Stalin."],["Snowball","An energetic pig and planner, driven out and blamed; represents Trotsky."],["Old Major","The boar whose dream inspires the rebellion; represents Marx and Lenin."],["Squealer","Napoleon’s spokesman; represents propaganda."],["Boxer","A loyal, hardworking horse; represents the working class."],["Clover","A caring mare who senses that something has gone wrong."],["Benjamin","A cynical donkey who understands but does nothing."],["Moses","A raven who tells of Sugarcandy Mountain; represents religion."],["Mr. Jones","The original farmer; represents the Russian tsar."],["Frederick and Pilkington","Neighboring farmers; represent Hitler’s Germany and Western powers."]],

["Class and inequality","A new ruling class replaces the old one, while workers like Boxer suffer most."],
["Ignorance and silence","The animals’ inability to read, remember or speak up allows the pigs to rule."]],
syms:[["The windmill","Grand plans the leaders use to control and exhaust the workers."],
["The Seven Commandments","Ideals that are rewritten as power grows."],

devs:[["Allegory","Every major character and event represents something in Soviet history."],

["Repetition","Slogans such as ‘Four legs good, two legs bad’ show how chants replace thinking."]],

zh:{bg:["英國作家喬治・歐威爾 1945 年出版的短篇小說，副標題是「一則童話」；他後來寫了《1984》。歐威爾曾在西班牙內戰中對抗法西斯，後來成為史達林統治下蘇聯共產主義的強烈批評者。",
"這部小說是 1917 年俄國革命與史達林崛起的寓言。農場動物推翻人類主人，希望建立一個所有動物平等的社會，但牠們的領導者逐漸變得和被取代的人類一樣殘酷。",
"由於二戰時英國與蘇聯是盟友，好幾家出版社拒絕出版這本書。內容提醒：小說有殺害動物、被迫認罪與處決的情節。"],
sum:["備受尊敬的老公豬 Old Major 描述一個沒有人類的世界之夢，並教動物們唱《英格蘭之獸》。牠死後，豬 Snowball 和 Napoleon 組織動物們。農場主人 Jones 先生忘了餵牠們，動物們便把他趕走，把莊園農場改名為「動物農場」。豬寫下七誡，包括「所有動物一律平等」。牛奶悄悄不見了。",
"收成創下新高。勤奮的馬 Boxer 以「我會更努力工作」為座右銘。豬把牛奶和蘋果留給自己，能言善道的豬 Squealer 解釋說，牠們需要這些才能領導。Jones 試圖奪回農場，但動物們在 Snowball 帶領下贏得牛棚之役。",
"Snowball 和 Napoleon 事事意見相左，尤其是 Snowball 建造風車的計畫。Napoleon 暗中養大的狗把 Snowball 趕出農場。Napoleon 停止公開辯論，接著宣布風車是他自己的主意。豬搬進農舍，並修改誡律來配合自己的行為。暴風雨摧毀風車後，Napoleon 把責任推給 Snowball。",
"糧食短缺，Napoleon 強迫動物們承認與 Snowball 勾結，然後讓狗殺了牠們。《英格蘭之獸》被禁唱。老母馬 Clover 明白這不是 Old Major 描述的世界，卻說不出口。",
"Napoleon 把木材賣給鄰近農夫 Frederick，對方用假鈔付款後發動攻擊，風車被炸毀。重傷又精疲力竭的 Boxer 被賣給屠馬商，Squealer 卻告訴動物們牠在醫院安詳過世。豬用那筆錢買了威士忌。",
"多年過去。豬用兩條腿走路，手持鞭子。誡律被一條規則取代：「所有動物一律平等，但有些動物比其他動物更平等。」在與人類農夫的晚宴上，Napoleon 把農場改回「莊園農場」。其他動物從窗外望進去，已經分不出哪個是豬、哪個是人。"],
chars:["靠武力與恐懼奪權的豬；代表史達林。","充滿活力的規劃者，被趕走並被栽贓；代表托洛斯基。","以夢想激發革命的公豬；代表馬克思與列寧。","Napoleon 的發言人；代表宣傳機器。","忠誠勤奮的馬；代表勞工階級。","有愛心的母馬，察覺事情不對勁。","憤世嫉俗的驢子，看得懂卻什麼也不做。","講述糖果山的烏鴉；代表宗教。","原本的農場主人；代表俄國沙皇。","鄰近的農夫；代表希特勒的德國與西方強權。"],
themes:["豬起初是革命者，最後卻變得和被推翻的人類一模一樣。","Squealer 扭曲字詞和數據，讓動物接受謊言，誡律也被悄悄改寫。","一場追求平等的理想主義運動，被少數人劫持為自己謀利。","新的統治階級取代舊的，而像 Boxer 這樣的勞動者受苦最深。","動物們不識字、記不住、不敢發聲，讓豬得以統治。"],
syms:["領導者用來控制和耗盡勞動者的宏大計畫。","隨著權力擴大而被改寫的理想。","革命的希望，後來被禁止。","豬為自己奪取的人類特權。"],
devs:["每個主要角色和事件都代表蘇聯歷史中的某件事。","會說話的動物和簡單的文風，讓嚴肅的政治教訓清楚易懂。","歐威爾嘲諷那些自稱為人民服務的領袖的偽善。","動物們從人類手中解放自己，卻被行為像人類的豬統治。","「四條腿好，兩條腿壞」等口號，顯示喊口號如何取代思考。"],
ct:[{q:"動物農場的失敗，誰該負最大責任？",claim:"表明立場。",ev:"Napoleon 奪權；Squealer 的演說；Boxer 的忠誠；Benjamin 的沉默。",rs:"權衡領導者的行為與追隨者的選擇。",cc:"能責怪無力的動物嗎？",m:"參考論點：豬負最大責任，但歐威爾顯示，暴政也需要不質疑的追隨者和保持沉默的旁觀者。"},
{q:"語言如何幫助豬取得權力？",claim:"分析宣傳。",ev:"Squealer 的解釋；不斷修改的誡律；口號。",rs:"說明文字如何被用來改變記憶與現實。",cc:"動物們有任何抵抗宣傳的方法嗎？",m:"參考論點：豬藉由控制語言來控制農場，證明控制文字的人就能控制人們相信什麼。"},
{q:"Boxer 的結局為什麼如此震撼？",claim:"詮釋 Boxer 的故事。",ev:"他的座右銘；他的傷；屠馬商的貨車；Squealer 的演說。",rs:"說明 Boxer 代表什麼，以及他的遭遇。",cc:"Boxer 是英雄，還是自己忠誠的受害者？",m:"參考論點：Boxer 被出賣顯示，對領袖盲目的忠誠可能致命，而在失敗的革命中，勞動者往往付出最高代價。"},
{q:"這部小說只是在講蘇聯歷史嗎？",claim:"論證這則寓言有多普遍。",ev:"小說本身，加上另一個領袖背叛運動的歷史或現代例子。",rs:"說明哪些模式在俄國以外也適用。",cc:"把它讀成普遍的寓言，會不會失去它特定的歷史？",m:"參考論點：雖然以蘇聯歷史為本，《動物農場》描述的是任何權力不受制衡之處都可能發生的模式。"},
{q:"結局代表什麼？",claim:"詮釋最後一幕。",ev:"第 10 章：新的誡律；用兩條腿走路的豬；與人類的晚宴。",rs:"說明動物們從窗外看見了什麼。",cc:"結局還有任何希望嗎？",m:"參考論點：結局顯示革命繞了一圈回到原點；新統治者與舊統治者已無法分辨。"},
{q:"跨文本：比較《動物農場》與《1984》。",claim:"論證歐威爾的兩部作品如何警告讀者。",ev:"《動物農場》，加上《1984》（十二年級指南）。",rs:"比較宣傳、改寫歷史與控制。",cc:"寓言和小說，哪一種形式讓警告更有力？",m:"參考論點：兩本書都呈現領袖改寫過去來控制現在；《動物農場》把它寫得簡單，《1984》把它寫得令人恐懼。"}]}};
