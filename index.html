title:"Cyrano de Bergerac",author:"Edmond Rostand · 1897",blurb:"Wit, courage, love behind a mask",cite:"act and page, e.g., (Rostand, Act 3, 112)",
bg:["A verse play in five acts by the French playwright Edmond Rostand, first performed in Paris in 1897, where it was a huge success. It is loosely based on a real person, Savinien de Cyrano de Bergerac (1619–1655), a soldier, poet and writer of early science fiction.",
"The play is set in 1640 in Paris and at the siege of Arras during France’s war with Spain. Cyrano belongs to the Gascon cadets, a company of proud young soldiers from Gascony in southwestern France.",
"Rostand’s original is written in rhyming twelve-syllable lines (alexandrines). English translations, such as Brian Hooker’s (1923), often use blank verse or rhyme. Students should know key terms: panache, wit, duel, soliloquy, gallantry and unrequited love."],
sum:[["Act 1 · The theater","At a Paris theater, Cyrano stops a performance by an actor he has banned. When a nobleman insults his enormous nose, Cyrano mocks him by inventing far better insults himself, then fights him in a duel while composing a poem, finishing with a hit on the last line. Cyrano confesses to his friend Le Bret that he loves his cousin Roxane but believes his nose makes him unlovable. Roxane’s chaperone asks him to meet Roxane the next morning."],
["Act 2 · The bakery","At the pastry shop of his friend Ragueneau, Cyrano hopes Roxane will declare her love. Instead she confesses that she loves Christian de Neuvillette, a handsome new cadet, and asks Cyrano to protect him. Christian joins the cadets and dares to joke about Cyrano’s nose, but Cyrano holds back for Roxane. Christian admits he is not clever with words, and Cyrano offers to write love letters for him."],
["Act 3 · The balcony","Roxane is enchanted by the letters. When Christian tries to speak to her on his own, he fails. Hidden in the dark under her balcony, Cyrano speaks for Christian, pouring out his real feelings, and Roxane falls deeper in love; Christian climbs up for a kiss. The Comte de Guiche, a powerful married nobleman who wants Roxane, arrives. Cyrano delays him with a wild story about falling from the moon while a priest marries Roxane and Christian. Furious, de Guiche sends the cadets to war that night."],
["Act 4 · The siege of Arras","At the siege, the cadets are starving. Cyrano risks his life every day to cross enemy lines and send a letter to Roxane in Christian’s name. Roxane arrives in a carriage full of food and tells Christian she would love him even if he were ugly, because she loves his soul. Christian realizes she truly loves Cyrano’s words and urges Cyrano to tell her the truth. Before he can, Christian is killed in battle, and Cyrano decides to keep the secret forever."],
["Act 5 · The convent","Fifteen years later, Roxane lives in a convent, still mourning Christian. Cyrano, poor and with many enemies, visits her every week. One day he arrives secretly injured — a log dropped on his head in an ambush. He asks to read Christian’s last letter aloud and recites it in the growing darkness, when he could not possibly see the words. Roxane realizes he wrote every letter. Cyrano dies, defiant to the end, keeping his panache."]],
chars:[["Cyrano de Bergerac","A brilliant poet, swordsman and soldier with a very large nose."],["Roxane","Cyrano’s beautiful, intelligent cousin, who loves fine words."],["Christian de Neuvillette","A handsome, brave cadet who struggles to express himself."],["Comte de Guiche","A powerful, married nobleman who pursues Roxane."],["Le Bret","Cyrano’s loyal friend and adviser."],["Ragueneau","A pastry cook who loves poetry."],["Captain Carbon de Castel-Jaloux","Captain of the Gascon cadets."]],
themes:[["Appearance vs. inner beauty","Roxane first loves Christian’s face but ends up loving Cyrano’s soul, suggesting true love sees beyond appearance."],
["The power of words","Cyrano’s language is his strongest weapon and his deepest form of love."],
["Self-sacrifice","Cyrano gives up his own happiness to protect Christian and Roxane."],
["Honor and integrity","Cyrano refuses to flatter powerful people or compromise his values, even when it costs him."],
["Insecurity","Cyrano’s fear of being rejected because of his nose keeps him from ever speaking for himself."]],
syms:[["Cyrano’s nose","His insecurity and his difference from others; also a source of his defiance."],
["The letters","Cyrano’s true self, hidden behind another man’s name."],
["The balcony","The divide between appearance and reality, voice and face."],
["Panache","The white plume of style and courage that Cyrano keeps until death."]],
devs:[["Dramatic irony","The audience knows Cyrano writes the letters long before Roxane does."],
["Wit and wordplay","Cyrano’s nose speech and dueling poem show language as performance."],
["Verse drama","The play is written in rhymed verse, matching Cyrano’s poetic spirit."],
["Romantic heroism","Cyrano is larger than life, combining a sword, a pen and a big heart."],
["Tragicomedy","The play mixes comedy and heartbreak, ending in death and revelation."]],
ct:[{q:"Is Cyrano noble or foolish for hiding his love?",claim:"Take a position.",ev:"Act 1 (his talk with Le Bret); Act 3 (the balcony); Act 4 (Christian’s death); Act 5 (the reading of the letter).",rs:"Weigh the cost of his silence against what he protects.",cc:"Did Cyrano deny Roxane the right to choose?",m:"Model claim: Cyrano’s sacrifice is noble, but his silence is also driven by fear, and it costs both him and Roxane years of happiness."},
{q:"Whom does Roxane really love?",claim:"Interpret Roxane’s feelings.",ev:"Act 2 (her confession); Act 3 (the balcony); Act 4 (‘I would love you if you were ugly’); Act 5.",rs:"Trace how her love changes from appearance to soul.",cc:"Is Roxane shallow, or does she grow?",m:"Model claim: Roxane grows from loving a face to loving a soul, but she cannot know whose soul she loves until it is too late."},
{q:"Is Christian a victim or a willing partner in the deception?",claim:"Evaluate Christian.",ev:"Act 2 (the agreement); Act 3 (his failure alone); Act 4 (his realization).",rs:"Consider his honesty, his limits and his final choice.",cc:"Should Christian have told Roxane the truth earlier?",m:"Model claim: Christian is not a fool; he finally insists on honesty, showing he wants to be loved for who he is."},
{q:"What does panache mean, and why does Cyrano end with it?",claim:"Interpret Cyrano’s final word.",ev:"Act 1 (the duel); Act 4 (the siege); Act 5 (his death).",rs:"Explain how style and courage define Cyrano’s identity.",cc:"Is panache just pride?",m:"Model claim: Cyrano’s panache is his refusal to be defeated in spirit, the one thing he keeps when he has lost everything else."},
{q:"How does Rostand use humor in a tragic story?",claim:"Analyze the mix of comedy and tragedy.",ev:"The nose speech; the moon story; Ragueneau; the final act.",rs:"Explain how laughter makes the sad ending stronger.",cc:"Does the humor make the ending less sad?",m:"Model claim: The humor makes us love Cyrano, so his death and secret sacrifice hurt more."},
{q:"Cross-text: Compare Cyrano with a modern story about speaking for someone else, such as the film The Half of It (2020).",claim:"Argue what the modern version changes or keeps.",ev:"The play, plus one modern adaptation.",rs:"Compare who speaks, why they hide and what the ending says.",cc:"Is the original’s message still true today?",m:"Model claim: Modern versions keep Cyrano’s central question — can we love someone for their words alone? — while changing who gets to speak for themselves."}],
kz:{"Appearance vs. inner beauty":"外表與內在美","The power of words":"文字的力量","Self-sacrifice":"自我犧牲","Honor and integrity":"榮譽與正直","Insecurity":"不安全感","Cyrano’s nose":"Cyrano 的鼻子","The letters":"情書","The balcony":"陽台","Panache":"風範（panache）","Dramatic irony":"戲劇性反諷","Wit and wordplay":"機智與文字遊戲","Verse drama":"詩劇","Romantic heroism":"浪漫英雄主義","Tragicomedy":"悲喜劇"},
zh:{bg:["法國劇作家 Edmond Rostand 的五幕詩劇，1897 年在巴黎首演，大獲成功。劇本大致取材自真實人物 Savinien de Cyrano de Bergerac（1619–1655），他是軍人、詩人，也是早期科幻作品的作者。",
"故事背景是 1640 年的巴黎，以及法國與西班牙交戰時的阿拉斯圍城戰。Cyrano 隸屬加斯科涅軍校生連，這是一支來自法國西南部加斯科涅、驕傲的年輕軍人部隊。",
"Rostand 的原作以押韻的十二音節詩行（亞歷山大體）寫成。英文譯本，例如 Brian Hooker 的版本（1923），常用無韻詩或押韻詩。學生應認識幾個關鍵詞：panache（風範）、wit（機智）、duel（決鬥）、soliloquy（獨白）、gallantry（殷勤）和 unrequited love（單戀）。"],
sum:["在巴黎一家劇院，Cyrano 阻止一名被他禁演的演員上台。一位貴族嘲笑他的大鼻子，Cyrano 自己編出更精彩的嘲諷來回擊，接著一邊和對方決鬥一邊作詩，在最後一句時刺中對手。Cyrano 向朋友 Le Bret 坦承他愛著表妹 Roxane，卻認為自己的鼻子讓他不可能被愛。Roxane 的陪伴女傭請他隔天早上與 Roxane 見面。",
"在朋友 Ragueneau 的糕餅店，Cyrano 希望 Roxane 會向他表白。結果她坦承愛上英俊的新軍校生 Christian de Neuvillette，請 Cyrano 保護他。Christian 加入軍校生連，還敢拿 Cyrano 的鼻子開玩笑，但 Cyrano 為了 Roxane 忍了下來。Christian 承認自己不善言辭，Cyrano 便提議替他寫情書。",
"Roxane 被情書深深吸引。Christian 想自己跟她說話時卻失敗了。Cyrano 躲在陽台下的黑暗中替 Christian 說話，傾吐自己真正的感情，Roxane 愛得更深；Christian 爬上去得到一吻。想得到 Roxane 的已婚權貴 de Guiche 伯爵到來，Cyrano 編了一個從月亮掉下來的荒誕故事拖住他，同時神父為 Roxane 和 Christian 證婚。de Guiche 大怒，當晚就把軍校生連派上戰場。",
"圍城戰中，軍校生們餓得發慌。Cyrano 每天冒著生命危險穿越敵軍防線，以 Christian 的名義寄信給 Roxane。Roxane 坐著裝滿食物的馬車到來，告訴 Christian 就算他很醜她也會愛他，因為她愛的是他的靈魂。Christian 明白她真正愛的是 Cyrano 的文字，催促 Cyrano 說出真相。但他還來不及說，Christian 就戰死了，Cyrano 決定永遠保守這個秘密。",
"十五年後，Roxane 住在修道院裡，依然哀悼 Christian。貧窮又樹敵眾多的 Cyrano 每週都來探望她。有一天他暗自帶傷而來，他在一場伏擊中被一根木頭砸中頭部。他請求朗讀 Christian 的最後一封信，在漸暗的天色中背誦出來，而那時他根本不可能看得見字。Roxane 明白每封信都是他寫的。Cyrano 至死不屈，保有他的風範（panache）死去。"],
chars:["才華洋溢的詩人、劍客與軍人，有一個非常大的鼻子。","Cyrano 美麗聰慧的表妹，熱愛優美的文字。","英俊勇敢的軍校生，卻不善表達自己。","權勢顯赫的已婚貴族，追求 Roxane。","Cyrano 忠誠的朋友與顧問。","熱愛詩歌的糕餅師傅。","加斯科涅軍校生連的隊長。"],
themes:["Roxane 起初愛上 Christian 的臉，最後愛上的卻是 Cyrano 的靈魂，暗示真愛能看見外表以外的東西。","Cyrano 的語言是他最強的武器，也是他最深刻的愛的形式。","Cyrano 放棄自己的幸福來保護 Christian 和 Roxane。","Cyrano 拒絕奉承權貴、不違背自己的價值觀，即使為此付出代價。","Cyrano 害怕因為鼻子被拒絕，讓他從未為自己發聲。"],
syms:["他的不安全感與他和別人的不同；也是他反抗精神的來源。","Cyrano 真正的自我，藏在另一個人的名字之後。","外表與真實、聲音與臉孔之間的分界。","代表風格與勇氣的白色羽飾，Cyrano 至死保有。"],
devs:["觀眾早在 Roxane 之前就知道情書是 Cyrano 寫的。","Cyrano 的鼻子演說和決鬥詩，展現語言即表演。","劇本以押韻詩寫成，呼應 Cyrano 的詩人氣質。","Cyrano 比真實人生更宏大，集劍、筆與一顆大心於一身。","這部劇混合喜劇與心碎，以死亡與真相揭曉收場。"],
ct:[{q:"Cyrano 隱藏愛意是高尚還是愚蠢？",claim:"表明立場。",ev:"第一幕（他與 Le Bret 的對話）；第三幕（陽台）；第四幕（Christian 之死）；第五幕（朗讀信件）。",rs:"權衡他沉默的代價，以及他所保護的東西。",cc:"Cyrano 是否剝奪了 Roxane 選擇的權利？",m:"參考論點：Cyrano 的犧牲是高尚的，但他的沉默也出於恐懼，讓他和 Roxane 都失去了多年的幸福。"},
{q:"Roxane 真正愛的是誰？",claim:"詮釋 Roxane 的感情。",ev:"第二幕（她的告白）；第三幕（陽台）；第四幕（「就算你很醜我也會愛你」）；第五幕。",rs:"追蹤她的愛如何從外表轉向靈魂。",cc:"Roxane 是膚淺的，還是有所成長？",m:"參考論點：Roxane 從愛一張臉成長為愛一個靈魂，但直到太遲，她才知道自己愛的是誰的靈魂。"},
{q:"Christian 是受害者，還是這場欺騙中的自願夥伴？",claim:"評價 Christian。",ev:"第二幕（兩人的約定）；第三幕（他獨自失敗）；第四幕（他的覺悟）。",rs:"考慮他的誠實、他的限制，以及他最後的選擇。",cc:"Christian 應該更早告訴 Roxane 真相嗎？",m:"參考論點：Christian 並不愚蠢；他最後堅持要誠實，顯示他希望因為真實的自己而被愛。"},
{q:"Panache 是什麼意思？Cyrano 為什麼以它作結？",claim:"詮釋 Cyrano 最後的話。",ev:"第一幕（決鬥）；第四幕（圍城）；第五幕（他的死）。",rs:"說明風格與勇氣如何定義 Cyrano 的身分。",cc:"Panache 只是驕傲嗎？",m:"參考論點：Cyrano 的 panache 是他拒絕在精神上被擊敗，是他失去一切後唯一保有的東西。"},
{q:"Rostand 如何在悲劇故事中運用幽默？",claim:"分析喜劇與悲劇的交織。",ev:"鼻子演說；月亮故事；Ragueneau；最後一幕。",rs:"說明笑聲如何讓悲傷的結局更有力量。",cc:"幽默會讓結局不那麼悲傷嗎？",m:"參考論點：幽默讓我們愛上 Cyrano，因此他的死和秘密的犧牲更令人心痛。"},
{q:"跨文本：把 Cyrano 和一個關於替別人說話的現代故事做比較，例如電影《The Half of It》（2020）。",claim:"論證現代版本改變或保留了什麼。",ev:"劇本本身，加上一部現代改編作品。",rs:"比較誰在說話、為什麼隱藏，以及結局傳達了什麼。",cc:"原作的訊息在今天仍然成立嗎？",m:"參考論點：現代版本保留了 Cyrano 的核心問題：我們能單憑文字愛上一個人嗎？同時改變了誰能為自己發聲。"}]}};

title:"The Great Gatsby",author:"F. Scott Fitzgerald · 1925",blurb:"The American Dream, wealth, illusion",cite:"author and page, e.g., (Fitzgerald 180)",
bg:["F. Scott Fitzgerald’s novel, published in 1925 and set in the summer of 1922 on Long Island and in New York City. It is a defining portrait of the Jazz Age, a decade of prosperity, Prohibition and fast-changing values after World War I.",
"The narrator, Nick Carraway, rents a small house in West Egg beside the mansion of the mysterious millionaire Jay Gatsby. Across the bay in East Egg live Nick’s cousin Daisy and her wealthy husband, Tom Buchanan.",
"The novel entered the U.S. public domain in 2021, so you may quote it freely; cite page numbers from your edition. It sold poorly during Fitzgerald’s lifetime and became a classic only after his death in 1940."],
sum:[["Ch. 1–2 · East and West Egg","Nick, a Yale graduate from the Midwest, moves east to work in bonds. He visits Daisy and Tom; Tom is arrogant, openly racist and unfaithful, and Daisy’s friend Jordan Baker, a professional golfer, tells Nick that Tom has a mistress. That night Nick sees Gatsby alone on his lawn, reaching toward a green light across the water. Tom takes Nick through the Valley of Ashes, a gray industrial wasteland watched over by the faded billboard eyes of Doctor T. J. Eckleburg, to meet his mistress, Myrtle Wilson, the wife of a garage owner. At a drunken party in their New York apartment, Tom breaks Myrtle’s nose when she says Daisy’s name."],
["Ch. 3–4 · Gatsby’s parties","Nick attends one of Gatsby’s enormous parties, where guests spread wild rumors about their host. Gatsby introduces himself and seems both charming and unreal. Later he drives Nick to the city, tells a polished story about his past and introduces Meyer Wolfsheim, a gangster said to have fixed the 1919 World Series. Jordan reveals that Gatsby and Daisy were in love in Louisville in 1917, before the war separated them, and that Gatsby bought his mansion to be across the bay from her. He wants Nick to invite Daisy to tea."],
["Ch. 5–6 · The reunion","Gatsby and Daisy reunite at Nick’s house. After an awkward start, Gatsby shows her his mansion, and she cries over his beautiful shirts. Nick learns Gatsby’s true story: he was born James Gatz to poor North Dakota farmers, renamed himself at seventeen and learned the manners of wealth while working for the millionaire Dan Cody. When Tom and Daisy attend one of Gatsby’s parties, Daisy is unimpressed by the crowd. Gatsby tells Nick he wants to repeat the past; Nick says it cannot be done, and Gatsby insists that it can."],
["Ch. 7 · The Plaza Hotel","On a scorching day, Gatsby, Daisy, Tom, Nick and Jordan drive to the Plaza Hotel in New York. Tom confronts Gatsby, exposes his illegal business and mocks his background. Gatsby demands that Daisy say she never loved Tom, but she cannot. Driving home in Gatsby’s car with Daisy at the wheel, they hit and kill Myrtle, who has run into the road. Gatsby decides to take the blame and waits outside Daisy’s house all night, while Tom and Daisy sit together inside, making plans."],
["Ch. 8–9 · The end of the dream","Gatsby tells Nick about his early love for Daisy. Tom tells the grieving George Wilson that the car belonged to Gatsby. Wilson finds Gatsby in his swimming pool, shoots him and then kills himself. Almost no one comes to the funeral except Nick, a few servants, one former party guest and Gatsby’s father, who proudly shows Nick his son’s boyhood plan for self-improvement. Tom and Daisy leave town. Disgusted with the East, Nick returns to the Midwest and reflects on Gatsby’s hope, comparing all of us to boats moving against a current that carries us back into the past."]],
chars:[["Nick Carraway","The narrator; claims to be honest and slow to judge."],["Jay Gatsby","A self-made millionaire devoted to winning back Daisy."],["Daisy Buchanan","Nick’s cousin; charming, restless and careless."],["Tom Buchanan","Daisy’s husband; wealthy, arrogant and violent."],["Jordan Baker","A professional golfer; cool and dishonest."],["Myrtle Wilson","Tom’s mistress; desperate to rise in class."],["George Wilson","Myrtle’s husband; a poor garage owner."],["Meyer Wolfsheim","Gatsby’s gangster business partner."]],
themes:[["The American Dream","Gatsby rises from poverty to wealth, but money cannot buy the past, social acceptance or Daisy. The novel asks whether the dream is real or corrupted."],
["Old money vs. new money","East Egg’s inherited wealth looks down on West Egg’s new fortunes. Class barriers prove stronger than Gatsby’s money."],
["The past and time","Gatsby believes he can repeat the past; the novel shows that time cannot be reversed."],
["Illusion vs. reality","Gatsby’s identity, his parties and his idea of Daisy are illusions that collapse when they meet reality."],
["Carelessness and moral decay","The rich characters break things and people, then retreat into their money and leave others to clean up the damage."]],
syms:[["The green light","At the end of Daisy’s dock; Gatsby’s hope and longing for a dream just out of reach."],
["The Valley of Ashes","The gray wasteland between the Eggs and the city; the poverty and moral emptiness hidden behind wealth."],
["The eyes of Doctor T. J. Eckleburg","A faded billboard that seems to watch everything; George Wilson takes it for the eyes of God."],
["Gatsby’s mansion and parties","Spectacular displays meant to attract Daisy; they show how hollow his public life is."]],
devs:[["First-person observer narrator","Nick tells Gatsby’s story from outside, so readers must decide how much to trust his judgments."],
["Symbolism","Colors, places and objects carry the novel’s ideas about desire and decay."],
["Imagery and color","Gold, white, green and gray describe wealth, false purity, hope and emptiness."],
["Foreshadowing","Car accidents and Gatsby’s reckless driving appear before the fatal crash."],
["Irony","Gatsby’s crowded parties contrast with his almost empty funeral."]],
ct:[{q:"Is Gatsby ‘great’?",claim:"Decide whether the title is sincere, ironic or both.",ev:"Ch. 3 (the parties), Ch. 6 (his true past), Ch. 8 (Nick tells Gatsby he is worth more than all of them), Ch. 9 (the funeral and the last pages).",rs:"Weigh Gatsby’s hope and devotion against his lies and crimes.",cc:"Is it possible to admire a dream while condemning the dreamer’s methods?",m:"Model claim: Gatsby is ‘great’ only in the size of his hope; the title is both sincere and ironic, honoring his devotion while exposing the emptiness of what he pursued."},
{q:"Is Nick a reliable narrator?",claim:"Take a position on how far we can trust Nick.",ev:"Ch. 1 (he says he reserves judgment), Ch. 3 (he calls himself one of the few honest people he knows), Ch. 7 (his thirtieth birthday), Ch. 9 (his final judgments).",rs:"Look for moments when Nick judges, hides information or admires Gatsby too much.",cc:"If Nick is unreliable, does the novel lose its moral message?",m:"Model claim: Nick is honest about events but not neutral; his growing admiration for Gatsby shapes the story we read."},
{q:"Does the novel criticize the American Dream or celebrate it?",claim:"Argue what Fitzgerald suggests about the dream.",ev:"Ch. 6 (James Gatz becomes Jay Gatsby), Ch. 7 (Tom exposes Gatsby), Ch. 9 (the boyhood schedule and the final passage).",rs:"Separate the dream itself from what the 1920s made of it.",cc:"Gatsby does become rich. Is that evidence that the dream works?",m:"Model claim: Fitzgerald admires the hope at the heart of the dream but shows that, in a society ruled by class and money, it becomes corrupted and impossible."},
{q:"Who is responsible for the deaths of Myrtle, Gatsby and George Wilson?",claim:"Assign responsibility and defend your choice.",ev:"Ch. 7 (the accident and Gatsby waiting outside), Ch. 9 (Tom’s role and Nick’s judgment of Tom and Daisy as careless people).",rs:"Consider who acted, who lied and who escaped consequences.",cc:"Is Gatsby partly responsible for his own death?",m:"Model claim: Tom and Daisy are most responsible: Daisy kills Myrtle, Tom sends Wilson to Gatsby, and both retreat into their money while others pay the price."},
{q:"Is Daisy a victim or a villain?",claim:"Take a position on Daisy’s character.",ev:"Ch. 1 (her hope that her daughter will be a ‘beautiful little fool’), Ch. 5 (the reunion), Ch. 7 (the Plaza and the accident).",rs:"Consider the limited choices open to wealthy women in the 1920s.",cc:"Do her limited choices excuse her carelessness?",m:"Model claim: Daisy is shaped by a world that values women for beauty and money, but she chooses comfort over truth, which makes her both a victim and responsible."},
{q:"Cross-text: Compare Gatsby’s dream with George and Lennie’s dream in Of Mice and Men.",claim:"Argue what both novels suggest about the American Dream.",ev:"Gatsby Ch. 6 and Ch. 9; Of Mice and Men Ch. 1, Ch. 3 and Ch. 6.",rs:"Compare what each dreamer wants, what stands in the way and how each dream ends.",cc:"One dreamer is rich and one is poor. Why do both dreams fail?",m:"Model claim: Both novels show the American Dream ending in death, suggesting that class and power, not effort alone, decide who gets to reach it."}],
kz:{"The American Dream":"美國夢","Old money vs. new money":"舊富與新富","The past and time":"過去與時間","Illusion vs. reality":"幻象與現實","Carelessness and moral decay":"漫不經心與道德淪喪","The green light":"綠光","The Valley of Ashes":"灰燼谷","The eyes of Doctor T. J. Eckleburg":"Eckleburg 醫生的眼睛","Gatsby’s mansion and parties":"Gatsby 的豪宅與派對","First-person observer narrator":"第一人稱旁觀敘事者","Symbolism":"象徵手法","Imagery and color":"意象與色彩"},
zh:{bg:["F. Scott Fitzgerald 的小說，1925 年出版，背景是 1922 年夏天的長島與紐約市。它是「爵士時代」的經典寫照：一戰後那十年充滿繁榮、禁酒令和急速變化的價值觀。",
"敘事者 Nick Carraway 在 West Egg 租了一間小房子，隔壁就是神秘的百萬富翁 Jay Gatsby 的豪宅。海灣對岸的 East Egg 住著 Nick 的表妹 Daisy 和她富有的丈夫 Tom Buchanan。",
"這部小說於 2021 年在美國進入公共領域，因此可以自由引用；請標示你所用版本的頁碼。它在 Fitzgerald 生前銷量不佳，直到他 1940 年去世後才成為經典。"],
sum:["來自中西部、耶魯畢業的 Nick 搬到東部從事債券業。他拜訪 Daisy 和 Tom；Tom 傲慢、公然抱持種族主義而且不忠，Daisy 的朋友、職業高爾夫球手 Jordan Baker 告訴 Nick，Tom 有情婦。當晚，Nick 看見 Gatsby 獨自站在草坪上，向海灣對面的一盞綠光伸出手。Tom 帶 Nick 穿過灰燼谷，那是一片灰色的工業荒地，Eckleburg 醫生廣告看板上褪色的眼睛俯視著一切；他們去見 Tom 的情婦 Myrtle Wilson，她是一名修車廠老闆的妻子。在紐約公寓一場酒醉的派對上，Myrtle 說出 Daisy 的名字，Tom 打斷了她的鼻子。",
"Nick 參加了 Gatsby 的一場盛大派對，賓客們流傳著關於主人的各種荒誕謠言。Gatsby 向 Nick 自我介紹，既迷人又不真實。後來他開車載 Nick 進城，講了一套精心修飾的身世，並介紹黑幫分子 Meyer Wolfsheim，據說他操縱了 1919 年的世界大賽。Jordan 透露，Gatsby 和 Daisy 1917 年在 Louisville 相戀，後來被戰爭拆散，而 Gatsby 買下豪宅，就是為了住在她的海灣對岸。他希望 Nick 邀 Daisy 來喝茶。",
"Gatsby 和 Daisy 在 Nick 家重逢。起初很尷尬，之後 Gatsby 帶她參觀豪宅，她看著他那些漂亮的襯衫哭了起來。Nick 得知 Gatsby 的真實身世：他原名 James Gatz，出生於北達科他州的貧窮農家，十七歲時替自己改名，並在為百萬富翁 Dan Cody 工作時學會了有錢人的舉止。Tom 和 Daisy 參加 Gatsby 的派對時，Daisy 對那群賓客不以為然。Gatsby 告訴 Nick 他想重現過去；Nick 說那是不可能的，Gatsby 卻堅持可以。",
"在一個酷熱的日子，Gatsby、Daisy、Tom、Nick 和 Jordan 開車到紐約的 Plaza 飯店。Tom 當面質問 Gatsby，揭穿他的非法生意並嘲笑他的出身。Gatsby 要 Daisy 說她從沒愛過 Tom，但她說不出口。回程時，Daisy 開著 Gatsby 的車，撞死了衝到路上的 Myrtle。Gatsby 決定替她頂罪，整夜守在 Daisy 家外面，而 Tom 和 Daisy 則一起坐在屋裡商量計畫。",
"Gatsby 向 Nick 訴說他早年對 Daisy 的愛。Tom 告訴悲痛的 George Wilson，那輛車是 Gatsby 的。Wilson 在泳池找到 Gatsby，開槍打死他，然後自殺。葬禮幾乎沒有人來，只有 Nick、幾名僕人、一位曾參加派對的賓客，以及 Gatsby 的父親；父親驕傲地給 Nick 看兒子少年時的自我進修計畫。Tom 和 Daisy 離開了。對東部感到厭惡的 Nick 回到中西部，思索 Gatsby 的希望，把我們每個人比作逆流而上的小船，不斷被水流推回過去。"],
chars:["敘事者；自稱誠實、不輕易評斷別人。","白手起家的百萬富翁，一心想贏回 Daisy。","Nick 的表妹；迷人、不安定又漫不經心。","Daisy 的丈夫；富有、傲慢又暴力。","職業高爾夫球手；冷淡而不誠實。","Tom 的情婦；渴望躋身上流階級。","Myrtle 的丈夫；貧窮的修車廠老闆。","Gatsby 的黑幫生意夥伴。"],
themes:["Gatsby 從貧窮爬到富有，但金錢買不回過去、買不到社會認同，也買不到 Daisy。小說提出的問題是：美國夢是真實的，還是已經腐化？","East Egg 的世襲財富看不起 West Egg 的新財富。階級的藩籬比 Gatsby 的金錢更堅固。","Gatsby 相信他能重現過去；小說顯示時間無法倒流。","Gatsby 的身分、他的派對，以及他心中的 Daisy，都是一碰到現實就崩塌的幻象。","有錢的角色們打碎了東西、傷害了人，然後躲回他們的金錢裡，留下別人收拾殘局。"],
syms:["位在 Daisy 家碼頭的盡頭；象徵 Gatsby 對一個近在眼前卻碰不到的夢的希望與渴望。","介於兩個 Egg 和城市之間的灰色荒地；象徵隱藏在財富背後的貧窮與道德空虛。","一塊彷彿注視著一切的褪色廣告看板；George Wilson 把它當成上帝的眼睛。","為了吸引 Daisy 而舉辦的盛大場面；顯示他的公眾生活有多麼空洞。"],
devs:["Nick 從局外人的角度講述 Gatsby 的故事，因此讀者必須自己判斷他的評價有多可信。","顏色、地點和物件承載著小說對慾望與腐敗的思考。","金色、白色、綠色和灰色分別描繪財富、虛假的純潔、希望與空虛。","在致命車禍之前，小說就已出現多次車禍與 Gatsby 的魯莽駕駛。","Gatsby 擠滿賓客的派對，與他幾乎空無一人的葬禮形成強烈對比。"],
ct:[{q:"Gatsby「了不起」嗎？",claim:"判斷書名是真誠的、反諷的，還是兩者皆是。",ev:"第 3 章（派對）、第 6 章（他的真實身世）、第 8 章（Nick 告訴 Gatsby 他比那些人加起來都更有價值）、第 9 章（葬禮與最後幾頁）。",rs:"權衡 Gatsby 的希望與執著，以及他的謊言與犯罪。",cc:"有沒有可能一方面欣賞一個夢想，一方面譴責追夢者的手段？",m:"參考論點：Gatsby 的「了不起」只在於他希望的強度；書名既真誠又反諷，一方面肯定他的執著，一方面揭露他所追求之物的空洞。"},
{q:"Nick 是可靠的敘事者嗎？",claim:"對我們能信任 Nick 到什麼程度表明立場。",ev:"第 1 章（他說自己不輕易評斷別人）、第 3 章（他自稱是少數誠實的人之一）、第 7 章（他的三十歲生日）、第 9 章（他最後的評斷）。",rs:"找出 Nick 評斷他人、隱瞞資訊，或過度欣賞 Gatsby 的時刻。",cc:"如果 Nick 不可靠，小說的道德訊息會因此失去意義嗎？",m:"參考論點：Nick 對事件的描述是誠實的，但他並不中立；他對 Gatsby 越來越深的欣賞，塑造了我們讀到的故事。"},
{q:"這部小說是在批判美國夢，還是在讚揚它？",claim:"論證 Fitzgerald 對美國夢的看法。",ev:"第 6 章（James Gatz 變成 Jay Gatsby）、第 7 章（Tom 揭穿 Gatsby）、第 9 章（少年時的計畫表與最後一段）。",rs:"把夢想本身，和 1920 年代把它變成的樣子區分開來。",cc:"Gatsby 確實變得富有了。這是否證明美國夢可行？",m:"參考論點：Fitzgerald 欣賞美國夢核心的那份希望，但他也呈現出，在一個由階級與金錢主宰的社會裡，這個夢會腐化、變得不可能實現。"},
{q:"誰該為 Myrtle、Gatsby 和 George Wilson 的死負責？",claim:"分配責任並為你的選擇辯護。",ev:"第 7 章（車禍與 Gatsby 在屋外守候）、第 9 章（Tom 的角色，以及 Nick 評斷 Tom 和 Daisy 是漫不經心的人）。",rs:"想一想誰採取了行動、誰說了謊、誰逃過了後果。",cc:"Gatsby 是否也要為自己的死負部分責任？",m:"參考論點：Tom 和 Daisy 的責任最大：Daisy 撞死了 Myrtle，Tom 把 Wilson 引向 Gatsby，而兩人都躲回自己的金錢裡，讓別人付出代價。"},
{q:"Daisy 是受害者，還是加害者？",claim:"對 Daisy 這個角色表明立場。",ev:"第 1 章（她希望女兒成為一個「美麗的小傻瓜」）、第 5 章（重逢）、第 7 章（Plaza 飯店與車禍）。",rs:"考慮 1920 年代富裕女性能有的有限選擇。",cc:"她有限的選擇能為她的漫不經心開脫嗎？",m:"參考論點：Daisy 是被一個以美貌和金錢衡量女性的世界塑造出來的，但她選擇了安逸而非真相，因此她既是受害者，也要負責任。"},
{q:"跨文本：比較 Gatsby 的夢想與《Of Mice and Men》中 George 和 Lennie 的夢想。",claim:"論證兩部小說對美國夢有何看法。",ev:"《The Great Gatsby》第 6 章與第 9 章；《Of Mice and Men》第 1、3、6 章。",rs:"比較每個追夢者想要什麼、遇到什麼阻礙，以及夢想如何結束。",cc:"一個追夢者富有，一個貧窮。為什麼兩人的夢都失敗了？",m:"參考論點：兩部小說中的美國夢都以死亡告終，暗示決定誰能實現夢想的，是階級與權力，而不只是努力。"}]}};

const CRUCIBLE={
title:"The Crucible",author:"Arthur Miller · 1953",blurb:"Mass hysteria, integrity, McCarthyism",cite:"author and page, e.g., (Miller 75)",
bg:["A play by Arthur Miller, first performed in 1953 and set in Salem, Massachusetts, in 1692, during the real Salem witch trials, in which about two hundred people were accused and twenty were executed.",
"Miller wrote the play as an allegory of McCarthyism, the early-1950s campaign led by Senator Joseph McCarthy to expose suspected Communists, in which people were pressured to name others. Miller himself was called before the House Un-American Activities Committee in 1956, refused to name names and was convicted of contempt of Congress; the conviction was overturned in 1958.",
"Miller changed history for drama: for example, the real Abigail Williams was about eleven or twelve, and John Proctor was about sixty. The play is under copyright, so quote only short passages and cite act and page."],
sum:[["Act 1","In the home of Reverend Samuel Parris, his daughter Betty lies in a strange stupor after Parris caught several girls dancing in the woods with Tituba, an enslaved woman from Barbados who works in his house. His niece, Abigail Williams, the girls’ leader, privately admits to John Proctor that nothing supernatural happened. She wants to resume their past affair, which began when she worked in his house, but he refuses. Reverend John Hale, an expert on witchcraft, arrives. Under pressure, Tituba confesses to dealing with the devil and names other women. Abigail and Betty join in, crying out more names."],
["Act 2","Eight days later, John and Elizabeth Proctor’s marriage is still strained by his affair. Their servant Mary Warren, now an official of the court, reports that dozens have been arrested and gives Elizabeth a poppet (a small doll) she made in court. Hale questions the Proctors about their faith. Officials arrive with a warrant: Abigail has accused Elizabeth, and a needle is found in the poppet, matching Abigail’s claim that Elizabeth’s spirit stabbed her. Elizabeth is arrested, and Proctor demands that Mary testify that the girls are lying."],
["Act 3","In court, Proctor presents Mary Warren’s statement that the girls are pretending. Deputy Governor Danforth and Judge Hathorne treat any challenge as an attack on the court itself. Giles Corey is arrested for refusing to name the source of his evidence. When Abigail and the girls pretend to see Mary’s spirit as a bird, Mary breaks down and accuses Proctor of serving the devil. Proctor confesses his affair to expose Abigail’s motive. Elizabeth, who has never lied, is called in and lies to protect his good name, unknowingly ruining his case. Proctor is arrested, and Hale quits the court in protest."],
["Act 4","Months later, in the fall, the hangings continue and the town is falling apart. Abigail has fled Salem with money stolen from Parris. Hale, now full of guilt, begs prisoners to confess falsely to save their lives. Elizabeth tells John that Giles Corey died after being pressed under heavy stones, refusing to answer the court. Proctor agrees to confess, but when Danforth insists that the signed confession be posted publicly, Proctor tears it up to protect his name and the dignity of those who refused to lie. He goes to the gallows with Rebecca Nurse."]],
chars:[["John Proctor","A farmer with a guilty secret who comes to value his integrity above his life."],["Elizabeth Proctor","His wife; honest, reserved, wounded by his affair."],["Abigail Williams","Parris’s niece; leads the accusations."],["Reverend Parris","Salem’s minister; worried about his reputation and position."],["Reverend Hale","A witchcraft expert who begins confident and ends in guilt."],["Deputy Governor Danforth","The chief judge; refuses to admit the court could be wrong."],["Tituba","An enslaved woman from Barbados; the first to be blamed."],["Mary Warren","The Proctors’ servant; timid and easily pressured."],["Giles Corey","An outspoken old farmer who refuses to cooperate with the court."],["Rebecca Nurse","A respected, deeply good elderly woman."],["Thomas and Ann Putnam","A wealthy couple who use the trials for revenge and land."]],
themes:[["Mass hysteria","Fear spreads faster than reason, and the community turns on its own members."],
["Integrity and reputation","Characters choose between protecting their good name through lies and keeping their integrity through truth."],
["Authority and power","The court refuses to admit error, because doing so would weaken its authority."],
["Self-interest","Some accusers use the trials to settle old grudges or gain land, showing how private motives drive public panic."],
["Guilt and redemption","Proctor and Hale both struggle with guilt; Proctor finds a kind of redemption by refusing to lie."]],
syms:[["The poppet","An innocent object turned into ‘evidence’; it shows how easily truth can be twisted."],
["The forest","The wild, uncontrolled space outside Puritan order, where the girls dance."],
["The crucible","A vessel heated to purify metal; a severe test that reveals a person’s true character."],
["Proctor’s name","His signature stands for his identity and honor."]],
devs:[["Allegory","The Salem trials stand for the anti-Communist hearings of the 1950s."],
["Dramatic irony","The audience knows the girls are lying while the judges believe them."],
["Narrative commentary","In Act 1, Miller interrupts the stage directions with historical essays on the characters."],
["Irony","Elizabeth, who never lies, tells one lie out of love, and it condemns her husband."],
["Period language","Miller imitates seventeenth-century speech to make Salem feel authentic."]],
ct:[{q:"Is John Proctor a hero?",claim:"Take a position on Proctor’s heroism.",ev:"Act 1 (with Abigail), Act 2 (with Elizabeth), Act 3 (his confession of the affair), Act 4 (tearing up the confession).",rs:"Weigh his early weakness and pride against his final choice.",cc:"Could his death be seen as stubbornness that leaves his children without a father?",m:"Model claim: Proctor becomes a hero only at the end, when he chooses truth and his integrity over his life, turning his private guilt into public courage."},
{q:"Who is most to blame for the hysteria in Salem?",claim:"Choose Abigail, the court, the Putnams or the community, and defend your choice.",ev:"Act 1 (Abigail and the Putnams), Act 3 (Danforth’s reasoning), Act 4 (Hale’s guilt).",rs:"Separate who started the accusations from who allowed them to grow.",cc:"Could the panic have happened without any one of these groups?",m:"Model claim: Abigail lights the fire, but the court is most to blame because it had the power to stop the lies and chose to protect its authority instead."},
{q:"Why do people confess to crimes they did not commit?",claim:"Explain why false confessions spread in the play.",ev:"Act 1 (Tituba’s confession), Act 3 (Mary Warren), Act 4 (Hale’s pleas and Proctor’s near-confession).",rs:"Consider fear, pressure and the rewards of confessing.",cc:"Were those who confessed cowards, or survivors?",m:"Model claim: The court’s system rewards confession and punishes truth, so lying becomes the only way to live — which is exactly what makes the system unjust."},
{q:"How does the play work as an allegory of McCarthyism?",claim:"Identify two or three parallels and argue what they show.",ev:"The play plus a reliable history source on the House Un-American Activities Committee, for example from the U.S. Senate or a university website.",rs:"Compare naming names, guilt by accusation and the fear of being accused.",cc:"Is the comparison fair, given that there were real Soviet spies in the 1950s and no real witches in 1692?",m:"Model claim: Miller shows that when accusation becomes proof, any society can turn fear into injustice, whether it fears witches or Communists."},
{q:"Does Reverend Hale change for the better?",claim:"Evaluate Hale’s transformation.",ev:"Act 1 (his confident arrival), Act 2 (his doubts), Act 3 (he quits the court), Act 4 (he urges false confessions).",rs:"Decide whether urging people to lie in order to live is a moral step forward or backward.",cc:"Is it too late for Hale to repair the damage he helped cause?",m:"Model claim: Hale grows from blind certainty to humility, but his final advice to lie shows that guilt alone cannot undo injustice."},

zh:{bg:["Arthur Miller 的劇本，1953 年首演，背景是 1692 年麻州 Salem 真實發生的女巫審判，當時約有兩百人被指控，二十人被處死。",
"Miller 把這部劇寫成麥卡錫主義的寓言。麥卡錫主義是 1950 年代初由參議員 Joseph McCarthy 主導、揪出疑似共產黨員的運動，人們被迫供出他人的名字。Miller 本人於 1956 年被傳喚到眾議院非美活動調查委員會，他拒絕供出任何人，被判藐視國會罪；1958 年判決被推翻。",
"Miller 為了戲劇效果更動了歷史：例如真實的 Abigail Williams 大約十一、二歲，而 John Proctor 大約六十歲。本劇仍受版權保護，因此只能引用短句，並標示幕次和頁碼。"],
sum:["在 Samuel Parris 牧師家中，他的女兒 Betty 陷入奇怪的昏迷；在此之前，Parris 撞見幾個女孩和他家中來自巴貝多的奴隸 Tituba 在森林裡跳舞。他的姪女、帶頭的 Abigail Williams 私下向 John Proctor 承認，其實沒有發生任何超自然的事。她想重拾兩人過去的私情（始於她在 Proctor 家幫傭時），但他拒絕了。巫術專家 John Hale 牧師抵達。在壓力下，Tituba 承認與魔鬼往來，並供出其他婦女。Abigail 和 Betty 也加入，喊出更多名字。",
"八天後，John 和 Elizabeth Proctor 的婚姻仍因他的外遇而緊繃。他們的僕人 Mary Warren 如今是法庭的官員，她說已有數十人被捕，並把她在法庭上做的一個布偶（小娃娃）送給 Elizabeth。Hale 盤問 Proctor 夫婦的信仰。官員帶著逮捕令前來：Abigail 指控了 Elizabeth，而布偶裡找到一根針，正好符合 Abigail 聲稱 Elizabeth 的靈魂刺了她的說法。Elizabeth 被捕，Proctor 要求 Mary 出庭作證，證明女孩們在說謊。",
"在法庭上，Proctor 提出 Mary Warren 的證詞，說女孩們是在假裝。副總督 Danforth 和法官 Hathorne 把任何質疑都視為對法庭本身的攻擊。Giles Corey 因拒絕說出證據來源而被捕。當 Abigail 和女孩們假裝看見 Mary 的靈魂化成一隻鳥時，Mary 崩潰了，反過來指控 Proctor 替魔鬼效力。Proctor 坦承自己的外遇，以揭穿 Abigail 的動機。從不說謊的 Elizabeth 被傳喚進來，卻為了保護丈夫的名聲而說謊，在不知情的情況下毀了他的證詞。Proctor 被捕，Hale 憤而退出法庭。",
"幾個月後的秋天，絞刑仍在繼續，小鎮正在崩解。Abigail 偷了 Parris 的錢逃離 Salem。滿懷罪惡感的 Hale 懇求囚犯們做假認罪來保住性命。Elizabeth 告訴 John，Giles Corey 被重石壓死，至死都拒絕回答法庭。Proctor 同意認罪，但當 Danforth 堅持要把簽了名的認罪書公開張貼時，Proctor 把它撕了，以保護自己的名字，以及那些拒絕說謊的人的尊嚴。他和 Rebecca Nurse 一起走上絞刑台。"],
chars:["懷著罪惡秘密的農夫，最後把正直看得比生命更重要。","他的妻子；誠實、矜持，因他的外遇而受傷。","Parris 的姪女；帶頭指控他人。","Salem 的牧師；擔心自己的名聲與地位。","巫術專家，起初自信滿滿，最後滿懷罪惡感。","首席法官；拒絕承認法庭可能出錯。","來自巴貝多的奴隸；第一個被歸咎的人。","Proctor 家的僕人；膽小又容易屈服於壓力。","直言不諱的老農夫，拒絕配合法庭。","一位受人尊敬、心地善良的老婦人。","一對富有的夫婦，利用審判報復他人並取得土地。"],
themes:["恐懼擴散得比理性還快，整個社群轉而攻擊自己的成員。","角色們必須選擇：用謊言保護自己的名聲，還是用真話保住自己的正直。","法庭拒絕承認錯誤，因為承認錯誤會削弱它的權威。","有些指控者利用審判了結舊怨或奪取土地，顯示私人動機如何推動公眾恐慌。","Proctor 和 Hale 都在罪惡感中掙扎；Proctor 藉由拒絕說謊，找到了某種救贖。"],
syms:["一個無辜的物件被當成「證據」；顯示真相多麼容易被扭曲。","清教徒秩序之外野性、不受控制的空間，也是女孩們跳舞的地方。","用高溫提煉金屬的容器；象徵揭露一個人真實品格的嚴峻考驗。","他的簽名代表他的身分與榮譽。"],
devs:["Salem 審判代表 1950 年代的反共聽證會。","觀眾知道女孩們在說謊，法官們卻相信她們。","在第一幕，Miller 在舞台指示中穿插關於角色的歷史評述。","從不說謊的 Elizabeth 出於愛說了一次謊，卻因此定了丈夫的罪。","Miller 模仿十七世紀的說話方式，讓 Salem 顯得真實可信。"],
ct:[{q:"John Proctor 是英雄嗎？",claim:"對 Proctor 是否是英雄表明立場。",ev:"第一幕（與 Abigail）、第二幕（與 Elizabeth）、第三幕（坦承外遇）、第四幕（撕毀認罪書）。",rs:"權衡他早期的軟弱與驕傲，以及他最後的選擇。",cc:"他的死是否也可以被看成一種固執，讓孩子們失去了父親？",m:"參考論點：Proctor 直到最後才成為英雄：他選擇了真相與正直而非生命，把私人的罪惡感轉化為公開的勇氣。"},
{q:"誰該為 Salem 的歇斯底里負最大責任？",claim:"在 Abigail、法庭、Putnam 夫婦或整個社群中選一個，並為你的選擇辯護。",ev:"第一幕（Abigail 與 Putnam 夫婦）、第三幕（Danforth 的推理）、第四幕（Hale 的罪惡感）。",rs:"區分是誰開始指控，以及是誰讓指控擴大。",cc:"如果少了其中任何一方，這場恐慌還會發生嗎？",m:"參考論點：Abigail 點燃了火，但法庭責任最大，因為它有權力阻止謊言，卻選擇保護自己的權威。"},
{q:"為什麼人們會承認自己沒犯過的罪？",claim:"說明劇中假認罪為何會擴散。",ev:"第一幕（Tituba 的認罪）、第三幕（Mary Warren）、第四幕（Hale 的懇求與 Proctor 差點認罪）。",rs:"想一想恐懼、壓力，以及認罪帶來的好處。",cc:"那些認罪的人是懦夫，還是倖存者？",m:"參考論點：法庭的制度獎勵認罪、懲罰真相，讓說謊成為唯一的活路，而這正是這個制度不公義的原因。"},
{q:"這部劇如何作為麥卡錫主義的寓言？",claim:"找出兩三個相似之處，並論證它們揭示了什麼。",ev:"劇本本身，加上一份關於眾議院非美活動調查委員會的可靠史料，例如美國參議院或大學的網站。",rs:"比較供出名字、被指控即有罪，以及對被指控的恐懼。",cc:"1950 年代確實有蘇聯間諜，而 1692 年並沒有真正的女巫。這樣比較公平嗎？",m:"參考論點：Miller 顯示，當指控本身就成為證據時，任何社會都可能把恐懼變成不公義，無論它害怕的是女巫還是共產黨員。"},
{q:"Hale 牧師的改變是變得更好了嗎？",claim:"評估 Hale 的轉變。",ev:"第一幕（他自信地抵達）、第二幕（他的懷疑）、第三幕（他退出法庭）、第四幕（他勸人假認罪）。",rs:"判斷勸人說謊以求活命，在道德上是進步還是退步。",cc:"Hale 是否已經來不及彌補他協助造成的傷害？",m:"參考論點：Hale 從盲目的確信成長為謙卑，但他最後勸人說謊，顯示光有罪惡感並不能撤銷不公義。"},
{q:"跨文本：比較《The Crucible》中的法庭與《To Kill a Mockingbird》中 Tom Robinson 的審判。",claim:"論證兩場審判對正義與恐懼揭示了什麼。",ev:"《The Crucible》第三幕；《To Kill a Mockingbird》第 17–21 章。",rs:"比較證據的作用、指控的力量，以及社群的壓力。",cc:"一場審判是關於巫術，另一場是關於種族。這會限制比較嗎？",m:"參考論點：兩場審判都顯示，當社群早已認定誰有罪時，證據就失去了力量，法庭也淪為恐懼的工具。"}]}};

title:"Adventures of Huckleberry Finn",author:"Mark Twain · 1884",blurb:"Freedom, conscience, satire of slavery",cite:"author and page, e.g., (Twain 210)",
bg:["Mark Twain’s novel, published in 1884 in Britain and 1885 in the United States, as a sequel to The Adventures of Tom Sawyer. It is set along the Mississippi River in the 1830s or 1840s, before the Civil War, when slavery was legal in the South.",
"Huck, a poor, uneducated boy of about thirteen, tells the story in his own regional dialect. Twain used several dialects on purpose, and the book helped make everyday American speech acceptable in serious literature.",
"The novel is in the public domain. Content note: it uses a racial slur more than two hundred times and portrays the racist attitudes of its era. It is one of the most frequently challenged books in American schools. Read it as a satire of a racist society, and discuss its language with care."],
sum:[["Ch. 1–7 · Escape from Pap","Huck lives with the Widow Douglas and her sister, Miss Watson, who try to ‘sivilize’ him with school, manners and religion. His violent, alcoholic father, Pap, returns, demands Huck’s money and kidnaps him to a cabin in the woods. To escape, Huck fakes his own murder and paddles to Jackson’s Island."],
["Ch. 8–16 · Huck and Jim on the river","On the island Huck finds Jim, a man enslaved by Miss Watson, who ran away after hearing that she planned to sell him down the river to New Orleans. During a flood they find a dead man in a floating house; Jim covers the face and keeps Huck from seeing it. They travel down the Mississippi by raft, hoping to reach Cairo, Illinois, and then go up the Ohio River into free states. After they are separated in a fog, Huck tricks Jim into thinking he dreamed it; when Jim explains how much he was hurt, Huck humbles himself and apologizes. They drift past Cairo in the fog, and a steamboat smashes the raft."],
["Ch. 17–18 · The feud","Huck stays with the Grangerfords, a refined family locked in a deadly feud with the Shepherdsons. When the feud explodes into killings, Huck flees and rejoins Jim, who has repaired the raft."],
["Ch. 19–31 · The Duke and the King","Two con men who call themselves the Duke and the King take over the raft. They cheat towns with fake shows such as the ‘Royal Nonesuch’ and pretend to be the brothers of a dead man, Peter Wilks, to steal his family’s inheritance; Huck secretly helps the Wilks sisters. Finally the King sells Jim to a farmer, Silas Phelps, for forty dollars. Huck writes a letter to Miss Watson telling her where Jim is, then tears it up, deciding: ‘All right, then, I’ll go to hell.’"],
["Ch. 32–43 · The Phelps farm","At the Phelps farm, Huck is mistaken for Tom Sawyer, Aunt Sally’s nephew. Tom himself arrives, pretends to be his brother Sid and invents an absurdly complicated ‘escape’ based on adventure books, though Jim could simply walk out. During the escape Tom is shot in the leg, and Jim gives up his chance of freedom to stay with him and the doctor. Back in captivity, Jim is freed when Tom reveals that Miss Watson died two months earlier and freed Jim in her will. Jim tells Huck that the dead man in the floating house was Pap. Huck plans to ‘light out for the Territory’ before anyone can civilize him again."]],
chars:[["Huckleberry Finn","The narrator; a poor, practical boy who distrusts ‘civilized’ society."],["Jim","A man escaping slavery; kind, wise and fatherly toward Huck."],["Pap Finn","Huck’s violent, racist, alcoholic father."],["Widow Douglas and Miss Watson","Sisters who try to raise Huck; Miss Watson enslaves Jim."],["Tom Sawyer","Huck’s friend; loves adventure books and games."],["The Duke and the King","Two con men who exploit everyone they meet."],["The Grangerfords","A wealthy family destroyed by a meaningless feud."],["Silas and Sally Phelps","Tom’s kindly aunt and uncle, who nonetheless hold Jim captive."]],
themes:[["Racism and slavery","The novel exposes how a society that called itself Christian and civilized treated enslaved people as property."],
["Freedom","Huck seeks freedom from rules and from Pap; Jim seeks freedom from slavery. Only one of their journeys carries life-or-death stakes."],
["Conscience vs. society","Huck’s ‘conscience,’ trained by a racist society, tells him helping Jim is a sin; his heart tells him otherwise."],
["Civilization vs. nature","Life on the raft is peaceful and honest compared with the cruelty, greed and violence of the towns on shore."],
["Hypocrisy","Churchgoing families feud, kill and enslave while claiming moral goodness."]],
syms:[["The Mississippi River","Freedom and a moving road, but also danger; it carries Jim deeper into slave territory."],
["The raft","A small, equal world where Huck and Jim can live as friends."],
["The shore","The towns stand for society’s cruelty, fraud and violence."],
["The fog","Moral confusion; it separates Huck and Jim and makes them miss Cairo."]],
devs:[["Satire","Twain mocks feuding aristocrats, con men, religious hypocrisy and romantic adventure stories."],
["Vernacular dialect","Huck’s everyday speech gives the novel humor, honesty and a distinctly American voice."],
["Picaresque structure","The story moves through a series of loosely connected episodes on a journey."],
["Irony","Huck believes he is sinning when he does the most moral thing in the book."],
["Naive narrator","Huck reports events without fully understanding them, so readers see more than he does."]],
ct:[{q:"Should Adventures of Huckleberry Finn be taught in high school?",claim:"Take a clear position and give two reasons.",ev:"The novel (Ch. 15, 16 and 31), plus one recent article about debates over teaching the book.",rs:"Consider the effect of its language on students and what students gain from reading it.",cc:"Can teachers address the harm of the language while still teaching the book?",m:"Model claim: The novel should be taught only with careful historical context and open discussion, because its satire of racism is powerful but its language can wound."},
{q:"Is the novel racist, or a satire of racism?",claim:"Argue how readers should interpret Twain’s portrayal of race.",ev:"Ch. 6 (Pap’s rant about a free Black professor), Ch. 16 (Huck’s apology), Ch. 23 (Jim and his daughter), Ch. 31 (Huck’s decision).",rs:"Distinguish what characters believe from what the novel as a whole suggests.",cc:"Jim is sometimes shown as superstitious or used for comedy. Does that weaken the satire?",m:"Model claim: The novel satirizes racism by making the most racist characters the most foolish, but it still sometimes relies on stereotypes, so it is both a critique of racism and a product of it."},
{q:"Does the ending weaken the novel?",claim:"Evaluate the Phelps farm section.",ev:"Ch. 31 (Huck’s choice), Ch. 34–40 (Tom’s ‘escape’), Ch. 42 (Jim’s freedom revealed), plus Ernest Hemingway’s well-known criticism of the ending.",rs:"Ask whether turning Jim’s freedom into Tom’s game is a flaw or a deliberate satire.",cc:"Could Twain be showing that society treated Black freedom as a game?",m:"Model claim: The ending frustrates many readers, but it can be read as Twain’s bitter satire of a nation that treated Black freedom as entertainment."},
{q:"Is Jim portrayed as a full human being?",claim:"Analyze how Twain presents Jim.",ev:"Ch. 8 (Jim’s story), Ch. 15 (the fog), Ch. 23 (Jim’s daughter), Ch. 40 (Jim stays with Tom).",rs:"Look at Jim’s feelings, choices and relationships.",cc:"Recent writers have retold the story from Jim’s point of view. What might be missing from Huck’s version?",m:"Model claim: Through Huck’s eyes, Jim gradually becomes a loving father and moral guide, though the novel never lets readers hear his full inner life."},
{q:"What does Huck’s decision in Chapter 31 reveal about conscience?",claim:"Explain what Huck’s choice shows about morality.",ev:"Ch. 16 (Huck’s first doubts), Ch. 31 (the letter), Ch. 33 (his feelings when he sees the Duke and the King punished).",rs:"Compare what society has taught Huck with what his experience with Jim has taught him.",cc:"If Huck still believes he is going to hell, is he truly changed?",m:"Model claim: Huck’s choice shows that moral courage can mean defying the ‘rules’ of one’s society, even when one still believes those rules are right."},
{q:"Cross-text: Compare Huck’s choice to help Jim with John Proctor’s choice to tear up his confession in The Crucible.",claim:"Argue what both choices reveal about individual conscience.",ev:"Huckleberry Finn Ch. 31; The Crucible Act 4.",rs:"Compare what each character risks and why each defies authority.",cc:"Huck acts out of love for a friend, Proctor out of concern for his name. Are their motives equally moral?",m:"Model claim: Both characters defy the moral authority of their communities, showing that integrity often requires standing alone against what everyone else calls right."}],

zh:{bg:["Mark Twain 的小說，1884 年在英國、1885 年在美國出版，是《The Adventures of Tom Sawyer》的續集。故事發生在南北戰爭前 1830 或 1840 年代的密西西比河沿岸，當時南方的奴隸制是合法的。",
"Huck 是一個大約十三歲、貧窮又沒受過教育的男孩，他用自己的地方方言講述這個故事。Twain 刻意使用多種方言，這本書也讓日常的美國口語得以進入嚴肅文學。",
"本書屬於公共領域。內容提醒：書中使用種族歧視字眼超過兩百次，並呈現那個時代的種族主義態度。它是美國學校中最常遭到質疑的書籍之一。請把它當作一部諷刺種族主義社會的作品來讀，並謹慎討論書中的語言。"],
sum:["Huck 和 Douglas 寡婦及她的妹妹 Watson 小姐住在一起，她們試圖用學校、禮儀和宗教「教化」他。他那暴力、酗酒的父親 Pap 回來了，要搶 Huck 的錢，並把他綁架到森林裡的一間小屋。為了逃走，Huck 偽造自己被謀殺的現場，划船逃到 Jackson 島。",
"Huck 在島上遇見 Jim，一個被 Watson 小姐奴役的人；Jim 聽說她打算把他賣到下游的 New Orleans，於是逃了出來。洪水期間，他們在一間漂流的房子裡發現一具男屍；Jim 蓋住死者的臉，不讓 Huck 看見。他們乘木筏順著密西西比河而下，希望抵達伊利諾州的 Cairo，再沿俄亥俄河北上進入自由州。兩人在霧中失散後，Huck 騙 Jim 說那只是一場夢；當 Jim 說出自己有多受傷時，Huck 放下身段向他道歉。他們在霧中漂過了 Cairo，一艘蒸汽船撞碎了木筏。",
"Huck 住進 Grangerford 家，這個講究教養的家族與 Shepherdson 家陷入致命的世仇。當世仇爆發成一場殺戮時，Huck 逃走，與已修好木筏的 Jim 重聚。",
"兩個自稱「公爵」和「國王」的騙子佔據了木筏。他們用「Royal Nonesuch」之類的假表演欺騙各個城鎮，又冒充死者 Peter Wilks 的兄弟，企圖侵吞他家人的遺產；Huck 暗中幫助 Wilks 家的姊妹。最後，「國王」以四十美元把 Jim 賣給農夫 Silas Phelps。Huck 寫信給 Watson 小姐，告訴她 Jim 在哪裡，接著又把信撕了，決定：「好吧，那我就下地獄。」",
"在 Phelps 農場，Huck 被誤認為 Sally 姨媽的外甥 Tom Sawyer。Tom 本人也來了，假扮成他的弟弟 Sid，並根據冒險小說設計了一場荒謬複雜的「越獄」，其實 Jim 大可直接走出去。越獄時 Tom 腿部中槍，Jim 放棄了逃走的機會，留下來陪他和醫生。Jim 再度被關起來後，Tom 才說出 Watson 小姐兩個月前已經去世，並在遺囑中給了 Jim 自由。Jim 告訴 Huck，那間漂流房子裡的死者就是 Pap。Huck 打算在任何人再來教化他之前，「出發去西部的領地」。"],
chars:["敘事者；一個貧窮、務實、不信任「文明」社會的男孩。","正在逃離奴隸制的人；善良、睿智，對 Huck 像父親一樣。","Huck 暴力、抱持種族主義又酗酒的父親。","試著撫養 Huck 的姊妹；Watson 小姐奴役 Jim。","Huck 的朋友；熱愛冒險小說與遊戲。","兩個利用遇到的每個人的騙子。","一個被毫無意義的世仇毀掉的富裕家族。","Tom 和善的姨丈與姨媽，卻仍然囚禁 Jim。"],
themes:["小說揭露一個自稱基督徒、自稱文明的社會，如何把被奴役的人當作財產對待。","Huck 想逃離規矩和 Pap，追求自由；Jim 想逃離奴隸制，追求自由。兩人的旅程中，只有一個攸關生死。","Huck 那被種族主義社會訓練出來的「良心」告訴他，幫助 Jim 是一種罪；他的心卻告訴他相反的答案。","與岸上城鎮的殘酷、貪婪和暴力相比，木筏上的生活平靜又誠實。","上教堂的家族一邊自認品德高尚，一邊卻互相仇殺、奴役他人。"],
syms:["自由與流動的道路，但也是危險；它把 Jim 帶進更深的蓄奴地區。","一個小小的、平等的世界，Huck 和 Jim 可以像朋友一樣生活。","岸上的城鎮代表社會的殘酷、欺詐與暴力。","道德上的迷惘；它讓 Huck 和 Jim 失散，也讓他們錯過了 Cairo。"],
devs:["Twain 嘲諷互相仇殺的貴族、騙子、宗教上的偽善，以及浪漫的冒險故事。","Huck 的日常口語讓小說充滿幽默、真誠，以及鮮明的美國聲音。","故事由一連串鬆散連結、發生在旅途中的段落組成。","Huck 在做出全書最有道德的事時，卻以為自己在犯罪。","Huck 敘述事件時並不完全理解它們，因此讀者看到的比他更多。"],
ct:[{q:"高中應該教《Adventures of Huckleberry Finn》嗎？",claim:"表明明確立場，並提出兩個理由。",ev:"小說本身（第 15、16、31 章），再加上一篇關於這本書教學爭議的近期文章。",rs:"想一想書中的語言對學生的影響，以及學生能從閱讀中得到什麼。",cc:"老師能否一方面處理這些語言造成的傷害，一方面繼續教這本書？",m:"參考論點：這本書應該教，但必須提供仔細的歷史背景並進行開放的討論，因為它對種族主義的諷刺很有力量，但它的語言也可能傷人。"},
{q:"這部小說是種族主義的，還是在諷刺種族主義？",claim:"論證讀者應如何詮釋 Twain 對種族的描寫。",ev:"第 6 章（Pap 痛罵一位自由的黑人教授）、第 16 章（Huck 的道歉）、第 23 章（Jim 與他的女兒）、第 31 章（Huck 的決定）。",rs:"區分角色相信什麼，以及整部小說暗示了什麼。",cc:"Jim 有時被描寫得很迷信，或被拿來搞笑。這會削弱諷刺的力量嗎？",m:"參考論點：小說讓最種族主義的角色顯得最愚蠢，藉此諷刺種族主義，但它有時仍依賴刻板印象，因此它既是對種族主義的批判，也是種族主義時代的產物。"},
{q:"結局是否削弱了這部小說？",claim:"評估 Phelps 農場這一段。",ev:"第 31 章（Huck 的選擇）、第 34–40 章（Tom 的「越獄」）、第 42 章（揭露 Jim 已獲自由），以及 Ernest Hemingway 對結局的著名批評。",rs:"想一想，把 Jim 的自由變成 Tom 的遊戲，是一個缺陷，還是刻意的諷刺？",cc:"Twain 是否是在表現，當時的社會把黑人的自由當成一場遊戲？",m:"參考論點：結局讓許多讀者感到沮喪，但它也可以被解讀為 Twain 苦澀的諷刺：一個把黑人自由當作娛樂的國家。"},
{q:"Jim 被描寫成一個完整的人嗎？",claim:"分析 Twain 如何呈現 Jim。",ev:"第 8 章（Jim 的故事）、第 15 章（霧）、第 23 章（Jim 的女兒）、第 40 章（Jim 留下來陪 Tom）。",rs:"觀察 Jim 的感受、選擇和人際關係。",cc:"近年有作家從 Jim 的觀點重寫這個故事。Huck 的版本可能遺漏了什麼？",m:"參考論點：透過 Huck 的眼睛，Jim 逐漸成為一位慈愛的父親與道德引導者，但小說始終沒有讓讀者聽見他完整的內心世界。"},
{q:"Huck 在第 31 章的決定揭示了什麼關於良知的道理？",claim:"說明 Huck 的選擇顯示了什麼樣的道德。",ev:"第 16 章（Huck 最初的懷疑）、第 31 章（那封信）、第 33 章（他看到公爵和國王受罰時的感受）。",rs:"比較社會教給 Huck 的，以及他與 Jim 相處的經驗教給他的。",cc:"如果 Huck 仍然相信自己會下地獄，他真的改變了嗎？",m:"參考論點：Huck 的選擇顯示，道德勇氣可能意味著違抗社會的「規則」，即使自己仍然相信那些規則是對的。"},
{q:"跨文本：比較 Huck 決定幫助 Jim，與《The Crucible》中 John Proctor 撕毀認罪書的選擇。",claim:"論證這兩個選擇對個人良知有何揭示。",ev:"《Huckleberry Finn》第 31 章；《The Crucible》第四幕。",rs:"比較兩個角色各自冒著什麼風險，以及他們為何違抗權威。",cc:"Huck 是出於對朋友的愛，Proctor 是出於對名字的在乎。他們的動機在道德上同樣高尚嗎？",m:"參考論點：兩個角色都違抗了所屬社群的道德權威，顯示正直往往需要獨自對抗所有人眼中的「對」。"}]}};

const EYES={
title:"Their Eyes Were Watching God",author:"Zora Neale Hurston · 1937",blurb:"Voice, independence, love",cite:"author and page, e.g., (Hurston 42)",
bg:["A novel by Zora Neale Hurston, published in 1937. Hurston was an anthropologist and folklorist connected with the Harlem Renaissance, and she grew up in Eatonville, Florida, one of the first incorporated all-Black towns in the United States, where much of the novel is set.",
"Janie Crawford, a Black woman in her forties, returns to Eatonville and tells her friend Pheoby the story of her life and her three marriages. The narration moves between a lyrical third-person voice and the rich dialect of the characters.",
"The book was out of print for years and was rediscovered in the 1970s, partly through the writer Alice Walker. It is under copyright, so quote only short passages. Content note: the novel includes domestic violence and a violent death."],
sum:[["Ch. 1–3 · The pear tree","Janie walks back into Eatonville, and the townspeople gossip about her. On her back porch she tells Pheoby her story. As a teenager, Janie lies under a blossoming pear tree and dreams of a love as natural and joyful as bees and blossoms. Her grandmother, Nanny, who was born into slavery, sees Janie kiss a boy and quickly arranges her marriage to Logan Killicks, an older farmer, for security. Janie waits for love to come, but it never does."],
["Ch. 4–9 · Jody Starks","Logan wants Janie to do hard farm work. She runs off with Joe ‘Jody’ Starks, an ambitious man headed to Eatonville. Jody buys land, opens a store and becomes mayor, but he wants Janie to be a silent symbol of his success. He makes her tie up her hair and keeps her out of the storytelling on the store porch. After years of humiliation, Janie publicly mocks his aging body, destroying his pride. As Jody lies dying of kidney failure, she tells him he never let her be herself."],
["Ch. 10–18 · Tea Cake and the muck","Free and financially independent, Janie meets Tea Cake (Vergible Woods), a younger, playful man who teaches her to play checkers and treats her as an equal. The town disapproves, but she marries him and goes with him to the Everglades — ‘the muck’ — to plant and pick beans with migrant workers. They are happy, but the marriage also includes jealousy, and at one point Tea Cake hits Janie to show others he is in control. A hurricane floods the area. As they flee, Tea Cake saves Janie from a rabid dog but is bitten."],
["Ch. 19–20 · The trial and the return","Weeks later, Tea Cake develops rabies and becomes violent and paranoid. When he tries to shoot Janie, she shoots him in self-defense. At her trial, an all-white jury acquits her, while many of the Black workers resent her. Janie buries Tea Cake with dignity and returns to Eatonville. She finishes telling Pheoby her story, at peace with her memories."]],
chars:[["Janie Crawford","The protagonist; searches for love and her own voice."],["Nanny","Janie’s grandmother; born into slavery, she values safety above love."],["Logan Killicks","Janie’s first husband; an older farmer who sees her as a worker."],["Joe (Jody) Starks","Janie’s second husband; ambitious mayor of Eatonville who silences her."],["Tea Cake","Janie’s third husband; playful and loving, yet jealous and at times violent."],["Pheoby Watson","Janie’s loyal friend and listener."],["Mrs. Turner","A woman on the muck who values lighter skin and looks down on darker people."],["The porch talkers","Townspeople whose gossip and stories form a chorus."]],
themes:[["Voice and self-expression","Janie moves from silence to speaking for herself; telling her story to Pheoby is itself an act of finding her voice."],
["Love and independence","Janie wants a love that lets her remain herself, not a marriage that offers only security or status."],
["Gender roles","Each husband expects Janie to fill a role — worker, ornament or partner — and she resists being controlled."],
["Race and colorism","Characters like Mrs. Turner show how prejudice based on skin color divides the Black community itself."],
["Nature and growth","Janie measures her life through images of trees, blossoms and the horizon."]],
syms:[["The pear tree","Janie’s ideal of natural, joyful, mutual love."],
["Janie’s hair","Her individuality and beauty; Jody makes her hide it under a head rag."],
["The horizon","Her dreams and the wide world she wants to experience."],
["The hurricane","The power of nature and fate, before which all people are equal."],
["The mule","A local mule that Jody buys and frees; it echoes Nanny’s view that Black women carry the world’s burdens."]],
devs:[["Frame narrative","Janie tells her story to Pheoby on the porch, so the novel begins and ends in the present."],
["Dialect and free indirect speech","The characters’ Southern Black dialect is set against a lyrical narrative voice that sometimes blends with Janie’s thoughts."],
["Nature imagery","Trees, blossoms and the horizon express Janie’s inner life."],
["Folk storytelling","The porch talk preserves the humor and tradition of African American oral culture."],
["Foreshadowing","The rabid dog during the hurricane prepares for the tragedy that follows."]],
ct:[{q:"Does Janie find her voice?",claim:"Trace Janie’s development and take a position.",ev:"Ch. 2 (the pear tree), Ch. 6 (silenced on the porch), Ch. 7 (she speaks against Jody), Ch. 19 (the trial), Ch. 20 (her story to Pheoby).",rs:"Notice when Janie speaks, when she is silent and who controls her words.",cc:"At the trial, others speak about her. Does that weaken the claim that she has found her voice?",m:"Model claim: Janie finds her voice gradually, and the act of telling Pheoby her story is the final proof that she has become the author of her own life."},
{q:"Is Tea Cake good for Janie?",claim:"Evaluate Janie’s marriage to Tea Cake.",ev:"Ch. 10 (checkers), Ch. 13 (the money), Ch. 17 (the beating), Ch. 18 (the hurricane).",rs:"Weigh the joy and equality he brings against his jealousy and violence.",cc:"Hurston does not condemn Tea Cake openly. Should readers?",m:"Model claim: Tea Cake gives Janie joy and freedom that no one else did, but his violence shows that even her happiest marriage is shaped by male control."},
{q:"Why does Hurston use a frame narrative?",claim:"Explain the effect of having Janie tell her story to Pheoby.",ev:"Ch. 1 (Janie’s return), Ch. 2 (the story begins), Ch. 20 (the story ends).",rs:"Consider who is telling, who is listening and why it matters that Janie tells it herself.",cc:"Much of the novel is told by a third-person narrator. Is it really Janie’s story?",m:"Model claim: The frame turns the novel into an act of testimony, letting a Black woman tell her own story in her own way."},
{q:"What does Nanny want for Janie, and was she wrong?",claim:"Evaluate Nanny’s choice for Janie.",ev:"Ch. 2 (Nanny’s history and her speech about Black women), Ch. 3 (the marriage to Logan), Ch. 9 (Janie’s later judgment of Nanny).",rs:"Consider Nanny’s experience of slavery and what ‘safety’ meant to her.",cc:"Can we condemn Nanny’s choice without dismissing the dangers she survived?",m:"Model claim: Nanny’s choice comes from love and the trauma of slavery, but by putting safety above freedom she gives Janie a life that Janie must spend years escaping."},
{q:"How does the novel portray community and gossip?",claim:"Analyze the role of the townspeople.",ev:"Ch. 1 (the porch watchers), Ch. 6 (the store porch), Ch. 19 (the workers at the trial).",rs:"Look at how the community both supports and judges Janie.",cc:"Is the community a villain, or a realistic part of small-town life?",m:"Model claim: The community is a source of humor, culture and belonging, but its judgments also pressure Janie to fit roles she rejects."},
{q:"Cross-text: Compare Janie with Daisy Buchanan in The Great Gatsby.",claim:"Argue what the two women reveal about women’s choices in the 1920s and 1930s.",ev:"Their Eyes Ch. 2, Ch. 7 and Ch. 20; Gatsby Ch. 1 and Ch. 7.",rs:"Compare how race, class and marriage shape each woman’s freedom.",cc:"Daisy is rich and white; Janie is Black and works on the muck. Is the comparison fair?",m:"Model claim: Daisy chooses comfort and stays trapped, while Janie risks comfort for freedom, suggesting that independence depends on courage as much as on circumstance."}],
kz:{"Voice and self-expression":"聲音與自我表達","Love and independence":"愛與獨立","Gender roles":"性別角色","Race and colorism":"種族與膚色歧視","Nature and growth":"自然與成長","The pear tree":"梨樹","Janie’s hair":"Janie 的頭髮","The horizon":"地平線","The hurricane":"颶風","The mule":"騾子","Frame narrative":"框架敘事","Dialect and free indirect speech":"方言與自由間接引語","Nature imagery":"自然意象","Folk storytelling":"民間說故事傳統"},
zh:{bg:["Zora Neale Hurston 的小說，1937 年出版。Hurston 是一位與哈林文藝復興有關的人類學家與民俗學者，她在佛羅里達州的 Eatonville 長大，那是美國最早正式設立的全黑人城鎮之一，小說大部分的故事也發生在那裡。",
"Janie Crawford 是一位四十多歲的黑人女性，她回到 Eatonville，向朋友 Pheoby 講述自己的人生與三段婚姻。敘事在抒情的第三人稱聲音與角色們豐富的方言之間轉換。",
"這本書曾絕版多年，1970 年代才被重新發現，作家 Alice Walker 在其中扮演了重要角色。本書仍受版權保護，因此只能引用短句。內容提醒：小說中有家庭暴力與暴力致死的情節。"],
sum:["Janie 走回 Eatonville，鎮民們議論紛紛。在後門廊上，她向 Pheoby 講述自己的故事。少女時期的 Janie 躺在一棵開滿花的梨樹下，夢想著一份像蜜蜂與花朵般自然、喜悅的愛情。生於奴隸制下的祖母 Nanny 看見 Janie 親吻一個男孩，便很快為了安穩而把她嫁給年長的農夫 Logan Killicks。Janie 等待愛情到來，但它始終沒有出現。",
"Logan 要 Janie 做繁重的農活。她和雄心勃勃、正要前往 Eatonville 的 Joe「Jody」Starks 私奔了。Jody 買地、開店，還當上鎮長，但他要 Janie 成為他成功的沉默象徵。他要她把頭髮包起來，也不讓她參與店門廊上的說故事。忍受多年的羞辱後，Janie 當眾嘲笑他衰老的身體，摧毀了他的自尊。Jody 因腎衰竭臨終時，她告訴他，他從未讓她做自己。",
"重獲自由、經濟獨立的 Janie 遇見了 Tea Cake（Vergible Woods），一個比她年輕、愛玩的男人，他教她下跳棋，把她當作平等的人。鎮上的人不認同，但她嫁給了他，跟他到 Everglades（「泥沼地」）和流動工人一起種豆、採豆。他們很快樂，但婚姻中也有嫉妒，Tea Cake 甚至曾為了向別人展示他的控制力而打了 Janie。一場颶風淹沒了那個地區。逃難時，Tea Cake 從一隻瘋狗口中救下 Janie，自己卻被咬了。",
"幾週後，Tea Cake 出現狂犬病症狀，變得暴力又多疑。當他想開槍打 Janie 時，她出於自衛開槍打死了他。在審判中，全白人的陪審團判她無罪，而許多黑人工人卻對她心懷怨恨。Janie 讓 Tea Cake 有尊嚴地下葬，然後回到 Eatonville。她向 Pheoby 講完自己的故事，與自己的回憶和平共處。"],
chars:["主角；追尋愛情與屬於自己的聲音。","Janie 的祖母；生於奴隸制下，把安全看得比愛情重要。","Janie 的第一任丈夫；把她當成勞力的年長農夫。","Janie 的第二任丈夫；野心勃勃的 Eatonville 鎮長，讓她噤聲。","Janie 的第三任丈夫；愛玩又深情，卻善妒，有時還會動手。","Janie 忠實的朋友與聆聽者。","泥沼地上一個推崇淺膚色、看不起深膚色者的女人。","鎮民們的閒話與故事，構成了一種合唱般的聲音。"],
themes:["Janie 從沉默走向為自己發聲；向 Pheoby 講述自己的故事，本身就是找到聲音的行動。","Janie 想要一份讓她能保有自我的愛，而不是只提供安穩或地位的婚姻。","每一任丈夫都期待 Janie 扮演某個角色（勞工、裝飾品或伴侶），而她抗拒被控制。","像 Turner 太太這樣的角色顯示，以膚色深淺為基礎的偏見，也在黑人社群內部造成分裂。","Janie 用樹木、花朵和地平線的意象來衡量自己的人生。"],
syms:["Janie 心中自然、喜悅、互相的理想愛情。","她的個性與美麗；Jody 要她用頭巾把頭髮藏起來。","她的夢想，以及她想要體驗的廣闊世界。","大自然與命運的力量，在它面前人人平等。","Jody 買下並放生的一頭鎮上的騾子；呼應 Nanny 認為黑人女性背負世界重擔的看法。"],
devs:["Janie 在門廊上向 Pheoby 講述自己的故事，因此小說以現在開始，也以現在結束。","角色們的南方黑人方言，與一個抒情的敘事聲音形成對照，而這個敘事聲音有時會與 Janie 的思緒融為一體。","樹木、花朵和地平線表達出 Janie 的內心世界。","門廊上的閒談保存了非裔美國人口述文化的幽默與傳統。","颶風中的瘋狗，為隨後的悲劇埋下伏筆。"],
ct:[{q:"Janie 找到自己的聲音了嗎？",claim:"追蹤 Janie 的成長並表明立場。",ev:"第 2 章（梨樹）、第 6 章（在門廊上被迫沉默）、第 7 章（她反駁 Jody）、第 19 章（審判）、第 20 章（她向 Pheoby 講的故事）。",rs:"注意 Janie 何時說話、何時沉默，以及是誰在控制她的話語。",cc:"在審判中，是別人在談論她。這會削弱她已找到聲音的說法嗎？",m:"參考論點：Janie 是逐漸找到自己的聲音的，而她向 Pheoby 講述自己故事這件事，正是她成為自己人生作者的最終證明。"},
{q:"Tea Cake 對 Janie 來說是好的嗎？",claim:"評估 Janie 與 Tea Cake 的婚姻。",ev:"第 10 章（跳棋）、第 13 章（那筆錢）、第 17 章（毆打）、第 18 章（颶風）。",rs:"權衡他帶來的快樂與平等，以及他的嫉妒與暴力。",cc:"Hurston 並沒有公開譴責 Tea Cake。讀者應該譴責他嗎？",m:"參考論點：Tea Cake 給了 Janie 別人從未給過的快樂與自由，但他的暴力顯示，即使是她最幸福的婚姻，也受到男性控制的影響。"},
{q:"Hurston 為什麼使用框架敘事？",claim:"說明讓 Janie 向 Pheoby 講述故事的效果。",ev:"第 1 章（Janie 的歸來）、第 2 章（故事開始）、第 20 章（故事結束）。",rs:"想一想誰在講、誰在聽，以及由 Janie 親自講述為什麼重要。",cc:"小說大部分是由第三人稱敘事者講述的。這真的是 Janie 的故事嗎？",m:"參考論點：框架讓小說成為一種見證，讓一位黑人女性以自己的方式講述自己的故事。"},
{q:"Nanny 希望 Janie 得到什麼？她錯了嗎？",claim:"評估 Nanny 為 Janie 做的選擇。",ev:"第 2 章（Nanny 的過去，以及她對黑人女性的那番話）、第 3 章（嫁給 Logan）、第 9 章（Janie 後來對 Nanny 的評價）。",rs:"想一想 Nanny 經歷過的奴隸制，以及「安全」對她來說意味著什麼。",cc:"我們能否在譴責 Nanny 的選擇的同時，不輕視她所熬過的危險？",m:"參考論點：Nanny 的選擇出於愛與奴隸制留下的創傷，但她把安全放在自由之上，給了 Janie 一段 Janie 必須花好多年才能逃離的人生。"},
{q:"小說如何描寫社群與閒話？",claim:"分析鎮民們扮演的角色。",ev:"第 1 章（門廊上的旁觀者）、第 6 章（店門廊）、第 19 章（審判中的工人）。",rs:"觀察社群如何一方面支持 Janie，一方面評斷她。",cc:"社群是反派，還是小鎮生活的真實寫照？",m:"參考論點：社群是幽默、文化與歸屬感的來源，但它的評斷也給 Janie 壓力，要她扮演她拒絕的角色。"},
{q:"跨文本：比較 Janie 與《The Great Gatsby》中的 Daisy Buchanan。",claim:"論證這兩位女性揭示了 1920 和 1930 年代女性的哪些選擇。",ev:"《Their Eyes Were Watching God》第 2、7、20 章；《The Great Gatsby》第 1 章與第 7 章。",rs:"比較種族、階級與婚姻如何塑造每位女性的自由。",cc:"Daisy 富有且是白人；Janie 是黑人，在泥沼地工作。這樣比較公平嗎？",m:"參考論點：Daisy 選擇了舒適，因而一直被困住；Janie 則冒著失去舒適的風險追求自由，顯示獨立不只取決於處境，也取決於勇氣。"}]}};

title:"Barrio Boy",author:"Ernesto Galarza · 1971",blurb:"Immigration, identity, a boy’s journey north",cite:"author and page, e.g., (Galarza 211)",
bg:["Barrio Boy is an autobiography by Ernesto Galarza (1905–1984), published in 1971. Galarza was born in the small mountain village of Jalcocotán, in the state of Nayarit, Mexico. As a child he moved with his mother and uncles through Mexico and into the United States, finally settling in Sacramento, California.",
"His family left Mexico during the Mexican Revolution (1910–1920), when fighting, poverty and danger forced hundreds of thousands of Mexicans to move north. Galarza grew up in a mixed immigrant neighborhood, a barrio, near downtown Sacramento.",
"Galarza later earned degrees from Occidental College, Stanford and Columbia, and became a labor organizer and scholar who fought for the rights of Mexican American farmworkers. He was nominated for the Nobel Prize in Literature in 1976."],
sum:[["Jalcocotán · Village life","Ernesto describes his early childhood in Jalcocotán: daily life, family customs, village celebrations and the people who taught him what it meant to be part of a community. Families share work, food and responsibility, and children learn respect for elders and nature."],
["Tepic and Mazatlán · On the move in Mexico","As the Mexican Revolution spreads, Ernesto, his mother Henriqueta and his uncles Gustavo and José leave the village. They live in the cities of Tepic and Mazatlán, where Ernesto sees soldiers, poverty and new ways of life. The family moves whenever work or safety requires it."],
["North · Tucson to Sacramento","The family travels north by train, crossing into the United States. They stay in Tucson, Arizona, and then move to Sacramento, California, where the uncles find work on the railroads and in the fields."],
["Sacramento · Life in a barrio","In Sacramento’s lower part of town, Ernesto lives among immigrants from Mexico, Japan, the Philippines, Italy, Portugal and other countries. At Lincoln School, his principal and teachers respect his culture while helping him learn English, and he grows proud of being both Mexican and American."],
["Growing up · Work and loss","Ernesto works odd jobs and farm labor while going to school. When his mother and uncle die in the 1918 influenza epidemic, he is left largely on his own. He continues his education with help from teachers and community members and begins to see injustice in how farmworkers are treated."]],
chars:[["Ernesto Galarza","The author; a curious, observant boy who grows into a scholar and activist."],["Henriqueta (Doña Henriqueta)","Ernesto’s mother; strong, protective and determined."],["Uncle Gustavo","One of Ernesto’s uncles; works to support the family."],["Uncle José","Ernesto’s uncle; a lively, protective presence."],["Miss Hopley","Principal of Lincoln School, who welcomes immigrant students."],["Miss Ryan","Ernesto’s first-grade teacher, who helps him learn English."]],

zh:{bg:["《Barrio Boy》是 Ernesto Galarza（1905–1984）的自傳，1971 年出版。Galarza 出生在墨西哥納亞里特州的山村 Jalcocotán。童年時他隨母親和舅舅們走遍墨西哥，進入美國，最後在加州沙加緬度定居。",
"他的家人在墨西哥革命（1910–1920）期間離開墨西哥；當時的戰亂、貧窮與危險迫使數十萬墨西哥人北遷。Galarza 在沙加緬度市中心附近一個多族裔移民社區（barrio）長大。",
"Galarza 後來取得 Occidental College、史丹佛和哥倫比亞大學的學位，成為勞工組織者與學者，為墨西哥裔農場工人爭取權益。他在 1976 年獲得諾貝爾文學獎提名。"],
sum:["Ernesto 描述他在 Jalcocotán 的童年：日常生活、家庭習俗、村裡的慶典，以及那些教他什麼是社群一份子的人。家家戶戶分擔工作、分享食物與責任，孩子們學習尊敬長輩與自然。",
"墨西哥革命擴散時，Ernesto、母親 Henriqueta 和舅舅 Gustavo、José 離開村莊。他們住過 Tepic 和 Mazatlán 等城市，Ernesto 在那裡看見士兵、貧窮和新的生活方式。只要工作或安全需要，一家人就會搬家。",
"一家人搭火車北上，進入美國。他們先在亞利桑那州的圖森停留，再搬到加州沙加緬度，舅舅們在鐵路和田裡找到工作。",
"在沙加緬度的下城區，Ernesto 和來自墨西哥、日本、菲律賓、義大利、葡萄牙等國的移民住在一起。在林肯學校，校長和老師尊重他的文化，同時幫他學英文，他也漸漸以身為墨西哥人和美國人為榮。",
"Ernesto 一邊上學一邊打零工、做農場工作。母親和舅舅在 1918 年的流感大流行中過世後，他大致只能靠自己。在老師與社區成員的幫助下，他繼續求學，並開始看見農場工人遭受的不公平對待。"],
chars:["作者；好奇、善於觀察的男孩，長大後成為學者與社運人士。","Ernesto 的母親；堅強、保護孩子、意志堅定。","Ernesto 的舅舅之一；努力工作養家。","Ernesto 的舅舅；活潑、保護家人。","林肯學校校長，歡迎移民學生。","Ernesto 的一年級老師，幫他學英文。"],
themes:["Ernesto 學習英文與美國生活方式，卻沒有放棄墨西哥身分，顯示人可以同時屬於兩種文化。","無論在村莊還是巴里歐社區，人們都靠互相幫助活下來。","尊重學生文化的老師，為學生打開大門。","革命與貧窮迫使家庭遷徙，每一次遷徙都改變了他們。","家人保護 Ernesto，而失去他們塑造了他的獨立。"],
syms:["Ernesto 的根，以及他帶往北方的價值觀。","移動、改變，以及跨越國界的旅程。","不同文化相遇並受到尊重的地方。","由許多移民群體組成的社區，是美國的縮影。"],
devs:["Galarza 以成人身分回顧童年，結合孩子的視角與大人的反思。","豐富的聲音、氣味與味道描寫，讓每個地方栩栩如生。","英文中夾雜的西班牙文詞彙，呈現兩種文化的交融。","溫和的幽默讓艱難的經歷不那麼沉重。","故事依時間與空間向前推進，從村莊到城市。"],
ct:[{q:"Ernesto 如何在同化與身分認同之間取得平衡？",claim:"對他是失去還是保留了自己的文化表明立場。",ev:"在 Jalcocotán 的生活；林肯學校；他在巴里歐社區的生活。",rs:"說明他如何在保留根源的同時適應新環境。",cc:"學英文是否意味著放棄自己的一部分？",m:"參考論點：Ernesto 顯示，成為美國人不需要拋棄墨西哥身分，尤其當學校尊重兩者時。"},
{q:"老師在 Ernesto 的成功中扮演什麼角色？",claim:"分析教育的作用。",ev:"Miss Hopley；Miss Ryan；他後來的求學。",rs:"說明尊重與支持如何影響他的學習。",cc:"他的成功主要是靠自己的努力嗎？",m:"參考論點：Ernesto 的老師把學校變成橋樑而非障礙，顯示尊重學生文化有多重要。"},
{q:"墨西哥革命如何影響 Ernesto 的人生？",claim:"把歷史和他的故事連結起來。",ev:"在 Tepic 與 Mazatlán 的章節；北上旅程的章節。",rs:"說明政治事件如何迫使個人做出選擇。",cc:"就算沒有革命，這家人也會離開墨西哥嗎？",m:"參考論點：革命把一個村裡的男孩變成移民，顯示歷史決定了普通家庭的人生道路。"},
{q:"巴里歐社區是美國的縮影嗎？",claim:"論證巴里歐社區代表什麼。",ev:"沙加緬度章節中對來自各國鄰居的描述。",rs:"考慮合作、衝突與多元。",cc:"回憶錄是否把巴里歐社區描寫得比實際更輕鬆？",m:"參考論點：巴里歐社區呈現美國最好的一面，許多文化比鄰而居；同時回憶錄也暗示了他們面對的貧窮與歧視。"},
{q:"Ernesto 的童年如何解釋他後來的社運工作？",claim:"把男孩和成年後的他連結起來。",ev:"他在田裡的工作；母親與舅舅之死；書的最後部分。",rs:"說明早年經歷如何塑造他的價值觀。",cc:"回憶錄能被信任來解釋作者本人嗎？",m:"參考論點：Ernesto 對社群與不公的經歷，解釋了他為何一生為農場工人奮鬥。"},
{q:"跨文本：比較《Barrio Boy》與《The Distance Between Us》。",claim:"論證移民經驗改變了什麼、什麼沒有改變。",ev:"兩本回憶錄。",rs:"比較離開的原因、旅程、學校與家庭。",cc:"兩種經驗是否差異太大而無法比較？",m:"參考論點：兩位作者相隔約七十年，卻都顯示家庭的犧牲與支持的老師是移民成功的關鍵。"}]}};

bg:["A memoir by Reyna Grande, published in 2012 and a finalist for the National Book Critics Circle Award. Grande was born in 1975 in Iguala, Guerrero, Mexico. A young readers’ edition was published in 2016, and a sequel, A Dream Called Home, in 2018.",
"When Reyna was a toddler, her father left for the United States to earn money to build a house, and her mother later followed him, leaving Reyna, her older sister Mago and her brother Carlos with relatives. Many families in Mexico and Central America experience this kind of separation.",
"In the U.S., Reyna became a legal permanent resident through the 1986 immigration amnesty and was the first in her family to graduate from college, at UC Santa Cruz. Content note: the memoir describes childhood neglect, physical abuse, alcoholism and a dangerous border crossing."],
sum:[["Iguala · The man behind the glass","Reyna, Mago and Carlos live with their strict paternal grandmother, Abuela Evila, who treats them coldly. Reyna knows her father only from a photograph behind glass. Their mother returns from the U.S. with a new baby, Betty, but soon leaves the children again for another man."],
["Iguala · Waiting","The children move between relatives, including their kinder maternal grandmother, Abuelita Chinta. They face poverty, illness and hunger in Iguala. Mago acts as a second mother to Reyna and Carlos, and the children hope their father will return for them."],
["The crossing","When Reyna is about nine and a half, her father finally returns. He takes the three older children north and they cross the border illegally with a smuggler. Their first attempt fails and they are caught, but they try again and reach Los Angeles."],
["Los Angeles · El Otro Lado","In Los Angeles, the children live with their father and his new partner, Mila. Their father demands that they succeed in school and learn English, but he drinks heavily and becomes violent. Reyna struggles in classes, finds comfort in reading and writing, and discovers she is a talented runner."],
["Finding her way","As a teenager, Reyna feels torn between her father’s anger and her mother’s absence. At Pasadena City College, an English professor, Diana Savas, recognizes Reyna’s writing talent and takes her in. Reyna transfers to UC Santa Cruz, becoming the first in her family to graduate from college, and looks back on the distance — physical and emotional — that shaped her family."]],

zh:{bg:["Reyna Grande 的回憶錄，2012 年出版，入圍美國國家書評人協會獎。Grande 1975 年出生於墨西哥格雷羅州的伊瓜拉。2016 年出版青少年版，2018 年出版續集《A Dream Called Home》。",
"Reyna 還很小時，父親為了賺錢蓋房子前往美國，後來母親也跟著去，把 Reyna、姊姊 Mago 和哥哥 Carlos 留給親戚照顧。墨西哥和中美洲有許多家庭經歷這樣的分離。",
"在美國，Reyna 透過 1986 年的移民大赦成為合法永久居民，並成為家中第一個大學畢業的人（加州大學聖塔克魯茲分校）。內容提醒：回憶錄描述兒童疏於照顧、身體虐待、酗酒，以及危險的越境過程。"],
sum:["Reyna、Mago 和 Carlos 和嚴厲的祖母 Evila 同住，祖母對他們很冷淡。Reyna 只透過玻璃後的一張照片認識父親。母親從美國回來時帶著新生的妹妹 Betty，卻很快又為了另一個男人離開孩子們。",
"孩子們在親戚之間輾轉，包括比較慈愛的外婆 Chinta。他們在伊瓜拉面對貧窮、疾病和飢餓。Mago 像第二個母親一樣照顧 Reyna 和 Carlos，孩子們盼望父親回來接他們。",
"Reyna 大約九歲半時，父親終於回來了。他帶著三個大孩子北上，跟著蛇頭非法越境。第一次嘗試失敗被抓，但他們再試一次，終於抵達洛杉磯。",
"在洛杉磯，孩子們和父親及他的新伴侶 Mila 同住。父親要求他們在學校表現優秀、學好英文，但他酗酒且會施暴。Reyna 在課業上掙扎，在閱讀與寫作中找到安慰，也發現自己很有跑步天分。",
"青少年時期的 Reyna 夾在父親的憤怒與母親的缺席之間。在帕沙迪納城市學院，英文教授 Diana Savas 看出 Reyna 的寫作天分，讓她住進自己家。Reyna 轉學到加州大學聖塔克魯茲分校，成為家中第一個大學畢業生，並回顧塑造了她家庭的那段距離，包括地理上和情感上的。"],
chars:["作者；敏感、意志堅定，渴望愛與安定。","Reyna 的姊姊和保護者；極為忠誠。","Reyna 的哥哥；安靜又體貼。","要求孩子受教育、有成就，但酒後會施暴。","情感疏離；不只一次離開孩子們。","Reyna 嚴厲的祖母。","Reyna 慈愛的外婆。","指導 Reyna 並給她一個家的教授。"],
themes:["移民一次又一次拆散這個家；「距離」不只是地理上的，也是情感上的。","父親相信美國能提供更好的生活，但這個夢想伴隨著犧牲與痛苦。","Reyna 熬過疏忽與虐待，把經歷化為成功。","學校既是掙扎也是出路；老師與書本改變了 Reyna 的人生。","Reyna 在墨西哥和美國都覺得自己是局外人，必須自己定義什麼是家。"],
syms:["父親是一個概念而不是一個人；遠距離的愛。","分隔這個家的地理與情感界線。","Reyna 的力量、紀律與出口。","理解並療癒過去的方式。"],
devs:["Reyna 誠實地講述自己的故事，包括她自己的憤怒和錯誤。","前面的章節透過幼童的理解來呈現事件。","西班牙文詞語反映她的雙語身分。","對伊瓜拉和洛杉磯的生動描寫，對比兩個世界。","墨西哥的章節與美國的章節呈現移民孩子分裂的人生。"],
ct:[{q:"Reyna 的父親是英雄還是壞人？",claim:"表明立場。",ev:"他離開的決定；帶孩子北上；他的酗酒與暴力；他對教育的要求。",rs:"權衡他的犧牲與他造成的傷害。",cc:"一個人可以兩者皆是嗎？",m:"參考論點：Reyna 的父親既不是英雄也不是壞人；他給了她未來，同時也傷害了她，顯示犧牲與傷害可以來自同一個人。"},
{q:"書名中的「距離」是什麼？",claim:"詮釋書名。",ev:"父親的照片；母親再次離開；在洛杉磯的生活；成年後的 Reyna。",rs:"找出地理、情感與文化上的距離。",cc:"這段距離最後拉近了嗎？",m:"參考論點：真正的距離是情感上的；即使家人團聚，移民也已經破壞了他們之間的連結。"},
{q:"對 Reyna 一家來說，美國夢值得付出這些代價嗎？",claim:"論證代價與收穫。",ev:"在墨西哥分離的歲月；在洛杉磯的掙扎；Reyna 的畢業。",rs:"考慮不同家庭成員的結果。",cc:"他們留在墨西哥會比較好嗎？",m:"參考論點：Reyna 的成功顯示夢想可以實現，但情感上的代價由每個家庭成員共同承擔。"},
{q:"誰幫助 Reyna 成功？",claim:"分析導師的角色。",ev:"Mago；洛杉磯的老師；Diana Savas。",rs:"說明他人的支持如何影響她的道路。",cc:"強調導師是否會奪走 Reyna 自己的功勞？",m:"參考論點：Reyna 的決心很重要，但導師給了她家庭無法給予的穩定。"},
{q:"Grande 如何從孩子的角度呈現兒童移民？",claim:"分析視角。",ev:"在伊瓜拉的前面章節；越境過程。",rs:"說明孩子的視角揭露了哪些統計數字無法呈現的移民面向。",cc:"依賴童年記憶的回憶錄可靠嗎？",m:"參考論點：透過孩子的眼睛看移民，揭露了新聞報導很少呈現的情感代價。"},
{q:"跨文本：把 Reyna 的故事和近期關於邊境家庭分離的新聞做比較。",claim:"論證這本回憶錄為公共辯論增加了什麼。",ev:"回憶錄本身，加上一篇關於家庭分離的可靠近期新聞。",rs:"比較原因、經歷以及對孩子的影響。",cc:"個人故事應該影響移民政策嗎？",m:"參考論點：Reyna 的回憶錄提醒讀者，每一場政策辯論的背後，都有人生被分離所塑造的孩子。"}]}};

title:"Bound for the Promised Land",author:"Kate Clifford Larson · 2004",blurb:"Harriet Tubman, slavery, courage and faith",cite:"author and page, e.g., (Larson 88)",
bg:["Bound for the Promised Land: Harriet Tubman, Portrait of an American Hero is a biography by the historian Kate Clifford Larson, published in 2004. It was one of the first full scholarly biographies of Tubman and used court records, letters and newspapers to separate fact from legend.",
"Harriet Tubman was born Araminta ‘Minty’ Ross around 1822 in Dorchester County, on Maryland’s Eastern Shore. She escaped slavery in 1849 and returned again and again to lead family members and others to freedom on the Underground Railroad, a secret network of people and safe houses.",
"Larson shows that some popular claims, such as Tubman rescuing hundreds of people on nineteen trips, are exaggerations; the evidence points to about thirteen trips and about seventy people led out directly, with dozens more given instructions. Content note: the book describes violence, family separation and abuse under slavery."],
sum:[["Childhood in slavery","Araminta Ross is born into slavery. As a child she is hired out to other households, where she is beaten and mistreated, and she watches enslavers sell her sisters away. As a teenager, she is struck in the head by a heavy weight thrown at another enslaved person. The injury causes seizures and vivid visions for the rest of her life, which she understands as messages from God."],
["Marriage and escape","Around 1844 she marries John Tubman, a free Black man, and takes the name Harriet. When her enslaver dies and she fears being sold, she escapes in 1849, traveling about ninety miles to Philadelphia and freedom. Her husband does not follow her, and he later marries another woman."],
["Conductor on the Underground Railroad","After the Fugitive Slave Act of 1850 makes it dangerous to be free even in the North, Tubman leads people to Canada, including St. Catharines, Ontario. Over about a decade, she returns to Maryland roughly thirteen times to rescue family members and others, working with abolitionists such as William Still and Thomas Garrett. She becomes known as ‘Moses.’"],
["Abolitionist and ally of John Brown","Tubman meets the abolitionist John Brown, who calls her ‘General Tubman,’ and she supports his plans for armed resistance against slavery, though she does not take part in his 1859 raid on Harpers Ferry. She speaks publicly against slavery and gains fame in abolitionist circles."],
["The Civil War","During the Civil War, Tubman works for the Union Army as a cook, nurse, scout and spy in South Carolina. In 1863 she helps lead the Combahee River Raid, which frees more than seven hundred enslaved people, one of the first military operations in U.S. history planned with a woman’s leadership."],
["Later life and legacy","After the war, Tubman lives in Auburn, New York, marries Nelson Davis, supports women’s suffrage and opens a home for elderly and poor African Americans. She struggles financially and fights for years to receive a government pension for her service. She dies in 1913 and is remembered as one of America’s greatest heroes."]],
chars:[["Harriet Tubman (Araminta Ross)","Escaped slavery and led others to freedom; scout, spy, activist."],["Ben and Rit Ross","Harriet’s parents, both enslaved; Rit fought to keep her children together."],["John Tubman","Harriet’s first husband, a free Black man."],["William Still","A Black abolitionist in Philadelphia who recorded the stories of freedom seekers."],["Thomas Garrett","A Quaker abolitionist in Delaware who helped Tubman."],["John Brown","A radical abolitionist who admired Tubman."],["Nelson Davis","A Civil War veteran and Tubman’s second husband."]],

["Myth vs. history","Larson separates Tubman’s real achievements from exaggerations, showing the truth is impressive enough."],
["Resistance to injustice","Tubman resists slavery through escape, rescue, war and activism."]],

kz:{"Freedom and courage":"自由與勇氣","Family":"家庭","Faith":"信仰","Myth vs. history":"神話與歷史","Resistance to injustice":"反抗不公","The North Star":"北極星","Moses":"摩西","The Promised Land":"應許之地","Spirituals":"靈歌","Historical biography":"歷史傳記","Chronological structure":"時間順序結構","Use of evidence":"運用證據","Context":"歷史脈絡","Myth-busting":"破除迷思"},
zh:{bg:["《Bound for the Promised Land：Harriet Tubman，一位美國英雄的畫像》是歷史學家 Kate Clifford Larson 撰寫的傳記，2004 年出版。這是最早的完整學術型 Tubman 傳記之一，運用法院紀錄、書信和報紙，區分事實與傳說。",
"Harriet Tubman 本名 Araminta「Minty」Ross，約 1822 年生於馬里蘭州東岸的多徹斯特郡。她在 1849 年逃離奴隸制，之後一次又一次返回，透過「地下鐵路」（由人與安全屋組成的秘密網絡）帶領家人與其他人走向自由。",
"Larson 指出一些流傳的說法有所誇大，例如 Tubman 十九趟救出數百人；證據顯示大約是十三趟，直接帶出約七十人，另外指點了數十人逃亡。內容提醒：書中描述奴隸制下的暴力、家庭拆散與虐待。"],
sum:["Araminta Ross 生而為奴。小時候她被租給別的家庭，遭到毆打和虐待，也看著奴隸主把她的姊妹賣走。少女時期，她被一個原本丟向另一名奴隸的重物擊中頭部。這次受傷讓她終身受癲癇和強烈幻象所苦，她認為那是上帝的訊息。",
"大約 1844 年，她嫁給自由黑人 John Tubman，改名 Harriet。奴隸主過世後，她害怕被賣掉，於 1849 年逃亡，走了大約九十英里抵達費城，獲得自由。她的丈夫沒有跟來，後來另娶他人。",
"1850 年的《逃奴法》讓即使在北方也很難保有自由，Tubman 於是帶人逃往加拿大，包括安大略省的聖凱瑟琳斯。大約十年間，她返回馬里蘭約十三次，救出家人與其他人，與 William Still、Thomas Garrett 等廢奴人士合作。她被稱為「摩西」。",
"Tubman 認識了廢奴主義者 John Brown，他稱她為「Tubman 將軍」。她支持他以武力反抗奴隸制的計畫，但沒有參與他 1859 年對哈珀斯費里的突襲。她公開演講反對奴隸制，在廢奴圈中聲名大噪。",
"南北戰爭期間，Tubman 在南卡羅來納為北軍擔任廚師、護士、偵察兵和間諜。1863 年她協助領導 Combahee 河突襲，解放了七百多名奴隸，這是美國史上最早由女性參與領導策劃的軍事行動之一。",
"戰後，Tubman 住在紐約州的奧本，嫁給 Nelson Davis，支持女性投票權，並開設一間照顧年老與貧困非裔美國人的安養之家。她經濟拮据，多年爭取政府為她的服役發放撫卹金。她於 1913 年過世，被尊為美國最偉大的英雄之一。"],
chars:["逃離奴隸制並帶領他人走向自由；偵察兵、間諜、社運人士。","Harriet 的父母，都是奴隸；Rit 努力讓孩子們留在身邊。","Harriet 的第一任丈夫，自由黑人。","費城的黑人廢奴主義者，記錄了逃亡者的故事。","德拉瓦州的貴格會廢奴人士，曾幫助 Tubman。","激進的廢奴主義者，欽佩 Tubman。","南北戰爭退伍軍人，Tubman 的第二任丈夫。"],
themes:["Tubman 一次又一次冒著被捕和死亡的危險，帶領他人走向自由。","她的救援行動源於對家人的愛，而奴隸制企圖拆散她的家庭。","Tubman 深厚的宗教信仰指引並支撐著她。","Larson 把 Tubman 真正的成就與誇大的說法分開，顯示真相本身就已足夠令人敬佩。","Tubman 透過逃亡、救援、參戰與社運反抗奴隸制。"],
syms:["逃亡者的方向、自由與希望。","Tubman 是帶領族人脫離奴役的領袖。","北方與加拿大的自由，呼應聖經《出埃及記》的故事。","用來表達信仰、尋求安慰與傳遞秘密訊號的歌曲。"],
devs:["Larson 運用書信、紀錄和報紙等第一手資料。","本書從 Tubman 的出生寫到過世。","Larson 討論史料彼此矛盾之處，以及哪些可以被證明。","她把 Tubman 的一生放在奴隸制與南北戰爭的大歷史中。","她修正傳說，呈現更準確、更有人性的畫像。"],
ct:[{q:"為什麼 Harriet Tubman 身上會產生許多神話？",claim:"說明傳說的來源。",ev:"Larson 對誇大數字的討論；早期的傳記；Tubman 自己說的故事。",rs:"想一想人們為什麼需要一位英雄人物。",cc:"神話對她的記憶是傷害還是幫助？",m:"參考論點：神話之所以產生，是因為 Tubman 的故事太有力量，但真實紀錄顯示，她真正的勇氣不需要誇大。"},
{q:"Tubman 的勇氣從何而來？",claim:"找出主要來源。",ev:"她的信仰與幻象；她的家人；她經歷的殘酷。",rs:"說明這些力量如何共同作用。",cc:"她的勇氣是否部分來自受傷後的幻象？",m:"參考論點：Tubman 的勇氣來自信仰與對家人的愛，讓冒險變得值得。"},
{q:"Combahee 河突襲是 Tubman 最偉大的成就嗎？",claim:"評價她的成就。",ev:"她的地下鐵路之行；突襲行動；她後來的社運。",rs:"比較規模、風險與影響。",cc:"為成就排名公平嗎？",m:"參考論點：突襲一次解放最多人，但她獨自進行的救援展現另一種勇氣：為每一個人押上一切。"},
