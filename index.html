title:"Hamlet",author:"William Shakespeare · c. 1600",blurb:"Revenge, doubt, action vs. thought",cite:"act.scene.line, e.g., (3.1.64)",
bg:["A tragedy written around 1599–1601 and Shakespeare’s longest play. It is set in the royal castle of Elsinore, Denmark, and is based on a Scandinavian legend of a prince named Amleth, probably by way of an earlier play that has been lost.",
"Prince Hamlet returns from university in Wittenberg for his father’s funeral and finds that his uncle Claudius has become king and married his mother, Gertrude, less than two months after the death.",
"The play is in the public domain, so you may quote it directly. Three early printed versions (the First Quarto, Second Quarto and First Folio) differ, so line numbers vary between editions."],
sum:[["Act 1","On the castle walls, guards and Hamlet’s friend Horatio see the ghost of the dead King Hamlet. King Claudius sends ambassadors to stop a threatened invasion by young Fortinbras of Norway and urges Hamlet to stop mourning. Polonius, the king’s adviser, and his son Laertes warn Ophelia to keep away from Hamlet. The Ghost tells Hamlet that Claudius murdered him by pouring poison into his ear and demands revenge. Hamlet swears his friends to secrecy and warns that he may pretend to be mad."],
["Act 2","Hamlet begins to act strangely, and Polonius decides he is mad with love for Ophelia. Claudius and Gertrude summon Hamlet’s school friends Rosencrantz and Guildenstern to spy on him. A troupe of actors arrives, and Hamlet plans to have them perform a play that mirrors his father’s murder so he can watch Claudius’s reaction."],
["Act 3","Hamlet considers whether ‘to be, or not to be,’ then rejects Ophelia harshly while Claudius and Polonius secretly watch. During the play, Claudius rises and rushes out, which convinces Hamlet of his guilt. Hamlet finds Claudius praying alone but does not kill him, fearing he would send his soul to heaven. In Gertrude’s room, Hamlet confronts his mother, hears someone behind a curtain and stabs through it, killing Polonius. The Ghost appears to remind Hamlet of his purpose."],
["Act 4","Claudius sends Hamlet to England with Rosencrantz and Guildenstern, who carry secret orders for his execution. On the way, Hamlet sees Fortinbras’s army marching to fight over a worthless piece of land and resolves to act. Ophelia, grieving her father, goes mad. Laertes returns in fury, and Claudius persuades him to kill Hamlet in a fencing match with a poisoned sword, with poisoned wine as a backup. Gertrude reports that Ophelia has drowned."],
["Act 5","Hamlet returns after escaping with the help of pirates and reveals that he arranged for Rosencrantz and Guildenstern to be executed instead. In a graveyard he holds the skull of Yorick, the old court jester, and reflects on death, then struggles with Laertes at Ophelia’s funeral. During the fencing match, Gertrude drinks the poisoned wine and dies. Laertes wounds Hamlet with the poisoned blade; in the struggle the swords are exchanged, and Laertes is wounded too. Dying, Laertes reveals the plot. Hamlet kills Claudius and dies in Horatio’s arms. Fortinbras arrives and claims the throne of Denmark."]],
chars:[["Hamlet","Prince of Denmark; brilliant, grieving and indecisive."],["Claudius","Hamlet’s uncle; murdered his brother to become king."],["Gertrude","Hamlet’s mother; quickly marries Claudius."],["The Ghost","The spirit of Hamlet’s father; demands revenge."],["Polonius","The king’s talkative, scheming adviser."],["Ophelia","Polonius’s daughter; loved by Hamlet; goes mad with grief."],["Laertes","Polonius’s son; a foil who acts on revenge without hesitation."],["Horatio","Hamlet’s loyal friend; survives to tell the story."],["Rosencrantz and Guildenstern","School friends who spy on Hamlet for the king."],["Fortinbras","Prince of Norway; a man of action and another foil."],["The Gravedigger","A witty commoner who jokes about death."]],
themes:[["Revenge","Hamlet, Laertes and Fortinbras all seek to avenge their fathers, and their different responses drive the plot."],
["Action vs. inaction","Hamlet thinks deeply about every choice, and his delay raises the question of whether thought prevents action."],
["Madness","Hamlet pretends to be mad, Ophelia truly loses her mind, and the line between the two is never fully clear."],
["Death and mortality","From the Ghost to Yorick’s skull, the play keeps returning to what death means and what comes after it."],
["Corruption and decay","Claudius’s crime poisons the whole state; Denmark is described as diseased and rotting."],
["Appearance vs. reality","Characters spy, pretend and perform, so no one can be sure what is real."]],
syms:[["Yorick’s skull","The equality of all people in death; the jester and the king end the same way."],
["Poison","Claudius’s secret crime and the corruption that spreads through Denmark."],
["The play within the play","Art used as a trap to reveal the truth; Hamlet calls it ‘The Mousetrap.’"],
["Ophelia’s flowers","In her madness she gives away flowers whose traditional meanings comment on the court."],
["The unweeded garden","Hamlet’s image of a world overgrown with corruption."]],
devs:[["Soliloquy","Hamlet’s seven major soliloquies let the audience into his doubts, anger and reasoning."],
["Play within a play","‘The Mousetrap’ mirrors the murder and tests Claudius."],
["Dramatic irony","The audience knows Claudius is guilty and knows of the poisoned cup before the characters do."],
["Foil characters","Laertes and Fortinbras act quickly on revenge, highlighting Hamlet’s delay."],
["Wordplay","Hamlet’s puns and riddles let him mock others while hiding his true thoughts."],
["Imagery of disease","Images of rot, poison and sickness show how corruption spreads."]],
ct:[{q:"Why does Hamlet delay his revenge?",claim:"Offer the main reason for his delay and defend it.",ev:"1.5 (the Ghost’s command), 2.2 (Hamlet doubts the Ghost), 3.1 (‘To be, or not to be’), 3.3 (Claudius at prayer), 4.4 (Fortinbras’s army).",rs:"Consider doubt, conscience, fear and the habit of overthinking.",cc:"Some critics argue Hamlet does not really delay: he must first prove Claudius’s guilt. Respond.",m:"Model claim: Hamlet delays because his mind turns every action into a question; the play suggests that thinking too precisely can paralyze the will."},
{q:"Is Hamlet’s madness real or pretended?",claim:"Take a position and support it.",ev:"1.5 (he plans to act strangely), 2.2 (with Polonius), 3.1 (with Ophelia), 3.4 (killing Polonius), 5.2 (his apology to Laertes).",rs:"Look for moments when his ‘madness’ seems controlled and moments when it seems real.",cc:"Could he be both — pretending at first, then pushed into real instability?",m:"Model claim: Hamlet begins by pretending, but grief and pressure blur the line, so that his act becomes partly real."},
{q:"Is Gertrude guilty?",claim:"Decide what Gertrude knew and how responsible she is.",ev:"1.2 (the hasty marriage), 3.4 (the closet scene), 4.7 (Ophelia’s death), 5.2 (the poisoned cup).",rs:"Separate guilt of the murder from guilt of moral weakness.",cc:"The play never shows her knowing about the murder. Is it fair to blame her?",m:"Model claim: Gertrude seems innocent of the murder but guilty of choosing comfort and power without asking questions."},
{q:"How does the play portray Ophelia and Gertrude?",claim:"Argue what the two women reveal about power and gender in the play.",ev:"1.3 (Ophelia obeys her father), 3.1 (Hamlet rejects her), 4.5 (her madness), 3.4 (Gertrude and Hamlet).",rs:"Consider how men control the women’s choices and voices.",cc:"Does Ophelia’s madness give her a kind of voice she lacked before?",m:"Model claim: Both women are controlled by the men around them, and Ophelia’s madness shows the cost of having no voice in a corrupt court."},
{q:"Does the ending restore order to Denmark?",claim:"Evaluate the final scene.",ev:"5.2 (the deaths, Hamlet’s last words and Fortinbras’s arrival), 1.1 (the threat from Norway).",rs:"Consider who is left to rule and what has been lost.",cc:"Is a foreign prince taking the throne a restoration or a defeat?",m:"Model claim: The ending removes the corruption but leaves Denmark ruled by a foreign prince, so order returns only at the cost of the royal family itself."},
{q:"Cross-text: Compare Hamlet with Macbeth.",claim:"Argue what the two heroes reveal about thought and action.",ev:"Hamlet 3.1 and 3.3; Macbeth 1.7 and 2.1.",rs:"Compare how each hero thinks before acting and what results.",cc:"Both plays end in death. Is either hero’s approach better?",m:"Model claim: Macbeth acts too quickly on a wicked desire and Hamlet thinks too long about a just one; together they show that tragedy can come from either extreme."}],
kz:{"Revenge":"復仇","Action vs. inaction":"行動與不行動","Madness":"瘋狂","Death and mortality":"死亡與人生無常","Corruption and decay":"腐敗與衰朽","Yorick’s skull":"Yorick 的頭骨","Poison":"毒藥","The play within the play":"劇中劇","Ophelia’s flowers":"Ophelia 的花","The unweeded garden":"雜草叢生的花園","Play within a play":"劇中劇手法","Wordplay":"文字遊戲","Imagery of disease":"疾病意象"},
zh:{bg:["約寫於 1599–1601 年的悲劇，也是莎士比亞最長的劇作。故事發生在丹麥的 Elsinore 王宮，取材自一則關於王子 Amleth 的斯堪地那維亞傳說，很可能是透過一部已經失傳的早期劇作改編而來。",
"Hamlet 王子從 Wittenberg 的大學回國參加父親的葬禮，卻發現叔叔 Claudius 已經登上王位，並且在父親死後不到兩個月就娶了他的母親 Gertrude。",
"本劇屬於公共領域，可以直接引用原文。三個早期印刷版本（第一四開本、第二四開本和第一對開本）內容不同，因此各版本的行數也不一樣。"],
sum:["在城牆上，守衛和 Hamlet 的朋友 Horatio 看見已故 Hamlet 國王的鬼魂。Claudius 國王派使節去阻止挪威年輕王子 Fortinbras 的入侵威脅，並勸 Hamlet 別再哀悼。國王的顧問 Polonius 和他的兒子 Laertes 警告 Ophelia 遠離 Hamlet。鬼魂告訴 Hamlet，Claudius 把毒藥倒進他的耳朵謀殺了他，並要求 Hamlet 復仇。Hamlet 要朋友們發誓保密，並警告他們自己可能會裝瘋。",
"Hamlet 開始舉止怪異，Polonius 認定他是為了愛 Ophelia 而發瘋。Claudius 和 Gertrude 召來 Hamlet 的同學 Rosencrantz 和 Guildenstern 監視他。一個劇團來到王宮，Hamlet 計畫讓他們演出一齣與父親被謀殺情節相似的戲，好觀察 Claudius 的反應。",
"Hamlet 思索「生存還是毀滅」，接著在 Claudius 和 Polonius 暗中監視下，冷酷地拒絕了 Ophelia。演戲時，Claudius 起身衝了出去，讓 Hamlet 確信他有罪。Hamlet 發現 Claudius 獨自禱告，卻沒有殺他，因為擔心這樣會把他的靈魂送上天堂。在 Gertrude 的房間裡，Hamlet 質問母親，聽到簾子後面有人，便隔著簾子刺去，殺死了 Polonius。鬼魂現身，提醒 Hamlet 不要忘記他的任務。",
"Claudius 派 Hamlet 和 Rosencrantz、Guildenstern 前往英格蘭，兩人身上帶著處死他的秘密命令。途中，Hamlet 看見 Fortinbras 的軍隊為了一塊毫無價值的土地出征，於是下定決心行動。痛失父親的 Ophelia 發瘋了。Laertes 怒氣沖沖地回國，Claudius 說服他在一場擊劍比賽中用塗了毒的劍殺死 Hamlet，並準備毒酒作為後備。Gertrude 傳來 Ophelia 溺死的消息。",
"Hamlet 在海盜的幫助下逃脫回國，並透露他已設法讓 Rosencrantz 和 Guildenstern 代替自己被處死。在墓地裡，他捧著老宮廷弄臣 Yorick 的頭骨思索死亡，之後在 Ophelia 的葬禮上與 Laertes 扭打。擊劍比賽中，Gertrude 喝下毒酒死去。Laertes 用毒劍刺傷 Hamlet；打鬥中兩人的劍互換，Laertes 也被刺傷。臨死前，Laertes 揭露了陰謀。Hamlet 殺死 Claudius，在 Horatio 懷中死去。Fortinbras 抵達，接掌了丹麥的王位。"],
chars:["丹麥王子；聰明、悲痛又優柔寡斷。","Hamlet 的叔叔；謀殺兄長而登上王位。","Hamlet 的母親；很快就嫁給了 Claudius。","Hamlet 父親的靈魂；要求復仇。","國王多話又愛耍心機的顧問。","Polonius 的女兒；被 Hamlet 所愛；因悲傷而發瘋。","Polonius 的兒子；毫不猶豫地復仇，是 Hamlet 的對照角色。","Hamlet 忠實的朋友；活下來講述這個故事。","替國王監視 Hamlet 的同學。","挪威王子；行動派，也是另一個對照角色。","拿死亡開玩笑、機智的平民。"],
themes:["Hamlet、Laertes 和 Fortinbras 都想為父親復仇，他們不同的反應推動了劇情。","Hamlet 對每個選擇都深思熟慮，他的遲疑引出一個問題：思考是否會阻礙行動？","Hamlet 裝瘋，Ophelia 真的失去理智，而兩者之間的界線始終不完全清楚。","從鬼魂到 Yorick 的頭骨，這部劇不斷回到死亡的意義，以及死後會發生什麼。","Claudius 的罪行毒害了整個國家；丹麥被形容為病態而腐爛。","角色們互相監視、假裝與表演，因此沒有人能確定什麼才是真的。"],
syms:["人人在死亡面前平等；弄臣和國王最後的下場都一樣。","Claudius 的秘密罪行，以及蔓延整個丹麥的腐敗。","把藝術當作揭露真相的陷阱；Hamlet 稱它為「捕鼠器」。","發瘋的 Ophelia 分送花朵，這些花的傳統寓意暗中評論了宮廷。","Hamlet 用來形容一個被腐敗佔滿的世界的意象。"],
devs:["Hamlet 的七段主要獨白，讓觀眾進入他的懷疑、憤怒與推理。","「捕鼠器」重現了謀殺情節，用來試探 Claudius。","觀眾比角色們更早知道 Claudius 有罪，也知道毒酒的存在。","Laertes 和 Fortinbras 迅速採取復仇行動，凸顯出 Hamlet 的遲疑。","Hamlet 的雙關語和謎語讓他能一邊嘲弄別人，一邊隱藏真實的想法。","腐爛、毒藥和疾病的意象，呈現出腐敗如何蔓延。"],
ct:[{q:"Hamlet 為什麼遲遲不復仇？",claim:"提出他遲疑的主要原因並為之辯護。",ev:"1.5（鬼魂的命令）、2.2（Hamlet 懷疑鬼魂）、3.1（「生存還是毀滅」）、3.3（禱告中的 Claudius）、4.4（Fortinbras 的軍隊）。",rs:"想一想懷疑、良心、恐懼，以及想太多的習慣。",cc:"有些評論家認為 Hamlet 並沒有真的拖延：他必須先證明 Claudius 有罪。請回應這個觀點。",m:"參考論點：Hamlet 之所以遲疑，是因為他的頭腦把每個行動都變成了問題；這部劇暗示，想得太精細可能會讓意志癱瘓。"},
{q:"Hamlet 的瘋狂是真的，還是裝的？",claim:"表明立場並提出支持。",ev:"1.5（他計畫裝瘋）、2.2（與 Polonius）、3.1（與 Ophelia）、3.4（殺死 Polonius）、5.2（他向 Laertes 道歉）。",rs:"找出他的「瘋狂」看似受到控制的時刻，以及看似真實的時刻。",cc:"他是否兩者皆是：起初是裝的，後來被逼到真正失控？",m:"參考論點：Hamlet 一開始是裝的，但悲痛與壓力模糊了界線，使他的表演有一部分變成了真的。"},
{q:"Gertrude 有罪嗎？",claim:"判斷 Gertrude 知道多少，以及她該負多少責任。",ev:"1.2（倉促的婚姻）、3.4（寢宮一場）、4.7（Ophelia 之死）、5.2（毒酒）。",rs:"區分謀殺的罪責，以及道德軟弱的罪責。",cc:"劇中從未顯示她知道謀殺的事。責怪她公平嗎？",m:"參考論點：Gertrude 似乎與謀殺無關，但她選擇了舒適與權力而不去追問，這是她的過錯。"},
{q:"這部劇如何描寫 Ophelia 和 Gertrude？",claim:"論證這兩位女性揭示了劇中的權力與性別問題。",ev:"1.3（Ophelia 順從父親）、3.1（Hamlet 拒絕她）、4.5（她的瘋狂）、3.4（Gertrude 與 Hamlet）。",rs:"想一想男人們如何控制這兩位女性的選擇與聲音。",cc:"Ophelia 的瘋狂是否給了她以前所沒有的某種聲音？",m:"參考論點：兩位女性都受到身邊男人的控制，而 Ophelia 的瘋狂顯示，在腐敗的宮廷中沒有聲音要付出什麼代價。"},
{q:"結局讓丹麥恢復秩序了嗎？",claim:"評估最後一場戲。",ev:"5.2（眾人之死、Hamlet 的遺言與 Fortinbras 的到來）、1.1（來自挪威的威脅）。",rs:"想一想誰留下來統治，以及失去了什麼。",cc:"由一位外國王子登上王位，是恢復秩序還是一場失敗？",m:"參考論點：結局清除了腐敗，卻讓丹麥落入外國王子手中，因此秩序的恢復是以整個王室的覆滅為代價。"},
{q:"跨文本：比較 Hamlet 與 Macbeth。",claim:"論證兩位主角對思考與行動有何揭示。",ev:"《Hamlet》3.1 和 3.3；《Macbeth》1.7 和 2.1。",rs:"比較兩位主角在行動前如何思考，以及結果如何。",cc:"兩部劇都以死亡作結。哪一位主角的做法比較好？",m:"參考論點：Macbeth 對邪惡的慾望行動得太快，Hamlet 對正當的目標想得太久；兩部劇一起顯示，悲劇可能來自任何一個極端。"}]}};

const ORWELL={
title:"1984",author:"George Orwell · 1949",blurb:"Surveillance, truth, power",cite:"author and page, e.g., (Orwell 81)",
bg:["George Orwell’s dystopian novel, published in 1949, shortly before his death in 1950. Orwell had fought fascists in the Spanish Civil War and watched the rise of totalitarian states under Hitler and Stalin, and the novel warns about where such power could lead.",
"In 1984, Britain has become ‘Airstrip One,’ a province of the superstate Oceania. The Party, led by the face of ‘Big Brother,’ watches citizens through telescreens, rewrites history, controls language through ‘Newspeak’ and punishes even forbidden thoughts.",
"The novel is still under copyright in the United States, so quote only short passages. Words it introduced, such as ‘Big Brother,’ ‘doublethink’ and ‘Orwellian,’ are now part of everyday English. Content note: Part Three includes scenes of torture."],
sum:[["Part 1 · The diary","Winston Smith, a thirty-nine-year-old Outer Party member, works at the Ministry of Truth rewriting old newspapers so that the past always agrees with the Party. In a corner of his apartment hidden from the telescreen, he begins a diary — a crime punishable by death. He joins the daily Two Minutes Hate against the enemy Emmanuel Goldstein, notices a dark-haired young woman he distrusts and senses that the Inner Party member O’Brien might secretly share his doubts. He wanders into the poor districts of the ‘proles,’ buys a glass paperweight from Mr. Charrington’s junk shop and wonders whether the past was ever different. The dark-haired woman slips him a note that says she loves him."],
["Part 2 · Love and rebellion","The woman, Julia, meets Winston in the countryside, and they begin a secret affair, later meeting in a room above Mr. Charrington’s shop that seems free of telescreens. Winston’s friend Syme, an expert on Newspeak, quietly disappears. O’Brien invites Winston and Julia to his apartment, claims to belong to a secret resistance called the Brotherhood and gives Winston a copy of Goldstein’s forbidden book, which explains how the Party keeps power through permanent war and controlled poverty. Soon after, soldiers burst into their room: a telescreen was hidden behind a picture, and Mr. Charrington is a member of the Thought Police."],
["Part 3 · The Ministry of Love","In the Ministry of Love, Winston is starved, beaten and interrogated by O’Brien, who reveals that he has been watching Winston for years. O’Brien uses pain to force Winston to believe that two plus two can equal five if the Party says so. Finally, in Room 101, Winston faces his worst fear — rats — and begs that the punishment be given to Julia instead. Released, he meets Julia; each admits to betraying the other, and they feel nothing. Sitting in the Chestnut Tree Café, Winston hears news of a victory and realizes that he loves Big Brother."]],
chars:[["Winston Smith","An Outer Party worker who secretly rebels."],["Julia","A young woman who rebels through private pleasure and love."],["O’Brien","An Inner Party member who pretends to be a rebel."],["Big Brother","The face of the Party; may not exist as a real person."],["Emmanuel Goldstein","The Party’s official enemy; may also be invented."],["Mr. Charrington","A kindly shopkeeper who is secretly Thought Police."],["Syme","A brilliant expert on Newspeak who is ‘vaporized.’"],["Parsons","Winston’s loyal, foolish neighbor, turned in by his own child."]],
themes:[["Totalitarian control","The Party controls not only actions but thoughts, memories and emotions."],
["Truth and history","By rewriting the past, the Party controls the present and the future."],
["Language and thought","Newspeak removes words so that rebellious ideas become impossible to express — and, eventually, to think."],
["Surveillance and privacy","Telescreens, spies and informers destroy any private space, even within families."],
["Love as rebellion","Winston and Julia’s relationship is an act of resistance, because the Party wants all loyalty for itself."]],
syms:[["Big Brother","The all-seeing power of the Party."],
["The glass paperweight","The beautiful, fragile past and Winston’s private world; it shatters at the arrest."],
["Telescreens","Constant surveillance and propaganda."],
["The Golden Country","Winston’s dream landscape of freedom and natural beauty."],
["Room 101","The place where each prisoner faces their worst fear; the Party’s total power over the mind."]],
devs:[["Dystopian setting","A future society used to warn readers about dangers in their own time."],
["Invented language","Words such as Newspeak, doublethink and thoughtcrime make the Party’s system vivid."],
["Third-person limited point of view","We see only what Winston sees and thinks, so we are deceived along with him."],
["Irony","The Ministry of Truth spreads lies, the Ministry of Peace makes war and the Ministry of Love tortures."],
["The appendix","A final essay about Newspeak written in the past tense, which some readers see as a hint that the Party eventually fell."]],
ct:[{q:"Is there any hope in 1984?",claim:"Decide whether the novel offers any hope.",ev:"Part 1 (Winston’s belief in the proles), Part 2 (Julia, the prole woman singing), Part 3 (the ending), and the Appendix.",rs:"Weigh the ending against the hints that resistance and memory might survive.",cc:"If Winston is completely broken, can the novel still be hopeful?",m:"Model claim: The story itself ends without hope, but by writing it as a warning, Orwell suggests that readers can still prevent such a world."},
{q:"How does controlling language control thought?",claim:"Explain the purpose of Newspeak.",ev:"Part 1 (Syme explains Newspeak), Part 2 (Goldstein’s book), the Appendix.",rs:"Explain how removing words limits what people can imagine.",cc:"Can people think thoughts they have no words for?",m:"Model claim: Newspeak aims to make rebellion unthinkable by removing the words needed to express it, showing that freedom depends on language."},
{q:"Why does Winston and Julia’s love fail?",claim:"Explain what their defeat reveals about the Party’s power.",ev:"Part 2 (their promises to each other), Part 3 (Room 101 and their final meeting).",rs:"Consider how the Party uses fear to destroy even private loyalty.",cc:"Was their love real, or only a form of rebellion?",m:"Model claim: Their love fails because the Party can turn the body’s fear against the heart, proving that total power leaves nothing private."},
{q:"Which of the Party’s tools is most dangerous in today’s world?",claim:"Choose one tool — surveillance, rewriting history, propaganda or controlled language — and connect it to today.",ev:"The novel, plus one recent, reliable article about surveillance, misinformation or censorship.",rs:"Explain how the tool works in the novel and how a similar tool works today.",cc:"Modern democracies have laws and courts that Oceania lacks. Does that change the danger?",m:"Model claim: Rewriting the truth is the most dangerous tool, because people who cannot agree on facts cannot defend their freedom."},
{q:"Why does O’Brien insist that two plus two equals five?",claim:"Explain what this demand reveals about power.",ev:"Part 1 (Winston writes that freedom is being able to say two plus two make four), Part 3 (the interrogation).",rs:"Consider why the Party wants control over reality itself, not just obedience.",cc:"If Winston only pretends to believe it, has the Party really won?",m:"Model claim: The Party demands belief in an obvious falsehood because power is proven most completely when it can define reality itself."},
{q:"Cross-text: Compare 1984 with Fahrenheit 451.",claim:"Argue how the two dystopias control people differently.",ev:"1984 Part 1 and Part 3; Fahrenheit 451 Part 1 (Beatty’s speech) and Part 3.",rs:"Compare control through fear with control through pleasure and distraction.",cc:"Which society seems closer to our own world today?",m:"Model claim: Orwell’s Party rules through fear and pain, while Bradbury’s society rules through pleasure and distraction, warning that freedom can be lost either way."}],
kz:{"Totalitarian control":"極權控制","Truth and history":"真相與歷史","Language and thought":"語言與思想","Surveillance and privacy":"監視與隱私","Love as rebellion":"愛作為反抗","Big Brother":"老大哥","The glass paperweight":"玻璃紙鎮","Telescreens":"電幕","The Golden Country":"黃金鄉","Room 101":"101 號房","Invented language":"自創語言","Third-person limited point of view":"第三人稱有限視角","The appendix":"附錄"},
zh:{bg:["George Orwell 的反烏托邦小說，1949 年出版，不久後他便於 1950 年去世。Orwell 曾在西班牙內戰中與法西斯作戰，也目睹了 Hitler 和 Stalin 統治下極權國家的崛起；這部小說警告世人，這樣的權力可能把世界帶往何處。",
"在《1984》中，英國已變成超級大國 Oceania 的一個省份「一號空降場」。由「老大哥」這張臉代表的黨，透過電幕監視人民、改寫歷史、用「新語」控制語言，甚至懲罰被禁止的想法。",
"這部小說在美國仍受版權保護，因此只能引用短句。書中創造的詞彙，例如 Big Brother、doublethink 和 Orwellian，如今已成為日常英語的一部分。內容提醒：第三部有酷刑的情節。"],
sum:["三十九歲的外黨黨員 Winston Smith 在真理部工作，負責改寫舊報紙，讓過去永遠與黨的說法一致。他在公寓裡一個電幕看不到的角落開始寫日記，這是可判死刑的罪行。他參加每天針對敵人 Emmanuel Goldstein 的「兩分鐘仇恨」，注意到一個讓他不信任的黑髮年輕女子，並感覺內黨黨員 O’Brien 可能暗中和他有同樣的懷疑。他走進「無產者」的貧民區，在 Charrington 先生的舊貨店買了一個玻璃紙鎮，心想過去是否真的曾經不一樣。那名黑髮女子偷偷塞給他一張紙條，上面寫著她愛他。",
"那名女子 Julia 與 Winston 在鄉間見面，兩人開始一段秘密戀情，後來在 Charrington 先生店樓上一個似乎沒有電幕的房間幽會。Winston 的朋友、新語專家 Syme 悄悄消失了。O’Brien 邀請 Winston 和 Julia 到他的公寓，聲稱自己屬於一個叫「兄弟會」的秘密抵抗組織，並給 Winston 一本 Goldstein 的禁書，書中解釋黨如何透過永久的戰爭與刻意維持的貧窮來保住權力。不久後，士兵闖進他們的房間：一面電幕就藏在一幅畫後面，而 Charrington 先生是思想警察。",
"在友愛部裡，Winston 遭到挨餓、毆打，並被 O’Brien 審問；O’Brien 透露他已經監視 Winston 好幾年了。O’Brien 用痛苦逼迫 Winston 相信，只要黨這麼說，二加二就可以等於五。最後，在 101 號房，Winston 面對他最深的恐懼——老鼠——並哀求把懲罰轉給 Julia。獲釋後，他遇見 Julia；兩人都承認背叛了對方，卻毫無感覺。坐在栗樹咖啡館裡，Winston 聽到一則勝利的消息，意識到自己愛著老大哥。"],
chars:["暗中反抗的外黨工作人員。","透過私人的快樂與愛情來反抗的年輕女子。","假裝是反抗者的內黨黨員。","黨的代表面孔；可能並不是一個真實存在的人。","黨官方認定的敵人；也可能是捏造出來的。","和藹的店主，其實是思想警察。","聰明的新語專家，後來被「蒸發」了。","Winston 忠誠又愚蠢的鄰居，被自己的孩子告發。"],
themes:["黨控制的不只是行為，還有思想、記憶與情感。","透過改寫過去，黨控制了現在與未來。","新語刪除詞彙，讓反叛的想法無法被表達，最後甚至無法被想到。","電幕、間諜和告密者摧毀了所有私人空間，連家庭內部也不例外。","Winston 和 Julia 的關係本身就是一種反抗，因為黨要獨佔所有的忠誠。"],
syms:["黨無所不見的權力。","美麗而脆弱的過去，以及 Winston 的私人世界；在被捕時被打碎了。","無時無刻的監視與宣傳。","Winston 夢中自由與自然之美的風景。","每個囚犯面對自己最深恐懼的地方；象徵黨對心靈的完全控制。"],
devs:["一個用來警告讀者當代危險的未來社會。","新語、雙重思想、思想罪等詞彙，讓黨的體制顯得具體鮮明。","我們只看到 Winston 所見所想，因此也和他一起被欺騙。","真理部散播謊言，和平部發動戰爭，友愛部施行酷刑。","書末一篇以過去式寫成、關於新語的文章，有些讀者認為這暗示了黨最終垮台。"],
ct:[{q:"《1984》裡有任何希望嗎？",claim:"判斷這部小說是否提供了任何希望。",ev:"第一部（Winston 對無產者的信念）、第二部（Julia、唱歌的無產者婦女）、第三部（結局），以及附錄。",rs:"權衡結局，以及那些暗示反抗與記憶可能留存下來的線索。",cc:"如果 Winston 被徹底擊垮了，這部小說還能算是有希望嗎？",m:"參考論點：故事本身以絕望作結，但 Orwell 把它寫成一則警告，暗示讀者仍有機會阻止這樣的世界出現。"},
{q:"控制語言如何控制思想？",claim:"說明新語的目的。",ev:"第一部（Syme 解釋新語）、第二部（Goldstein 的書）、附錄。",rs:"說明刪除詞彙如何限制人們能想像的事物。",cc:"人能想出沒有詞彙可以表達的想法嗎？",m:"參考論點：新語刪除了表達反叛所需的詞彙，企圖讓反叛變得無法想像，顯示自由仰賴語言。"},
{q:"為什麼 Winston 和 Julia 的愛情失敗了？",claim:"說明他們的失敗揭示了黨的什麼權力。",ev:"第二部（他們對彼此的承諾）、第三部（101 號房與他們最後的見面）。",rs:"想一想黨如何利用恐懼，連私人的忠誠也一併摧毀。",cc:"他們的愛是真的，還是只是一種反抗的形式？",m:"參考論點：他們的愛失敗了，因為黨能讓身體的恐懼反過來對付內心，證明絕對的權力不會留下任何私人空間。"},
{q:"黨的哪一種工具在今天的世界最危險？",claim:"選一種工具（監視、改寫歷史、宣傳或控制語言），並把它和今天連結起來。",ev:"小說本身，加上一篇關於監視、假訊息或審查的近期可靠文章。",rs:"說明這種工具在小說中如何運作，以及今天類似的工具如何運作。",cc:"現代民主國家有 Oceania 所沒有的法律與法院。這會改變危險的程度嗎？",m:"參考論點：改寫真相是最危險的工具，因為無法對事實達成共識的人，就無法捍衛自己的自由。"},
{q:"為什麼 O’Brien 堅持二加二等於五？",claim:"說明這項要求揭示了權力的什麼本質。",ev:"第一部（Winston 寫下自由就是能說二加二等於四）、第三部（審問）。",rs:"想一想，為什麼黨要的不只是服從，而是控制現實本身。",cc:"如果 Winston 只是假裝相信，黨真的贏了嗎？",m:"參考論點：黨要求人相信一個明顯的謊言，因為當權力能定義現實本身時，它才得到最徹底的證明。"},
{q:"跨文本：比較《1984》與《Fahrenheit 451》。",claim:"論證這兩個反烏托邦如何以不同方式控制人民。",ev:"《1984》第一部與第三部；《Fahrenheit 451》第 1 部（Beatty 的演說）與第 3 部。",rs:"比較透過恐懼的控制，以及透過享樂與分心的控制。",cc:"哪一個社會看起來更接近我們今天的世界？",m:"參考論點：Orwell 的黨用恐懼與痛苦統治，Bradbury 的社會則用享樂與分心統治，警告我們：自由可能從任何一條路上失去。"}]}};

const FRANK={
title:"Frankenstein",author:"Mary Shelley · 1818",blurb:"Creation, responsibility, isolation",cite:"author and page, e.g., (Shelley 37)",
bg:["Mary Shelley began the novel in 1816, at age eighteen, during a ghost-story contest with the poets Lord Byron and Percy Shelley near Lake Geneva. It was published anonymously in 1818 and revised in 1831; the subtitle is The Modern Prometheus.",
"The novel is often called one of the first works of science fiction. It responds to new experiments with electricity and the body, and to Romantic ideas about nature, imagination and the limits of human knowledge.",
"The novel is in the public domain, so you may quote it freely. Note that ‘Frankenstein’ is the scientist, not the creature, who is never given a name."],
sum:[["Walton’s letters","In letters to his sister, the explorer Robert Walton describes his ambitious voyage toward the North Pole. Trapped in the ice, his crew sees a giant figure crossing on a sled; the next day they rescue a dying man, Victor Frankenstein, who decides to tell Walton his story as a warning."],
["Ch. 1–5 · The creation","Victor grows up in Geneva with his adopted sister Elizabeth and his friend Henry Clerval. After his mother dies, he goes to the University of Ingolstadt, becomes obsessed with discovering the secret of life and, after two years of work, builds a creature from body parts and brings it to life. Horrified by its appearance, he flees and falls ill; Clerval nurses him back to health."],
["Ch. 6–10 · The first deaths","Victor learns that his young brother William has been murdered. A family servant, Justine Moritz, is accused because William’s locket is found in her pocket, and she is executed. Victor suspects the creature but stays silent, overwhelmed by guilt. In the Alps the creature confronts him and asks him to listen to his story."],
["Ch. 11–17 · The creature’s story","The creature describes waking in confusion, being attacked by villagers and hiding in a shed beside a cottage, where he secretly watches the De Lacey family and learns to speak and read. He reads Paradise Lost and Victor’s journal and learns how he was made. When he reveals himself to the blind old De Lacey, the family returns and drives him away in terror. Rejected again and again, he kills William and frames Justine. He demands that Victor create a female companion, promising they will live far from people."],
["Ch. 18–24 · Revenge and pursuit","Victor travels to Britain with Clerval and begins a female creature on a remote Scottish island, but he destroys it, fearing the two might produce a race of monsters. The creature vows revenge, murders Clerval and later kills Elizabeth on her wedding night. Victor’s father dies of grief. Victor chases the creature across Europe into the Arctic, where Walton finds him."],
["Walton’s final letters","Victor dies on Walton’s ship, and Walton agrees to his crew’s demand to turn back. The creature appears beside Victor’s body, mourns his creator and his own crimes, and says he will destroy himself in a fire at the North Pole. He leaps onto an ice raft and disappears into the darkness."]],
chars:[["Victor Frankenstein","An ambitious young scientist who creates life and abandons it."],["The creature","Victor’s nameless creation; intelligent and sensitive, but rejected by everyone."],["Robert Walton","An Arctic explorer whose ambition mirrors Victor’s."],["Elizabeth Lavenza","Victor’s adopted sister and later his wife."],["Henry Clerval","Victor’s loyal, cheerful friend."],["Justine Moritz","A servant wrongly executed for William’s murder."],["William Frankenstein","Victor’s young brother; the creature’s first victim."],["The De Lacey family","A poor family whose kindness to one another the creature longs to share."]],
themes:[["Dangerous knowledge","Victor’s pursuit of forbidden knowledge brings destruction, and Walton must decide whether to make the same mistake."],
["Responsibility of the creator","Victor gives life but refuses to care for what he made, and the novel asks what creators owe their creations."],
["Isolation","Both Victor and the creature end up completely alone, cut off by guilt or by rejection."],
["Nature vs. nurture","The creature says he was born kind and became cruel because of how he was treated."],
["Prejudice based on appearance","People judge the creature by his looks before they hear him speak."]],
syms:[["Light and fire","Knowledge and discovery, like the fire Prometheus stole; they bring both warmth and pain."],
["The Arctic","The cold, empty limit of ambition where the story begins and ends."],
["Paradise Lost","The creature compares himself to both Adam and Satan from Milton’s epic poem."],
["Sublime nature","Mountains, glaciers and storms inspire awe and sometimes calm Victor’s mind."]],
devs:[["Frame narrative","Walton’s letters contain Victor’s story, which contains the creature’s story, like boxes within boxes."],
["Epistolary form","The novel begins and ends with letters, which make it feel like a real document."],
["Gothic elements","Graveyards, laboratories, storms and terror create a dark, suspenseful mood."],
["Allusion","References to Prometheus and Paradise Lost connect the story to myths of creation and rebellion."],
["Doubling","Victor and the creature mirror each other in their isolation, rage and desire for revenge."]],
ct:[{q:"Who is the real monster: Victor or the creature?",claim:"Take a position and support it.",ev:"Ch. 5 (the creation and Victor’s flight), Ch. 8 (Justine’s trial), Ch. 15–16 (the De Laceys and the murder of William), Ch. 20 (the destroyed female), Walton’s final letter.",rs:"Compare each character’s choices and how much responsibility each accepts.",cc:"The creature kills innocent people. Can anything excuse that?",m:"Model claim: The creature commits the murders, but Victor is the true monster, because he created a living being and then denied it all love and responsibility."},
{q:"Is the creature born evil or made evil?",claim:"Argue the novel’s position on nature and nurture.",ev:"Ch. 11 (his first days), Ch. 12–13 (learning from the De Laceys), Ch. 15 (rejection), Ch. 16 (his turn to revenge).",rs:"Trace how the creature changes after each rejection.",cc:"Others in the novel suffer greatly but do not become murderers. Does that weaken his excuse?",m:"Model claim: Shelley suggests that the creature is made evil by repeated rejection, showing how cruelty can create the very monster it fears."},
{q:"Is Victor’s ambition admirable or reckless?",claim:"Evaluate Victor’s pursuit of knowledge.",ev:"Ch. 2–4 (his obsession), Ch. 5 (his horror), Walton’s final letters (Walton turns back).",rs:"Compare Victor’s choices with Walton’s final decision.",cc:"Without ambition like Victor’s, would science ever make great discoveries?",m:"Model claim: Victor’s ambition becomes reckless because he never asks what his discovery will mean for others; Walton’s choice to turn back shows the wisdom Victor lacked."},
{q:"Why does Shelley use three narrators?",claim:"Explain the effect of the nested frame narrative.",ev:"Walton’s opening letters, Ch. 11–16 (the creature’s voice), Walton’s final letters.",rs:"Consider how each narrator changes how we judge the others.",cc:"Since every story passes through Walton, can we trust any of them fully?",m:"Model claim: By letting the creature tell his own story, Shelley forces readers to hear the monster’s side and question Victor’s version of events."},
{q:"What would Frankenstein warn us about modern science and artificial intelligence?",claim:"Connect the novel to one current technology.",ev:"The novel (Ch. 4, Ch. 5 and Ch. 20), plus one recent, reliable article about artificial intelligence, gene editing or another new technology.",rs:"Compare Victor’s responsibilities with the responsibilities of scientists and companies today.",cc:"Is it fair to compare a fictional creature with real technology?",m:"Model claim: Frankenstein warns that the danger lies not in creation itself but in creators who refuse to take responsibility for what they make."},
{q:"Cross-text: Compare Victor Frankenstein with Macbeth.",claim:"Argue what both characters reveal about ambition.",ev:"Frankenstein Ch. 4 and Ch. 24; Macbeth 1.7 and 5.5.",rs:"Compare what each wants, what limits each crosses and what each loses.",cc:"Victor wants knowledge and Macbeth wants power. Are their ambitions really alike?",m:"Model claim: Both men cross a natural boundary to satisfy ambition and end isolated and destroyed, suggesting that ambition without moral limits consumes the one who pursues it."}],
kz:{"Dangerous knowledge":"危險的知識","Responsibility of the creator":"創造者的責任","Isolation":"孤立","Nature vs. nurture":"天性與教養","Prejudice based on appearance":"以貌取人的偏見","Light and fire":"光與火","The Arctic":"北極","Paradise Lost":"《失樂園》","Sublime nature":"崇高的自然","Epistolary form":"書信體","Gothic elements":"哥德元素","Doubling":"雙重角色"},
zh:{bg:["Mary Shelley 在 1816 年、她十八歲時，於日內瓦湖畔和詩人拜倫勳爵及 Percy Shelley 進行的鬼故事比賽中開始寫這部小說。它於 1818 年匿名出版，1831 年修訂；副標題是《現代的普羅米修斯》。",
"這部小說常被稱為最早的科幻作品之一。它回應了當時以電流和人體進行的新實驗，以及浪漫主義對自然、想像力和人類知識極限的思考。",
"本書屬於公共領域，可以自由引用。請注意：「Frankenstein」是科學家的名字，不是怪物的名字，怪物從頭到尾都沒有名字。"],
sum:["探險家 Robert Walton 在寫給姊姊的信中，描述他前往北極的雄心勃勃的航行。船被困在冰中時，船員看見一個巨大的身影坐著雪橇經過；第二天，他們救起一個奄奄一息的人：Victor Frankenstein。Victor 決定把自己的故事告訴 Walton，作為警告。",
"Victor 在日內瓦長大，身邊有被收養的妹妹 Elizabeth 和朋友 Henry Clerval。母親去世後，他到 Ingolstadt 大學念書，沉迷於探索生命的奧秘，經過兩年的努力，他用屍體的部位拼成一個生物，並賦予它生命。他被它的外貌嚇壞了，逃走後病倒；Clerval 照顧他直到康復。",
"Victor 得知年幼的弟弟 William 被謀殺。家中的女僕 Justine Moritz 因為 William 的項鍊盒在她口袋裡被找到而被指控，最後被處死。Victor 懷疑是怪物下的手，卻被罪惡感壓得說不出口。在阿爾卑斯山上，怪物找上他，要求他聽聽自己的故事。",
"怪物描述自己在混亂中醒來、遭到村民攻擊，然後躲在一間小屋旁的棚子裡，偷偷觀察 De Lacey 一家，學會了說話與閱讀。他讀了《失樂園》和 Victor 的日記，得知自己是怎麼被造出來的。當他向雙目失明的老 De Lacey 表明身分時，其他家人回來，驚恐地把他趕走。一再被拒絕之後，他殺了 William 並嫁禍給 Justine。他要求 Victor 為他創造一個女伴，並承諾他們會遠離人群生活。",
"Victor 和 Clerval 前往英國，並在蘇格蘭一座偏遠的島上開始製造女性怪物，但他擔心兩者可能繁衍出一整個怪物種族，於是把它毀了。怪物發誓報復，殺死了 Clerval，後來又在新婚之夜殺死 Elizabeth。Victor 的父親悲傷而死。Victor 追著怪物橫越歐洲，一路追到北極，在那裡被 Walton 發現。",
"Victor 死在 Walton 的船上，Walton 也答應船員的要求掉頭返航。怪物出現在 Victor 的遺體旁，哀悼他的創造者，也為自己的罪行悲嘆，並說他將在北極的火中毀滅自己。他跳上一塊浮冰，消失在黑暗之中。"],
chars:["創造生命後又拋棄它的年輕野心科學家。","Victor 創造出的無名生命；聰明而敏感，卻被所有人拒絕。","北極探險家，他的野心映照出 Victor 的野心。","Victor 被收養的妹妹，後來成為他的妻子。","Victor 忠誠又開朗的朋友。","因 William 被殺而被冤枉處死的女僕。","Victor 的幼弟；怪物的第一個受害者。","一個貧窮的家庭，怪物渴望分享他們彼此之間的溫情。"],
themes:["Victor 追求被禁止的知識而招致毀滅，Walton 則必須決定是否要犯同樣的錯。","Victor 賦予了生命，卻拒絕照顧他所創造的生命；小說提出的問題是：創造者對他的創造物負有什麼責任？","Victor 和怪物最後都完全孤獨，一個被罪惡感隔絕，一個被拒絕隔絕。","怪物說他生來善良，是因為受到的對待才變得殘忍。","人們在聽怪物開口之前，就先以外貌評斷了他。"],
syms:["知識與發現，就像普羅米修斯偷來的火；帶來溫暖，也帶來痛苦。","野心那冰冷而空曠的極限，故事在這裡開始，也在這裡結束。","怪物把自己比作 Milton 史詩中的亞當，也比作撒旦。","高山、冰河和暴風雨令人敬畏，有時也能讓 Victor 的心情平靜下來。"],
devs:["Walton 的信裡包著 Victor 的故事，Victor 的故事裡又包著怪物的故事，就像一層層的盒子。","小說以書信開始，也以書信結束，讓它讀起來像一份真實的文件。","墓地、實驗室、暴風雨與恐懼，營造出陰暗、懸疑的氛圍。","普羅米修斯與《失樂園》的典故，把故事和創造與反叛的神話連結起來。","Victor 和怪物在孤立、憤怒與復仇的慾望上互為鏡像。"],
ct:[{q:"誰才是真正的怪物：Victor 還是他的創造物？",claim:"表明立場並提出支持。",ev:"第 5 章（創造與 Victor 逃走）、第 8 章（Justine 的審判）、第 15–16 章（De Lacey 一家與 William 被殺）、第 20 章（被毀的女性怪物）、Walton 的最後一封信。",rs:"比較兩個角色的選擇，以及各自承擔了多少責任。",cc:"怪物殺害了無辜的人。有什麼理由能為此開脫嗎？",m:"參考論點：殺人的是怪物，但真正的怪物是 Victor，因為他創造了一個生命，卻剝奪了它所有的愛與責任。"},
{q:"怪物是生來邪惡，還是被逼成邪惡？",claim:"論證小說對天性與教養的立場。",ev:"第 11 章（他最初的日子）、第 12–13 章（從 De Lacey 一家學習）、第 15 章（被拒絕）、第 16 章（轉向復仇）。",rs:"追蹤怪物每次被拒絕後如何改變。",cc:"小說中其他人也受了很多苦，卻沒有成為殺人兇手。這會削弱他的理由嗎？",m:"參考論點：Shelley 暗示，怪物是被一再的拒絕逼成邪惡的，顯示殘酷如何製造出它所害怕的怪物。"},
{q:"Victor 的野心值得欽佩，還是魯莽？",claim:"評估 Victor 對知識的追求。",ev:"第 2–4 章（他的沉迷）、第 5 章（他的恐懼）、Walton 最後的信（Walton 決定返航）。",rs:"把 Victor 的選擇和 Walton 最後的決定做比較。",cc:"如果沒有像 Victor 這樣的野心，科學還會有偉大的發現嗎？",m:"參考論點：Victor 的野心之所以變得魯莽，是因為他從未問過他的發現對別人意味著什麼；Walton 選擇返航，正展現了 Victor 所缺乏的智慧。"},
{q:"Shelley 為什麼使用三位敘事者？",claim:"說明層層嵌套的框架敘事有什麼效果。",ev:"Walton 開頭的信、第 11–16 章（怪物的聲音）、Walton 最後的信。",rs:"想一想每位敘事者如何改變我們對其他人的評價。",cc:"既然每個故事都經過 Walton 轉述，我們能完全相信其中任何一個嗎？",m:"參考論點：Shelley 讓怪物講述自己的故事，迫使讀者聽見怪物這一方的說法，並質疑 Victor 的版本。"},
{q:"《Frankenstein》會對現代科學和人工智慧提出什麼警告？",claim:"把小說和一項當今的科技連結起來。",ev:"小說本身（第 4、5、20 章），加上一篇關於人工智慧、基因編輯或其他新科技的近期可靠文章。",rs:"比較 Victor 的責任，以及今天科學家和企業的責任。",cc:"把一個虛構的怪物和真實的科技相比，公平嗎？",m:"參考論點：《Frankenstein》警告，危險不在於創造本身，而在於拒絕為自己的創造物負責的創造者。"},
{q:"跨文本：比較 Victor Frankenstein 與 Macbeth。",claim:"論證兩個角色對野心有何揭示。",ev:"《Frankenstein》第 4 章與第 24 章；《Macbeth》1.7 與 5.5。",rs:"比較兩人各自想要什麼、跨越了什麼界線，以及失去了什麼。",cc:"Victor 想要知識，Macbeth 想要權力。他們的野心真的相似嗎？",m:"參考論點：兩人都為了滿足野心而跨越自然的界線，最後孤立無援、走向毀滅，暗示沒有道德約束的野心會吞噬追求它的人。"}]}};

const TFA={
title:"Things Fall Apart",author:"Chinua Achebe · 1958",blurb:"Colonialism, tradition, identity",cite:"author and page, e.g., (Achebe 52)",
bg:["Chinua Achebe’s first novel, published in 1958, two years before Nigeria’s independence from Britain. It is set among the Igbo people of southeastern Nigeria in the late 1800s, just before and during the arrival of British missionaries and colonial government.",
"Achebe wrote partly to answer European novels, such as Joseph Conrad’s Heart of Darkness, that portrayed Africans as having no history or culture. He shows Igbo society from the inside, with its laws, religion, poetry and politics. The title comes from W. B. Yeats’s 1920 poem ‘The Second Coming.’",
"The novel is one of the most widely read books by an African writer. It is under copyright, so quote only short passages. Content note: the novel includes violence, the killing of a boy and a suicide."],
sum:[["Part 1 · Ch. 1–7 · Okonkwo of Umuofia","Okonkwo is a famous wrestler and warrior in the village of Umuofia. Ashamed of his father, Unoka, a gentle musician who died in debt, Okonkwo fears looking weak and rules his family harshly. Umuofia receives a boy, Ikemefuna, from a neighboring village as compensation for a killing; he lives with Okonkwo’s family for three years and becomes like an older brother to Okonkwo’s son Nwoye. When the Oracle decrees that Ikemefuna must die, an elder warns Okonkwo not to take part, but Okonkwo strikes the final blow himself so as not to appear weak. Nwoye is deeply shaken."],
["Part 1 · Ch. 8–13 · Village life and exile","Okonkwo is troubled after Ikemefuna’s death. His favorite child, his daughter Ezinma, falls ill, and a priestess carries her away at night to the Oracle’s cave while her mother follows in fear. The novel shows weddings, harvests, trials by masked ancestral spirits and folktales. At an elder’s funeral, Okonkwo’s gun accidentally explodes and kills a sixteen-year-old boy. By custom, Okonkwo must leave the clan for seven years; his compound is burned, and he flees with his family to his mother’s village, Mbanta."],
["Part 2 · Ch. 14–19 · Exile in Mbanta","Okonkwo’s uncle Uchendu reminds him that a man belongs to his mother’s land in times of sorrow. News arrives that the village of Abame has been wiped out by white men after its people killed a white man on a bicycle. Christian missionaries arrive in Mbanta and win converts, especially among people the clan has rejected. Nwoye joins them, and Okonkwo disowns him. Okonkwo longs to return and restore his name."],
["Part 3 · Ch. 20–25 · Return and collapse","Okonkwo returns to an Umuofia changed by a church, a colonial court and government messengers. The patient missionary Mr. Brown is replaced by the rigid Reverend Smith. When a zealous convert unmasks an ancestral spirit, the clan burns the church. The District Commissioner tricks six leaders, including Okonkwo, into a meeting, jails and humiliates them, and releases them only after the village pays a fine. At a gathering to decide whether to fight, Okonkwo kills a court messenger, but the others let the remaining messengers escape. Realizing that his people will not go to war, Okonkwo hangs himself. The District Commissioner thinks Okonkwo’s story might make an interesting paragraph in the book he plans to write about ‘pacifying’ the region."]],
chars:[["Okonkwo","A proud warrior and farmer whose fear of weakness drives his actions."],["Unoka","Okonkwo’s father; a gentle, debt-ridden musician."],["Nwoye","Okonkwo’s eldest son; sensitive, and eventually a Christian convert."],["Ezinma","Okonkwo’s beloved, clever daughter."],["Ekwefi","Ezinma’s mother, Okonkwo’s second wife."],["Ikemefuna","A boy given to Umuofia who becomes part of Okonkwo’s family."],["Obierika","Okonkwo’s thoughtful friend who questions some customs."],["Uchendu","Okonkwo’s wise uncle in Mbanta."],["Mr. Brown","A patient missionary who seeks to understand Igbo beliefs."],["Reverend Smith","A strict missionary who sees no value in Igbo culture."],["The District Commissioner","The British official who represents colonial rule."]],
themes:[["Tradition vs. change","The clan’s customs give life order and meaning, but the novel also shows their costs and the arrival of forces that will change them forever."],
["Masculinity and fear of weakness","Okonkwo’s idea of manhood, built against his father, leads him to violence and rigidity."],
["Colonialism and cultural collision","Missionaries and colonial courts divide the clan from within and replace its laws with foreign ones."],
["Fate and the chi","The Igbo idea of a personal spirit, or chi, raises the question of whether Okonkwo shapes his fate or is destroyed by it."],
["Who tells the story","The novel itself answers colonial accounts of Africa, while its final page shows how outsiders would misrepresent Okonkwo."]],
syms:[["Yams","Wealth, hard work and manhood in Igbo society."],
["Fire","Okonkwo’s temper and energy; it burns brightly but leaves only ashes."],
["Locusts","Their sudden arrival foreshadows the coming of the colonizers."],
["The egwugwu","Masked ancestral spirits who judge disputes; unmasking one is an attack on the clan’s soul."],
["The title","From Yeats’s poem about a world whose center cannot hold; it describes the collapse of both Okonkwo and his society."]],
devs:[["Proverbs","Igbo proverbs show the culture’s wisdom and how speech is valued; Achebe calls them the palm oil with which words are eaten."],
["Embedded folktales","Stories such as the tale of the tortoise and the birds reflect the novel’s themes."],
["Igbo vocabulary","Untranslated Igbo words keep readers inside the culture rather than translating it into European terms."],
["Irony","The District Commissioner’s planned book title shows how colonizers misunderstood the people they ruled."],
["Three-part structure","The novel moves from a full portrait of the clan, to exile, to collapse."]],
ct:[{q:"Is Okonkwo a tragic hero?",claim:"Take a position using the definition of a tragic hero.",ev:"Ch. 1 (his rise), Ch. 7 (Ikemefuna), Ch. 13 (the accident and exile), Ch. 24–25 (his final acts).",rs:"Identify his greatness, his flaw and the moment of his fall.",cc:"His violence toward his family makes him hard to admire. Can he still be tragic?",m:"Model claim: Okonkwo is a tragic hero whose fear of weakness, his fatal flaw, turns his strength into rigidity and leads him to destroy himself when his world changes."},
{q:"Is Okonkwo destroyed by colonialism or by his own flaws?",claim:"Weigh the two causes and decide which matters more.",ev:"Ch. 2 (his fear of weakness), Ch. 7 (Ikemefuna), Ch. 16–18 (the missionaries), Ch. 23–25 (the court and his death).",rs:"Consider what might have happened to Okonkwo if the British had never come.",cc:"Is it possible to separate the two causes at all?",m:"Model claim: Okonkwo’s flaws make him unable to bend, but colonialism is what breaks his world; the tragedy lies in a rigid man meeting a force too large to resist."},
{q:"Why does Achebe include Igbo words, proverbs and folktales?",claim:"Explain the effect of these choices.",ev:"Ch. 1 (the proverb about palm oil), Ch. 11 (the tortoise tale), and the use of Igbo words throughout.",rs:"Consider how these choices change the reader’s view of Igbo society.",cc:"Do untranslated words make the novel harder for outsiders to understand? Is that a problem?",m:"Model claim: Achebe’s use of Igbo language and stories shows that the clan has its own complex literature and wisdom, answering the colonial claim that Africa had no culture."},
{q:"Compare Mr. Brown and Reverend Smith. Is there a ‘good’ colonizer?",claim:"Evaluate the two missionaries.",ev:"Ch. 21 (Mr. Brown’s conversations with Akunna), Ch. 22 (Reverend Smith’s arrival and the burning of the church).",rs:"Consider their methods and the results of their work.",cc:"Even Mr. Brown’s gentle approach changed the clan forever. Does that make him less ‘good’?",m:"Model claim: Mr. Brown is kinder than Reverend Smith, but both serve the same colonial project; Achebe suggests that respect does not undo the harm of replacing a people’s way of life."},
{q:"Why does the novel end with the District Commissioner’s point of view?",claim:"Explain the effect of the final paragraph.",ev:"Ch. 25 (the Commissioner’s thoughts and planned book title).",rs:"Compare the reader’s understanding of Okonkwo with the Commissioner’s.",cc:"Is the ending bitter, ironic or both?",m:"Model claim: The ending reveals how a whole life and culture are reduced to a paragraph by an outsider, which is exactly the kind of story Achebe wrote this novel to correct."},
{q:"Cross-text: Compare Okonkwo with Macbeth as tragic heroes.",claim:"Argue what the two characters share and how they differ.",ev:"Things Fall Apart Ch. 7 and Ch. 25; Macbeth 1.7 and 5.5.",rs:"Compare their strength, their flaws and how each falls.",cc:"Macbeth’s fall comes from his own crimes; Okonkwo’s comes partly from outside forces. Is the comparison fair?",m:"Model claim: Both men are great warriors undone by a flaw — Macbeth by ambition and Okonkwo by fear of weakness — but Okonkwo’s tragedy also belongs to his whole people."}],
kz:{"Tradition vs. change":"傳統與變遷","Masculinity and fear of weakness":"男子氣概與對軟弱的恐懼","Colonialism and cultural collision":"殖民主義與文化衝突","Fate and the chi":"命運與 chi（個人守護靈）","Who tells the story":"由誰來講故事","Yams":"山藥","Locusts":"蝗蟲","The egwugwu":"egwugwu（祖靈）","The title":"書名","Proverbs":"諺語","Embedded folktales":"嵌入的民間故事","Igbo vocabulary":"伊博語詞彙","Three-part structure":"三部式結構"},
zh:{bg:["Chinua Achebe 的第一部小說，1958 年出版，比奈及利亞脫離英國獨立早兩年。故事發生在 1800 年代末奈及利亞東南部的伊博族之間，時間就在英國傳教士與殖民政府到來之前和期間。",
"Achebe 寫這部小說，部分是為了回應像 Joseph Conrad《黑暗之心》這類把非洲人描寫成沒有歷史、沒有文化的歐洲小說。他從內部呈現伊博社會的法律、宗教、詩歌與政治。書名取自 W. B. Yeats 1920 年的詩作〈The Second Coming〉。",
"這是非洲作家作品中讀者最多的書之一。本書仍受版權保護，因此只能引用短句。內容提醒：小說中有暴力、一名男孩被殺，以及自殺的情節。"],
sum:["Okonkwo 是 Umuofia 村著名的摔角手與戰士。他以父親 Unoka 為恥，Unoka 是一位溫和、死時負債累累的樂師，因此 Okonkwo 害怕顯得軟弱，嚴厲地管教家人。Umuofia 從鄰村接收了一個叫 Ikemefuna 的男孩，作為一樁命案的賠償；他在 Okonkwo 家住了三年，成為 Okonkwo 的兒子 Nwoye 心中的哥哥。當神諭宣告 Ikemefuna 必須死時，一位長老警告 Okonkwo 不要參與，但 Okonkwo 為了不顯得軟弱，親手給了最後一擊。Nwoye 深受打擊。",
"Ikemefuna 死後，Okonkwo 心神不寧。他最疼愛的女兒 Ezinma 生病了，一位女祭司在夜裡把她帶到神諭的洞穴，她的母親在後面驚恐地跟著。小說呈現了婚禮、收成、由戴面具的祖靈主持的審判，以及民間故事。在一位長老的葬禮上，Okonkwo 的槍意外走火，打死了一個十六歲的男孩。依照習俗，Okonkwo 必須離開部族七年；他的家園被燒毀，他帶著家人逃到母親的家鄉 Mbanta。",
"Okonkwo 的舅舅 Uchendu 提醒他，人在悲傷的時候屬於母親的土地。消息傳來，Abame 村的人殺了一個騎腳踏車的白人之後，整個村子被白人消滅了。基督教傳教士來到 Mbanta，贏得了信徒，特別是那些被部族排斥的人。Nwoye 加入了他們，Okonkwo 和他斷絕關係。Okonkwo 渴望回去重振自己的名聲。",
"Okonkwo 回到 Umuofia，發現這裡已被教堂、殖民法院和政府差役改變。有耐心的傳教士 Brown 先生被頑固的 Smith 牧師取代。一個狂熱的信徒揭下一位祖靈的面具後，部族燒毀了教堂。地區專員設計騙六位領袖（包括 Okonkwo）來開會，把他們關起來羞辱，直到村子繳了罰款才放人。在一場決定是否開戰的集會上，Okonkwo 殺了一名法院差役，其他人卻讓其餘的差役逃走了。明白族人不會開戰之後，Okonkwo 上吊自殺。地區專員心想，Okonkwo 的故事也許能在他打算寫的那本關於「平定」這個地區的書中，構成有趣的一段。"],
chars:["驕傲的戰士與農夫，對軟弱的恐懼主宰了他的行為。","Okonkwo 的父親；溫和、負債累累的樂師。","Okonkwo 的長子；敏感，最後皈依基督教。","Okonkwo 鍾愛、聰明的女兒。","Ezinma 的母親，Okonkwo 的第二個妻子。","被送到 Umuofia、成為 Okonkwo 家一員的男孩。","Okonkwo 深思熟慮的朋友，會質疑某些習俗。","Okonkwo 在 Mbanta 的睿智舅舅。","試圖理解伊博信仰、有耐心的傳教士。","認為伊博文化毫無價值的嚴厲傳教士。","代表殖民統治的英國官員。"],
themes:["部族的習俗讓生活有秩序、有意義，但小說也呈現了這些習俗的代價，以及即將永遠改變它們的外來力量。","Okonkwo 的男子氣概觀念是以父親為反面教材建立的，這讓他變得暴力又僵化。","傳教士與殖民法院從內部分裂部族，並以外來的法律取代部族的法律。","伊博人「chi」（個人守護靈）的觀念引出一個問題：是 Okonkwo 塑造了自己的命運，還是命運毀了他？","這部小說本身就是對殖民者描寫非洲的回應，而最後一頁則顯示外人會如何扭曲 Okonkwo 的形象。"],
syms:["伊博社會中財富、勤奮與男子氣概的象徵。","Okonkwo 的脾氣與活力；燒得熾烈，最後只留下灰燼。","蝗蟲的突然到來，預示了殖民者的來臨。","審理糾紛、戴著面具的祖靈；揭下他們的面具，就是攻擊部族的靈魂。","取自 Yeats 那首關於一個「中心無法維繫」的世界的詩；它描述了 Okonkwo 和他的社會的雙重崩潰。"],
devs:["伊博諺語展現出這個文化的智慧，以及他們多麼重視說話的藝術；Achebe 稱諺語是「吃話語時配的棕櫚油」。","像烏龜與鳥的故事這樣的民間故事，映照出小說的主題。","未加翻譯的伊博語詞彙，讓讀者留在這個文化之中，而不是用歐洲的語彙來轉譯它。","地區專員計畫的書名，顯示出殖民者對他們所統治的人民有多麼誤解。","小說從部族的完整描繪，走向流亡，最後走向崩潰。"],
ct:[{q:"Okonkwo 是悲劇英雄嗎？",claim:"用悲劇英雄的定義表明立場。",ev:"第 1 章（他的崛起）、第 7 章（Ikemefuna）、第 13 章（意外與流亡）、第 24–25 章（他最後的行動）。",rs:"找出他的偉大之處、他的缺陷，以及他墜落的時刻。",cc:"他對家人的暴力讓人很難欽佩他。他還能算是悲劇人物嗎？",m:"參考論點：Okonkwo 是一位悲劇英雄，他對軟弱的恐懼是他的致命缺陷，讓他的力量變成僵化，並在世界改變時導致他自我毀滅。"},
{q:"毀掉 Okonkwo 的是殖民主義，還是他自己的缺陷？",claim:"權衡這兩個原因，判斷哪一個更重要。",ev:"第 2 章（他對軟弱的恐懼）、第 7 章（Ikemefuna）、第 16–18 章（傳教士）、第 23–25 章（法院與他的死）。",rs:"想一想，如果英國人從未到來，Okonkwo 可能會有什麼結局。",cc:"這兩個原因真的能分開嗎？",m:"參考論點：Okonkwo 的缺陷讓他無法彎曲，但真正打碎他世界的是殖民主義；悲劇就在於一個僵化的人遇上了一股大到無法抵抗的力量。"},

"Contested usage":"英文的用法會隨時間改變，有些「規則」仍有爭議。要同時知道傳統規則與現代看法：句子以介系詞結尾、分裂不定詞（to boldly go）都已被廣泛接受；可數的東西用 fewer，不可數的量用 less；主要的格式手冊現在都接受單數的 they。有疑問時，請查閱最新的字典或格式手冊。",

"Varying syntax for effect":"好的寫作者會變換句子的長短與結構來製造效果。在幾個長句後接一個短句，可以產生強調的效果。掉尾句（periodic sentence）把主要意思留到最後，以營造懸念；鬆散句（cumulative sentence）先說主要意思，再補充細節。倒裝句和刻意使用的片段句也能用來營造風格。",
"Parallelism & antithesis":"修辭上的平行結構重複相同的文法模式，以製造節奏與強調。對比法（antithesis）以平行的形式呈現相反的概念，例如「不要問國家能為你做什麼，要問你能為國家做什麼」。可以在演講和結論中使用這些句型，並學會在著名演說中分析它們。",
"Subjunctive mood":"假設語氣用來表達願望、與事實相反的情況和要求。在願望與假想的條件句中，所有主詞都用 were（If I were rich…）；在表示要求或建議的動詞與片語後面，動詞用原形（The judge insists that she confess；It is essential that he arrive）。",

"Style manuals":"不同領域使用不同的格式手冊。MLA（美國現代語言學會）用於英文與人文學科，採用「作者＋頁碼」的引用方式：(Fitzgerald 180)。APA（美國心理學會）用於社會科學，採用「作者＋年份」的方式：(Smith, 2020, p. 4)。Chicago 格式常用於歷史與出版界，通常使用腳註。請一律依照老師或出版單位要求的格式。"});

function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)&&!NOVELTY.test(v.name))}catch(e){VOICES=[]}}
function bestVoice(){
  if(S.voice){const v=VOICES.find(x=>x.name===S.voice);if(v)return v}
  const us=VOICES.filter(v=>/en[-_]US/i.test(v.lang));
  for(const p of PREF){const v=us.find(x=>p.test(x.name))||VOICES.find(x=>p.test(x.name));if(v)return v}
  return us.find(v=>v.localService)||us[0]||VOICES[0]||null}
function speak(w){try{loadVoices();const u=new SpeechSynthesisUtterance(w),v=bestVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang="en-US";u.rate=.92;u.pitch=1;u.volume=1;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
loadVoices();try{speechSynthesis.addEventListener("voiceschanged",()=>{const n=VOICES.length;loadVoices();if(VOICES.length!==n&&S.tab==="vocab"&&!quiz)render()})}catch(e){}
function voiceSel(){if(!VOICES.length)return "";const cur=(bestVoice()||{}).name;return `<label class="meta" for="voicesel">Voice</label><select id="voicesel" style="flex:0 1 260px">${VOICES.map(v=>`<option value="${esc(v.name)}" ${v.name===cur?"selected":""}>${esc(v.name.replace(/^Microsoft |^Google /,""))} (${v.lang})</option>`).join("")}</select><button class="icon" data-say="Welcome to English Lab" aria-label="Test voice">▶</button>`}

function renderGrades(){$("grades").innerHTML=[9,10,11,12].map(g=>`<button data-g="${g}" aria-pressed="${S.g===g}">Grade ${g}</button>`).join("")}
function renderTabs(){$("tabs").innerHTML=[["vocab","Vocabulary"],["gram","Grammar"],["novel","Novels"]].map(([k,l])=>`<button data-tab="${k}" aria-pressed="${S.tab===k}">${l}${Z(l)}</button>`).join("")}

function soon(txt){return `<div class="soon"><h3>Coming in the next batch</h3><p>${txt}</p></div>`}

let quiz=null;
function vocabView(){
  const V=VOC[S.g];if(!V)return `<h2>Grade ${S.g} vocabulary</h2>`+soon("360 words (36 units × 10) of academic and literary vocabulary at the Grade "+S.g+" level, plus key words from each novel, increasing in difficulty.");
  const total=V.reduce((a,u)=>a+u[1].length,0),done=V.reduce((a,u)=>a+u[1].filter(w=>learned[w[0]]).length,0);
  const u=V[S.unit];
  let h=`<h2>Grade ${S.g} vocabulary</h2><p class="meta">${total} words · ${V.length} units · 10 words a week for the school year · Learned ${done}/${total}</p>
  <div class="caps">${V.map((x,i)=>{const n=x[1].filter(w=>learned[w[0]]).length;return `<button class="cap ${n===x[1].length?"full":""}" data-unit="${i}" aria-pressed="${S.unit===i}" title="${esc(x[0])}">Unit ${i+1}${n?`<small>${n}/10</small>`:""}</button>`}).join("")}</div><div class="row">${voiceSel()}</div>
  <div class="row"><b>${esc(u[0])}</b><button class="pill" data-quiz="1" aria-pressed="${!!quiz}">${quiz?"Back to cards":"Quiz this unit"}</button></div>`;
  if(quiz)return h+quizView();
  return h+`<div class="cards">${u[1].map(w=>`<div class="card ${learned[w[0]]?"done":""}">
   <div class="w"><div><b>${w[0]}</b><div class="ipa">${w[1]}</div>${VZ(w)}</div><button class="icon" data-say="${w[0]}" aria-label="Pronounce ${w[0]}">🔊</button></div>
   <div><span class="pos">${w[2]}</span>${esc(w[3])}</div>   <div class="ex">${esc(w[5]).replace(new RegExp("\\b("+w[0].slice(0,Math.max(4,w[0].length-3))+"\\w*)","i"),"<mark>$1</mark>")}</div>
   <div class="root">Root: ${esc(w[6])}</div>
   <label class="chk"><input type="checkbox" data-learn="${w[0]}" ${learned[w[0]]?"checked":""}> Learned</label></div>`).join("")}</div>`;
}
function newQuiz(){const ws=VOC[S.g][S.unit][1];const order=ws.map((_,i)=>i).sort(()=>Math.random()-.5);quiz={ws,order,i:0,score:0,ans:null};}
function quizView(){
  const {ws,order,i,score,ans}=quiz;
  if(i>=order.length)return `<div class="quiz"><h3>Score: ${score}/${order.length}</h3><p>${score>=8?"Great work. Mark these words as learned.":"Review the cards, then try again."}</p><button class="pill" data-requiz="1">Try again</button></div>`;
  const w=ws[order[i]];
  if(!quiz.opts||quiz.oi!==i){const others=ws.filter(x=>x!==w).sort(()=>Math.random()-.5).slice(0,3);quiz.opts=[w,...others].sort(()=>Math.random()-.5);quiz.oi=i}
  return `<div class="quiz"><p class="meta">Question ${i+1} of ${order.length} · Score ${score}</p><h3>${esc(w[3])}</h3>${ans?VZ(w):""}
  <div class="opts">${quiz.opts.map(o=>{let c="";if(ans){if(o===w)c="right";else if(o[0]===ans)c="wrong"}return `<button class="opt ${c}" data-vq="${o[0]}" ${ans?"disabled":""}>${o[0]}</button>`}).join("")}</div>
  ${ans?`<div class="fb">${ans===w[0]?"✓ Correct":"✗ The answer is <b>"+w[0]+"</b>"} — <i>${esc(w[5])}</i></div><div class="row"><button class="pill" data-vnext="1">Next</button></div>`:""}</div>`;
}

let gAns={};
function gramView(){
  const G=GRAM[S.g];if(!G)return `<h2>Grade ${S.g} grammar & language</h2>`+soon("Planned topics: "+PLAN[S.g].gram.join(" · "));
  const t=G[S.gt];
  return `<h2>Grade ${S.g} grammar & language</h2><p class="meta">${({9:"Based on CA CCSS Language standards for grades 9–10, with two foundational review topics.",10:"Based on CA CCSS Language and Writing standards for grades 9–10, focused on revising and polishing academic writing.",11:"Based on CA CCSS Language standards for grades 11–12, focused on usage, style and rhetorical choices.",12:"Based on CA CCSS Language and Writing standards for grades 11–12, focused on college-level analysis and research writing."})[S.g]||""}</p>
  <div class="gtopics"><div class="glist">${G.map((x,i)=>`<button data-gt="${i}" aria-pressed="${S.gt===i}">${x.t}${ZB(x.t)}</button>`).join("")}</div>
  <div><span class="code">${t.c}</span><h2>${t.t}${Z(t.t)}</h2><p>${esc(t.r)}</p>${S.zh&&ZR[t.t]?`<p class="zh zr">${ZR[t.t]}</p>`:""}
  <div class="eg">${t.y.map(s=>`<div class="y">${esc(s)}</div>`).join("")}${t.n.map(s=>`<div class="n">${esc(s)}</div>`).join("")}</div>
  <h3>Practice (${t.q.filter((_,i)=>gAns[S.g+"-"+S.gt+"-"+i]===t.q[i][2]).length}/${t.q.length} correct)</h3>
  ${t.q.map((q,i)=>{const a=gAns[S.g+"-"+S.gt+"-"+i];return `<div class="quiz" style="margin:10px 0"><b>${i+1}. ${esc(q[0])}</b><div class="opts">${q[1].map((o,j)=>{let c="";if(a!==undefined){if(j===q[2])c="right";else if(j===a)c="wrong"}return `<button class="opt ${c}" data-gq="${i}" data-o="${j}" ${a!==undefined?"disabled":""}>${esc(o)}</button>`}).join("")}</div>${a!==undefined?`<div class="fb">${a===q[2]?"✓ Correct.":"✗ Not quite."} ${esc(q[3])}</div>`:""}</div>`}).join("")}
  <button class="pill" data-greset="1">Reset this topic</button></div></div>`;
}

function novelView(){
  const BK=BOOKSG[S.g];const list=BK?BK.map(b=>[b.title,b.author,b.blurb,1]):PLAN[S.g].books.map(b=>[...b,0]);
  if(S.book!==null&&BK&&BK[S.book])return bookView();
  return `<h2>Grade ${S.g} novels</h2><p class="meta">Each guide: background · chapter summaries · characters · themes & symbols · literary devices · critical thinking (claim–evidence–reasoning).</p>
  <div class="books">${list.map((b,i)=>`<button class="book" ${b[3]?`data-book="${i}"`:"disabled"}><b>${b[0]}</b><span class="meta">${b[1]}</span><div>${b[2]}</div>${b[3]?`<span class="badge" style="background:var(--blue);color:var(--bg)">Open guide</span>`:`<span class="badge">Next batch</span>`}</button>`).join("")}</div>`;
}
function bookView(){
  const B=BOOKSG[S.g][S.book],secs=[["bg","Background"],["sum","Summary"],["chars","Characters"],["themes","Themes & Symbols"],["devs","Literary Devices"],["ct","Critical Thinking"]];
  let body="";
  const zt=(k,i,f)=>{if(!S.zh||!B.zh||!B.zh[k])return "";let v=B.zh[k][i];if(f&&v)v=v[f];return v?`<p class="zh zr">${v}</p>`:""};
  const zd=(i,f)=>{const t=S.zh&&B.zh&&B.zh.ct[i]?B.zh.ct[i][f]:"";return t?`<div class="zh">${t}</div>`:""};
  if(S.bs==="bg")body=B.bg.map((p,i)=>`<p>${esc(p)}</p>${zt("bg",i)}`).join("");
  if(S.bs==="sum")body=B.sum.map((c,i)=>`<div class="ch"><b>${c[0]}</b><p>${esc(c[1])}</p>${zt("sum",i)}</div>`).join("");
  if(S.bs==="chars")body=`<div class="people">${B.chars.map((c,i)=>`<div><b>${c[0]}</b><br>${esc(c[1])}${S.zh&&B.zh?`<div class="zh">${B.zh.chars[i]||""}</div>`:""}</div>`).join("")}</div>`;
  if(S.bs==="themes")body=`<h3>Themes${Z("Themes")}</h3>`+B.themes.map((t,i)=>`<div class="ch"><b>${t[0]}</b>${Z(t[0])}<p>${esc(t[1])}</p>${zt("themes",i)}</div>`).join("")+`<h3>Symbols${Z("Symbols")}</h3>`+B.syms.map((t,i)=>`<div class="ch"><b>${t[0]}</b>${Z(t[0])}<p>${esc(t[1])}</p>${zt("syms",i)}</div>`).join("");
  if(S.bs==="devs")body=B.devs.map((t,i)=>`<div class="ch"><b>${t[0]}</b>${Z(t[0])}<p>${esc(t[1])}</p>${zt("devs",i)}</div>`).join("");
  if(S.bs==="ct")body=`<p class="meta">Answer each question with a claim, at least two pieces of evidence (cite ${B.cite}), and reasoning that connects them. Then answer the counterclaim.</p>${S.zh?`<p class="zh zr">每題都要提出主張、至少兩項證據（標示出處），以及連結兩者的推理，最後回應反方論點。</p>`:""}`+B.ct.map((c,i)=>`<div class="cer"><b>${i+1}. ${esc(c.q)}</b>${zd(i,"q")}<dl><dt>Claim${Z("Claim")}</dt><dd>${esc(c.claim)}${zd(i,"claim")}</dd><dt>Evidence${Z("Evidence")}</dt><dd>${esc(c.ev)}${zd(i,"ev")}</dd><dt>Reasoning${Z("Reasoning")}</dt><dd>${esc(c.rs)}${zd(i,"rs")}</dd><dt>Counterclaim${Z("Counterclaim")}</dt><dd>${esc(c.cc)}${zd(i,"cc")}</dd></dl><details><summary>Show model claim</summary><p>${esc(c.m)}</p>${zd(i,"m")}</details></div>`).join("");
  return `<button class="pill" data-back="1">← All Grade ${S.g} novels</button><h2 style="margin-top:14px">${B.title}</h2><p class="meta">${B.author}</p>
  <div class="row">${secs.map(([k,l])=>`<button class="pill" data-bs="${k}" aria-pressed="${S.bs===k}">${l}${Z(l)}</button>`).join("")}</div><div class="sec">${body}</div>`;
}

function render(){$("lang").innerHTML=`<button data-zh="0" aria-pressed="${!S.zh}">English</button><button data-zh="1" aria-pressed="${!!S.zh}">English + 中文</button>`;renderGrades();renderTabs();$("view").innerHTML=S.tab==="vocab"?vocabView():S.tab==="gram"?gramView():novelView();save()}

document.addEventListener("change",e=>{if(e.target.id==="unitsel"){S.unit=+e.target.value;quiz=null;render()}else if(e.target.id==="voicesel"){S.voice=e.target.value;save();speak("Welcome to English Lab")}});
document.addEventListener("click",e=>{
  const b=e.target.closest("button,input");if(!b)return;const d=b.dataset;
  if(d.zh!==undefined){S.zh=d.zh==="1";try{history.replaceState(null,"",S.zh?"#zh-tw":"#en")}catch(err){location.hash=S.zh?"zh-tw":"en"}}
  else if(d.g){S.g=+d.g;S.book=null;S.unit=0;S.gt=0;quiz=null}
  else if(d.tab){S.tab=d.tab;quiz=null}
  else if(d.unit){S.unit=+d.unit;quiz=null}
  else if(d.say){speak(d.say);return}
  else if(d.learn){learned[d.learn]=b.checked;store.set("el-learned",learned)}
  else if(d.quiz){quiz?quiz=null:newQuiz()}
  else if(d.requiz)newQuiz();
  else if(d.vq){quiz.ans=d.vq;if(d.vq===quiz.ws[quiz.order[quiz.i]][0])quiz.score++}
  else if(d.vnext){quiz.i++;quiz.ans=null}
  else if(d.gt){S.gt=+d.gt}
  else if(d.gq!==undefined&&d.o!==undefined){gAns[S.g+"-"+S.gt+"-"+d.gq]=+d.o}
  else if(d.greset){GRAM[S.g][S.gt].q.forEach((_,i)=>delete gAns[S.g+"-"+S.gt+"-"+i])}
  else if(d.book!==undefined){S.book=+d.book;S.bs="bg"}
  else if(d.back){S.book=null}
  else if(d.bs){S.bs=d.bs}
  else return;
  const y=window.scrollY;render();if(d.g||d.tab||d.book!==undefined||d.back||d.unit)window.scrollTo(0,0);else window.scrollTo(0,y);
});
window.addEventListener("hashchange",()=>{if(location.hash==="#zh-tw")S.zh=true;else if(location.hash==="#en")S.zh=false;else return;render()});
render();
}
</script>
</body>
</html>
